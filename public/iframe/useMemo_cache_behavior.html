<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>useMemo 캐시 동작</title>
<style>
  :root{
    --font-mono:ui-monospace,"SF Mono",Menlo,Monaco,"Cascadia Code",Consolas,monospace;
    --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",Roboto,sans-serif;
    --color-page:#0a0a0f;
    --color-background-primary:#0f1117;
    --color-background-secondary:#141823;
    --color-background-tertiary:#1b2233;
    --color-background-info:#0c1d33;
    --color-background-warning:#2a2207;
    --color-background-success:#0c2a20;
    --color-text-primary:#e2e8f0;
    --color-text-secondary:#94a3b8;
    --color-text-tertiary:#64748b;
    --color-text-info:#60a5fa;
    --color-text-warning:#fbbf24;
    --color-text-success:#6ee7b7;
    --color-border-primary:#334155;
    --color-border-secondary:#334155;
    --color-border-tertiary:#1e293b;
    --color-border-info:#3b82f6;
    --border-radius-md:8px;
    --border-radius-lg:12px;
  }
  *{box-sizing:border-box}
  body{margin:0;padding:20px 16px;background:var(--color-page);color:var(--color-text-primary);font-family:var(--font-sans);line-height:1.5}
  .wrap{margin:0 auto}
  button{font-family:inherit;cursor:pointer}
  input[type=range]{accent-color:#a78bfa}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style>
<style>
  :root { --gap: 8px; }
  .section { margin: 1.5rem 0; }
  .label { font-size: 12px; color: var(--color-text-secondary); margin-bottom: 6px; font-weight: 500; }
  .timeline { display: flex; flex-direction: column; gap: 6px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row-label { font-size: 12px; color: var(--color-text-secondary); width: 110px; flex-shrink: 0; text-align: right; }
  .cells { display: flex; gap: 4px; flex: 1; min-width: 0; }
  .cell {
    flex: 1; min-width: 0; height: 36px; border-radius: 6px; border: 0.5px solid var(--color-border-tertiary);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 500; transition: background 0.2s, border-color 0.2s;
    background: var(--color-background-secondary);
    color: var(--color-text-secondary);
  }
  .cell.changed { background: var(--color-background-warning); border-color: #fbbf24; color: #fbbf24; }
  .cell.cached  { background: var(--color-background-success); border-color: #34d399; color: #6ee7b7; }
  .cell.rerun   { background: #2a1213; border-color: #ef4444; color: #fca5a5; }
  .cell.stale   { background: var(--color-background-tertiary); border-color: #a78bfa; color: #a78bfa; opacity: 0.6; }

  .legend { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .leg { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--color-text-secondary); }
  .leg-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }

  .tab-bar { display: flex; gap: 4px; margin-bottom: 16px; }
  .tab {
    padding: 6px 14px; border-radius: 6px; font-size: 12px; font-weight: 500; cursor: pointer;
    border: 0.5px solid var(--color-border-tertiary); background: var(--color-background-secondary);
    color: var(--color-text-secondary); transition: background 0.15s, color 0.15s;
  }
  .tab.active { background: var(--color-background-primary); color: var(--color-text-primary); border-color: var(--color-border-primary); }

  .result-card {
    border: 0.5px solid var(--color-border-tertiary); border-radius: 8px;
    padding: 10px 14px; background: var(--color-background-primary); margin-top: 16px;
  }
  .result-row { display: flex; justify-content: space-between; align-items: center; padding: 3px 0; font-size: 12px; }
  .result-key { color: var(--color-text-secondary); }
  .badge {
    font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 4px;
  }
  .badge.ok  { background: var(--color-background-success); color: #6ee7b7; }
  .badge.bad { background: #2a1213; color: #fca5a5; }

  .scenario-desc {
    font-size: 12px; color: var(--color-text-secondary);
    border-left: 2px solid var(--color-border-tertiary);
    padding-left: 10px; margin-bottom: 14px; line-height: 1.6;
  }

  .divider { border: none; border-top: 0.5px solid var(--color-border-tertiary); margin: 1.2rem 0; }

  .tick-labels { display: flex; gap: 4px; padding-left: calc(110px + 8px); margin-bottom: 2px; }
  .tick { flex: 1; min-width: 0; font-size: 10px; color: var(--color-text-tertiary); text-align: center; }
</style>
</head>
<body>
<div class="wrap">
<h2 class="sr-only">useMemo 재활용 동작 비교. items 참조가 매번 새로 생기는 경우, 안정한 경우, 그리고 재료 목록에 없는 값을 계산이 몰래 쓰는 경우 — 앞의 둘은 느려질 뿐이고 마지막만 답이 틀린다.</h2>
<div style="padding: 1rem 0">
  <div class="tab-bar">
    <div class="tab active" onclick="setTab(0)">items를 매번 새로 만들면</div>
    <div class="tab" onclick="setTab(1)">items 참조가 그대로면</div>
    <div class="tab" onclick="setTab(2)">재료에 안 적어둔 값을 쓰면</div>
  </div>

  <div id="desc" class="scenario-desc"></div>

  <div class="legend">
    <div class="leg"><div class="leg-dot" style="background:#fbbf24"></div>바뀜</div>
    <div class="leg"><div class="leg-dot" style="background:#34d399"></div>재활용 / 맞음</div>
    <div class="leg"><div class="leg-dot" style="background:#ef4444"></div>다시 계산 / 틀림</div>
    <div class="leg"><div class="leg-dot" style="background:var(--color-background-secondary)"></div>그대로</div>
  </div>

  <div class="tick-labels" id="tick-labels"></div>
  <div class="timeline" id="timeline"></div>

  <div class="result-card" id="result-card"></div>
</div>
</div>

<script>
const TICKS = ['타이핑', '부모 리렌더', 'rawData 변경', '타이핑'];

const SCENARIOS = [
  {
    desc: '부모가 <code>items={data.map(transform)}</code> 처럼 매 렌더마다 새 배열을 내려보내는 경우',
    rows: [
      { label: 'items 참조', cells: ['새로움', '새로움', '새로움', '새로움'] },
      { label: 'useMemo', cells: ['다시 계산', '다시 계산', '다시 계산', '다시 계산'] },
      { label: '화면의 답', cells: ['맞음', '맞음', '맞음', '맞음'] },
    ],
    result: [
      { key: '재활용', val: '\u2717 한 번도 안 됨', ok: false },
      { key: '화면의 답', val: '\u2713 늘 맞음', ok: true },
      { key: '잃는 것', val: '속도', ok: false },
    ],
  },
  {
    desc: '부모가 <code>const items = useMemo(() => ..., [rawData])</code> 로 참조를 안정화해 내려보내는 경우',
    rows: [
      { label: 'items 참조', cells: ['그대로', '그대로', '새로움', '그대로'] },
      { label: 'useMemo', cells: ['재활용', '재활용', '다시 계산', '재활용'] },
      { label: '화면의 답', cells: ['맞음', '맞음', '맞음', '맞음'] },
    ],
    result: [
      { key: '재활용', val: '\u2713 rawData 바뀔 때만 다시 계산', ok: true },
      { key: '화면의 답', val: '\u2713 늘 맞음', ok: true },
      { key: '잃는 것', val: '없음', ok: true },
    ],
  },
  {
    desc: '참조는 안정한데 계산이 <code>sortAsc</code> 를 쓰면서 재료 목록에는 안 적어둔 경우 — <code>useMemo(() => sort(items, sortAsc), [items])</code>. <strong>무관한 rawData 가 바뀔 때만 우연히 맞아진다</strong> — 이래서 원인을 찾기 어렵다',
    rows: [
      { label: 'items 참조', cells: ['그대로', '그대로', '새로움', '그대로'] },
      { label: 'sortAsc (재료 밖)', cells: ['그대로', '바뀜', '그대로', '바뀜'] },
      { label: 'useMemo', cells: ['재활용', '재활용', '다시 계산', '재활용'] },
      { label: '화면의 답', cells: ['맞음', '틀림', '맞음', '틀림'] },
    ],
    result: [
      { key: '재활용', val: '\u2713 잘 됨', ok: true },
      { key: '화면의 답', val: '\u2717 맞다 틀리다 한다', ok: false },
      { key: '잃는 것', val: '정확성 — 느린 게 아니라 틀린 것', ok: false },
    ],
  },
];

function cls(text) {
  if (text === '새로움' || text === '바뀜') return 'changed';
  if (text === '다시 계산' || text === '틀림') return 'rerun';
  if (text === '재활용' || text === '맞음') return 'cached';
  return '';
}

let activeTab = 0;

function setTab(i) {
  activeTab = i;
  document.querySelectorAll('.tab').forEach((t, idx) => t.classList.toggle('active', idx === i));
  render();
}

function render() {
  const sc = SCENARIOS[activeTab];
  document.getElementById('desc').innerHTML = sc.desc;
  document.getElementById('tick-labels').innerHTML = TICKS.map(t => `<div class="tick">${t}</div>`).join('');
  document.getElementById('timeline').innerHTML = sc.rows.map(r => {
    const cells = r.cells.map(v => `<div class="cell ${cls(v)}">${v === '그대로' ? '\u2014' : v}</div>`).join('');
    return `<div class="row"><div class="row-label">${r.label}</div><div class="cells">${cells}</div></div>`;
  }).join('');
  document.getElementById('result-card').innerHTML = sc.result.map(r =>
    `<div class="result-row"><span class="result-key">${r.key}</span><span class="badge ${r.ok ? 'ok' : 'bad'}">${r.val}</span></div>`
  ).join('');
}

render();
</script>
</body>
</html>
