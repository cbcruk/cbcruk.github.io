<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>날짜 표기 단일 출처 — 타입이 닫고 함수가 통로 (객체 불필요)</title>
<style>
  :root{
    --font-mono:ui-monospace,"SF Mono",Menlo,Monaco,"Cascadia Code",Consolas,monospace;
    --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",Roboto,sans-serif;
    --page:#0a0a0f; --panel:#0f1117; --panel2:#141823;
    --border:#1e293b; --border2:#334155;
    --text:#e2e8f0; --muted:#94a3b8; --dim:#64748b;
    --green:#34d399; --red:#f87171; --amber:#fbbf24; --blue:#60a5fa;
    --radius:8px;
  }
  *{box-sizing:border-box}
  body{margin:0;padding:20px 16px;background:var(--page);color:var(--text);font-family:var(--font-sans);line-height:1.5}
  .wrap{margin:0 auto}
  h1{font-size:15px;font-weight:600;margin:0 0 2px}
  .sub{font-size:12px;color:var(--dim);margin:0 0 12px}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

  .controls{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 10px}
  button{font-family:inherit;font-size:12.5px;padding:7px 11px;border:1px solid var(--border2);border-radius:var(--radius);background:var(--panel2);color:var(--text);cursor:pointer}
  button:hover:not(:disabled){background:#222a3a}
  button:disabled{opacity:.4;cursor:default}
  button.go{border-color:#2d4a73;color:var(--blue)}
  .seg{display:flex;border:1px solid var(--border2);border-radius:999px;overflow:hidden;margin-left:auto}
  .seg span{font-family:var(--font-mono);font-size:11.5px;padding:6px 11px;cursor:pointer;color:var(--dim)}
  .seg span.on{background:#0e1f33;color:var(--blue)}

  svg{display:block;width:100%;height:auto;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius)}
  .box{fill:var(--panel2);stroke:var(--border2)}
  .box.src{stroke:var(--blue)} .box.obj{stroke:var(--amber)}
  .box.dim{opacity:.32}
  .bt{font-family:var(--font-mono);font-size:12px;fill:var(--text)}
  .bs{font-size:9px;fill:var(--dim)}
  .conn{stroke:#2a3346;stroke-width:1.6;fill:none}
  .active{stroke:var(--blue);stroke-width:2.6;fill:none}
  .active.amber{stroke:var(--amber)}
  .cap{margin:9px 2px 0;font-size:12.5px;min-height:36px;font-family:var(--font-mono);color:var(--muted)}
  .cap b{color:var(--text)} .cap .k{color:var(--blue)} .cap .a{color:var(--amber)}
</style>
</head>
<body>
<div class="wrap">
<h1>날짜 표기 단일 출처 — 타입이 닫고, 함수가 통로</h1>
<p class="sub">허용 표기 배열 하나에서 타입·lint 가드·통로 함수가 전부 파생된다. 매핑 객체가 없는 이유는 dayjs가 <b>키=값</b>이기 때문 — i18n과 대비해 보세요</p>
<h2 class="sr-only">dayjs 날짜 표기를 as const 배열 단일 출처로 두면 union 타입, ESLint drift 가드, formatDate 통로 함수가 파생됨을 보여주고, 키=값이라 매핑 객체가 불필요함을 키≠값인 i18n(키→객체→값) 구조와 토글로 대비하는 다이어그램.</h2>

<div class="controls">
  <button class="go" id="step">▶ 단계</button>
  <button id="reset">↻ reset</button>
  <div class="seg" role="tablist" aria-label="대비">
    <span data-mode="dayjs" class="on" role="tab">dayjs (키=값)</span>
    <span data-mode="i18n" role="tab">i18n (키≠값)</span>
  </div>
</div>

<svg id="g" viewBox="0 0 560 312" role="img" aria-label="단일 출처 파생 다이어그램"></svg>
<p class="cap" id="cap"></p>
</div>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const SVG='http://www.w3.org/2000/svg';
  const E=(t,a)=>{const e=document.createElementNS(SVG,t);for(const k in a)e.setAttribute(k,a[k]);return e;};
  let mode='dayjs', i=0;

  const DAYJS={
    boxes:{
      src:  {x:170,y:34, w:220,h:46, cls:'src', t:'DATE_FORMATS', s:'as const · 단일 출처'},
      type: {x:8,  y:230,w:170,h:46, t:'type DateFormat', s:'(typeof …)[number]'},
      fn:   {x:195,y:230,w:170,h:46, t:'formatDate()', s:'유일한 통로 함수'},
      lint: {x:382,y:230,w:170,h:46, t:'ESLint 가드', s:'drift 차단'},
    },
    steps:[
      {to:'type', cap:'① <b>타입이 닫는다</b> — 배열에서 union 파생 <span class="k">(typeof DATE_FORMATS)[number]</span>'},
      {to:'fn',   cap:'② <b>함수가 통로</b> — 모든 날짜 출력이 <span class="k">formatDate(date, fmt)</span> 하나로'},
      {to:'lint', cap:'③ <b>가드도 파생</b> — raw 재사용 시 ESLint 경고 · 출처 1곳에서 타입·통로·가드 전부, <b>매핑 객체 없음</b>'},
    ],
    cap0:'단일 출처: 허용 표기 <b>as const 배열</b>. 포맷 문자열이 곧 <span class="k">키=값</span> → 매핑 객체가 잉여.',
    done:'→ 출처 1곳에서 타입·통로·가드 전부 파생. <b>매핑 객체 없음.</b>',
  };
  const I18N={
    boxes:{
      key: {x:8,  y:132,w:160,h:48, t:"key 'home.title'", s:'식별자'},
      obj: {x:200,y:132,w:160,h:48, cls:'obj', t:'messages { }', s:'키 → 값 매핑'},
      val: {x:392,y:132,w:160,h:48, t:"value '홈'", s:'표시 문자열'},
    },
    steps:[
      {from:'key',to:'obj',amber:true, cap:'① 키만으론 값을 모른다 → <span class="a">메시지 객체</span>를 조회해야'},
      {from:'obj',to:'val',amber:true, cap:'② 객체가 키를 값으로 매핑 — <b>키≠값이라 이 객체가 필수</b> · dayjs엔 이 객체가 <b>없다</b>(키=값)'},
    ],
    cap0:'대비: i18n은 <span class="a">키≠값</span>. 중간 매핑 객체가 본질.',
    done:'→ 객체가 반드시 있어야 함. dayjs엔 바로 이 객체가 <b>없다</b>(키=값이라).',
  };
  const data=()=>mode==='dayjs'?DAYJS:I18N;

  function build(){
    const g=$('g'); g.innerHTML='';
    const defs=E('defs',{});
    [['mb','#60a5fa'],['ma','#fbbf24'],['mk','#2a3346']].forEach(([id,c])=>{
      const m=E('marker',{id,markerWidth:8,markerHeight:8,refX:6,refY:3,orient:'auto'});
      m.appendChild(E('path',{d:'M0,0 L6,3 L0,6 Z',fill:c})); defs.appendChild(m);
    });
    g.appendChild(defs);
    const d=data();
    // connectors (faint)
    d.steps.forEach((st,idx)=>{
      const a=edge(st), ln=E('line',{class:'conn','data-arrow':idx,x1:a.x1,y1:a.y1,x2:a.x2,y2:a.y2,'marker-end':'url(#mk)'});
      g.appendChild(ln);
    });
    // boxes
    for(const k in d.boxes){const b=d.boxes[k];
      g.appendChild(E('rect',{id:'b_'+k,class:'box '+(b.cls||''),x:b.x,y:b.y,width:b.w,height:b.h,rx:8}));
      g.appendChild(txt(b.x+b.w/2,b.y+b.h/2-3,b.t,'bt'));
      g.appendChild(txt(b.x+b.w/2,b.y+b.h/2+12,b.s,'bs'));
    }
  }
  function txt(x,y,s,cls){const t=E('text',{x,y,class:cls,'text-anchor':'middle'});t.textContent=s;return t;}
  function cx(b){return b.x+b.w/2} function cyTop(b){return b.y} function cyBot(b){return b.y+b.h}
  function edge(st){
    const d=data();
    if(st.from){ const a=d.boxes[st.from],b=d.boxes[st.to]; // horizontal
      return {x1:a.x+a.w,y1:a.y+a.h/2,x2:b.x,y2:b.y+b.h/2}; }
    const src=d.boxes.src, b=d.boxes[st.to];               // source(bottom) → derived(top)
    return {x1:cx(src),y1:cyBot(src),x2:cx(b),y2:cyTop(b)};
  }

  function render(){
    const d=data();
    // dim derived boxes not yet revealed (dayjs)
    Object.keys(d.boxes).forEach(k=>{const el=$('b_'+k); if(el) el.classList.remove('dim');});
    // reset arrows
    g_arrows().forEach(ln=>{ ln.setAttribute('class','conn'); ln.setAttribute('marker-end','url(#mk)'); });
    // activate up to i
    for(let s=0;s<i;s++){
      const st=d.steps[s], ln=g_arrows()[s];
      if(ln){ ln.setAttribute('class','active'+(st.amber?' amber':'')); ln.setAttribute('marker-end', st.amber?'url(#ma)':'url(#mb)'); }
    }
    const cur=i>0?d.steps[i-1]:null;
    $('cap').innerHTML = i===0 ? d.cap0 : cur.cap
    $('step').disabled=i>=d.steps.length;
    $('step').textContent=i>=d.steps.length?'완료':(i===0?'▶ 단계':'▶ 다음');
    document.querySelectorAll('.seg span').forEach(sp=>sp.classList.toggle('on',sp.dataset.mode===mode));
  }
  function g_arrows(){return [...$('g').querySelectorAll('[data-arrow]')];}

  function reset(){ i=0; build(); render(); }
  function step(){ const d=data(); if(i>=d.steps.length)return; i++; render(); }

  $('step').onclick=step; $('reset').onclick=reset;
  document.querySelectorAll('.seg span').forEach(sp=>{
    const pick=()=>{ mode=sp.dataset.mode; reset(); };
    sp.onclick=pick; sp.setAttribute('tabindex','0');
    sp.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); pick(); } };
  });
  reset();
})();
</script>
</body>
</html>
