<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>immediate vs deferred 타임라인</title>
<style>
  :root{
    --font-mono:ui-monospace,"SF Mono",Menlo,Monaco,"Cascadia Code",Consolas,monospace;
    --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",Roboto,sans-serif;
    --color-page:#0a0a0f;
    --color-background-primary:#0f1117;
    --color-background-secondary:#141823;
    --color-background-tertiary:#1b2233;
    --color-background-info:#0c1d33;
    --color-background-warning:#2a2207;
    --color-background-success:#0c2a20;
    --color-text-primary:#e2e8f0;
    --color-text-secondary:#94a3b8;
    --color-text-tertiary:#64748b;
    --color-text-info:#60a5fa;
    --color-text-warning:#fbbf24;
    --color-text-success:#6ee7b7;
    --color-border-primary:#334155;
    --color-border-secondary:#334155;
    --color-border-tertiary:#1e293b;
    --color-border-info:#3b82f6;
    --border-radius-md:8px;
    --border-radius-lg:12px;
  }
  *{box-sizing:border-box}
  body{margin:0;padding:20px 16px;background:var(--color-page);color:var(--color-text-primary);font-family:var(--font-sans);line-height:1.5}
  .wrap{margin:0 auto}
  button{font-family:inherit;cursor:pointer}
  input{font-family:inherit}
  input[type=range]{accent-color:#a78bfa}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style>
</head>
<body>
<div class="wrap">
<h2 class="sr-only">검색 입력에 따라 immediate(t)와 deferred(t) 두 시간축이 어긋나는 구간이 stale로 표시되는 인터랙티브 타임라인</h2>
<div style="padding:1rem 0;">
  <div style="position:relative;max-width:360px;margin-bottom:8px;">
    <input id="q" type="text" placeholder="과일 검색 — apple, berry, man…" autocomplete="off" style="width:100%;background:#0f1117;border:1px solid #334155;color:#e2e8f0;border-radius:var(--border-radius-md);padding:8px 10px;font-size:14px;" />
  </div>
  <div id="drop" style="max-width:360px;min-height:120px;background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:6px;transition:opacity .15s;"></div>

  <div style="display:flex;gap:12px;margin:1.25rem 0 0;">
    <div style="flex:1;min-width:0;background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:10px 12px;">
      <div style="font-size:12px;color:var(--color-text-secondary);">immediate(t)</div>
      <div id="m-imm" style="font-size:16px;font-weight:500;font-family:var(--font-mono);min-height:22px;">—</div>
    </div>
    <div style="flex:1;min-width:0;background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:10px 12px;">
      <div style="font-size:12px;color:var(--color-text-secondary);">deferred(t)</div>
      <div id="m-def" style="font-size:16px;font-weight:500;font-family:var(--font-mono);min-height:22px;">—</div>
    </div>
    <div style="flex:1;min-width:0;background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:10px 12px;">
      <div style="font-size:12px;color:var(--color-text-secondary);">isStale</div>
      <div id="m-stale" style="font-size:16px;font-weight:500;font-family:var(--font-mono);min-height:22px;">false</div>
    </div>
  </div>

  <svg id="tl" width="100%" viewBox="0 0 680 170" style="margin-top:1rem;display:block;">
    <text class="lbl" x="8" y="44" style="font-size:12px;" fill="var(--color-text-secondary)">immediate</text>
    <text class="lbl" x="8" y="119" style="font-size:12px;" fill="var(--color-text-secondary)">deferred</text>
    <g id="bands"></g>
    <line x1="92" y1="38" x2="672" y2="38" stroke="var(--color-border-secondary)" stroke-width="0.5"/>
    <line x1="92" y1="113" x2="672" y2="113" stroke="var(--color-border-secondary)" stroke-width="0.5"/>
    <g id="imm-marks"></g>
    <g id="def-marks"></g>
    <line id="nowline" x1="672" y1="20" x2="672" y2="135" stroke="var(--color-border-secondary)" stroke-width="0.5" stroke-dasharray="3 3"/>
    <text x="672" y="152" text-anchor="end" style="font-size:11px;" fill="var(--color-text-tertiary)">now</text>
    <text x="92" y="152" text-anchor="start" style="font-size:11px;" fill="var(--color-text-tertiary)">−5s</text>
  </svg>

  <div style="display:flex;align-items:center;gap:12px;margin-top:1rem;font-size:13px;color:var(--color-text-secondary);">
    <span>fetch latency</span>
    <input id="lat" type="range" min="200" max="1600" value="700" step="100" style="flex:1;min-width:0;" />
    <span id="lat-out" style="min-width:54px;text-align:right;font-family:var(--font-mono);">700ms</span>
  </div>
</div>
</div>

<script>
(function(){
  var FRUITS=['apple','apricot','avocado','banana','blackberry','blueberry','cherry','cranberry','fig','grape','grapefruit','kiwi','lemon','lime','mango','melon','orange','papaya','peach','pear','pineapple','plum','raspberry','strawberry','watermelon'];
  var WINDOW=5000, X0=92, X1=672, W=X1-X0;
  var BLUE='#60a5fa', TEAL='#2dd4bf', AMBER='#fbbf24';

  var immediateVal='', deferredVal='', latency=700;
  var immMarks=[], defMarks=[], bands=[], openBand=null;

  var input=document.getElementById('q');
  var drop=document.getElementById('drop');
  var mImm=document.getElementById('m-imm'), mDef=document.getElementById('m-def'), mStale=document.getElementById('m-stale');
  var gBands=document.getElementById('bands'), gImm=document.getElementById('imm-marks'), gDef=document.getElementById('def-marks');
  var latIn=document.getElementById('lat'), latOut=document.getElementById('lat-out');

  function now(){return performance.now();}
  function show(v){return v===''?'∅':'"'+v+'"';}

  function search(q){
    if(q.length<1) return [];
    return FRUITS.filter(function(f){return f.indexOf(q.toLowerCase())===0;}).slice(0,6);
  }

  function renderDrop(){
    var stale = immediateVal!==deferredVal;
    drop.style.opacity = stale?0.55:1;
    var res = search(deferredVal);
    if(deferredVal===''){
      drop.innerHTML='<div style="padding:8px 10px;color:var(--color-text-tertiary);font-size:13px;">결과는 deferred(t) 기준으로 그려집니다</div>';
      return;
    }
    if(res.length===0){
      drop.innerHTML='<div style="padding:8px 10px;color:var(--color-text-secondary);font-size:13px;">No results</div>';
      return;
    }
    drop.innerHTML=res.map(function(f){
      return '<div style="padding:7px 10px;font-size:14px;border-radius:6px;">'+f+'</div>';
    }).join('');
  }

  function renderState(){
    var stale = immediateVal!==deferredVal;
    mImm.textContent=show(immediateVal);
    mDef.textContent=show(deferredVal);
    mImm.style.color=BLUE;
    mDef.style.color=TEAL;
    mStale.textContent=String(stale);
    mStale.style.color = stale?AMBER:'var(--color-text-secondary)';
  }

  function openStaleIfNeeded(){
    if(immediateVal!==deferredVal && !openBand){
      openBand={start:now(),end:null};
      bands.push(openBand);
    }
  }
  function closeStale(){
    if(immediateVal===deferredVal && openBand){
      openBand.end=now();
      openBand=null;
    }
  }

  input.addEventListener('input',function(e){
    immediateVal=e.target.value;
    immMarks.push({t:now(),v:immediateVal});
    openStaleIfNeeded();
    var captured=immediateVal;
    setTimeout(function(){
      if(immediateVal===captured){
        if(deferredVal!==captured){
          deferredVal=captured;
          defMarks.push({t:now(),v:deferredVal});
        }
        closeStale();
        renderState(); renderDrop();
      }
    },latency);
    renderState(); renderDrop();
  });

  latIn.addEventListener('input',function(e){
    latency=+e.target.value;
    latOut.textContent=latency+'ms';
  });

  function xAt(t){
    var n=now(), start=n-WINDOW;
    if(t<start) return X0;
    return X0 + (t-start)/WINDOW*W;
  }

  function prune(){
    var cutoff=now()-WINDOW-500;
    immMarks=immMarks.filter(function(m){return m.t>=cutoff;});
    defMarks=defMarks.filter(function(m){return m.t>=cutoff;});
    bands=bands.filter(function(b){return (b.end||now())>=cutoff;});
  }

  function svgEl(tag,attrs){
    var e=document.createElementNS('http://www.w3.org/2000/svg',tag);
    for(var k in attrs) e.setAttribute(k,attrs[k]);
    return e;
  }

  function draw(){
    prune();
    var n=now();
    var bh='';
    bands.forEach(function(b){
      var x1=xAt(b.start), x2=xAt(b.end||n);
      if(x2-x1<0.5) x2=x1+0.5;
      bh+='<rect x="'+x1.toFixed(1)+'" y="32" width="'+(x2-x1).toFixed(1)+'" height="87" fill="'+AMBER+'" fill-opacity="0.16"/>';
    });
    gBands.innerHTML=bh;

    function marks(list,y,color){
      var h='';
      list.forEach(function(m){
        var x=xAt(m.t);
        h+='<circle cx="'+x.toFixed(1)+'" cy="'+y+'" r="3" fill="'+color+'"/>';
      });
      return h;
    }
    gImm.innerHTML=marks(immMarks,38,BLUE);
    gDef.innerHTML=marks(defMarks,113,TEAL);

    requestAnimationFrame(draw);
  }

  renderState(); renderDrop();
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
