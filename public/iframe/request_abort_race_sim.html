<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>요청 취소 레이스 시뮬레이션</title>
<style>
  :root{
    --font-mono:ui-monospace,"SF Mono",Menlo,Monaco,"Cascadia Code",Consolas,monospace;
    --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",Roboto,sans-serif;
    --color-page:#0a0a0f;
    --color-background-primary:#0f1117;
    --color-background-secondary:#141823;
    --color-background-tertiary:#1b2233;
    --color-background-info:#0c1d33;
    --color-background-warning:#2a2207;
    --color-background-success:#0c2a20;
    --color-text-primary:#e2e8f0;
    --color-text-secondary:#94a3b8;
    --color-text-tertiary:#64748b;
    --color-text-info:#60a5fa;
    --color-text-warning:#fbbf24;
    --color-text-success:#6ee7b7;
    --color-border-primary:#334155;
    --color-border-secondary:#334155;
    --color-border-tertiary:#1e293b;
    --color-border-info:#3b82f6;
    --border-radius-md:8px;
    --border-radius-lg:12px;
  }
  *{box-sizing:border-box}
  body{margin:0;padding:20px 16px;background:var(--color-page);color:var(--color-text-primary);font-family:var(--font-sans);line-height:1.5}
  .wrap{margin:0 auto}
  button{font-family:inherit;cursor:pointer;background:var(--color-background-primary);color:var(--color-text-primary);border:1px solid var(--color-border-secondary);border-radius:var(--border-radius-md);padding:8px 14px}
  button:hover:not(:disabled){background:#1b2233}
  button:disabled{opacity:.5;cursor:default}
  input[type=range]{accent-color:#a78bfa}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style>
<style>
.stage{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1.25rem 1rem 1rem;margin-top:1rem}
.lanes{display:flex;justify-content:space-between;font-family:var(--font-sans);font-size:11px;color:var(--color-text-tertiary);margin-bottom:6px;padding:0 2px}
.track{position:relative;height:52px;background:var(--color-background-secondary);border-radius:var(--border-radius-md);overflow:hidden}
.zone{position:absolute;top:0;height:100%;font-family:var(--font-mono);font-size:9px;color:var(--color-text-tertiary);display:flex;align-items:flex-end;justify-content:center;padding-bottom:3px}
.boundary{position:absolute;top:0;height:100%;width:0;border-left:1px dashed var(--color-border-secondary)}
.boundary-lbl{position:absolute;top:-16px;transform:translateX(-50%);font-family:var(--font-mono);font-size:9px;color:#fbbf24;white-space:nowrap}
.dot{position:absolute;top:50%;width:13px;height:13px;border-radius:50%;background:#60a5fa;transform:translate(-50%,-50%);transition:none;z-index:3}
.dot.client-dead{background:#ef4444}
.ghost{position:absolute;top:50%;width:13px;height:13px;border-radius:50%;background:#34d399;transform:translate(-50%,-50%);z-index:2;opacity:0}
.sig{position:absolute;top:50%;width:0;height:0;border-radius:50%;background:rgba(239,68,68,0.35);transform:translate(-50%,-50%);z-index:1;pointer-events:none}
.controls{display:flex;gap:8px;margin:1rem 0 0;flex-wrap:wrap}
.readout{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:1rem}
.stat{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:9px 11px}
.stat-l{font-size:10px;color:var(--color-text-tertiary);font-family:var(--font-mono)}
.stat-v{font-size:13px;font-weight:500;margin-top:2px;font-family:var(--font-mono)}
.msg{font-family:var(--font-sans);font-size:12px;color:var(--color-text-secondary);margin-top:10px;min-height:34px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
<h2 class="sr-only">요청을 발사한 뒤 취소 신호가 in-flight 요청을 따라잡는 과정 시뮬레이션. 취소 시점이 전송 완료 경계를 넘었는지에 따라 서버 도달 여부가 갈린다.</h2>

<div class="stage">
  <div class="lanes"><span>Client</span><span>Network</span><span>Server</span></div>
  <div class="track" id="track">
    <div class="zone" id="z-send" style="left:0;width:22%;border-right:0.5px solid var(--color-border-tertiary)">send</div>
    <div class="zone" id="z-net" style="left:22%;width:34%">in-flight</div>
    <div class="zone" id="z-proc" style="left:56%;width:30%;border-left:0.5px solid var(--color-border-tertiary)">processing</div>
    <div class="zone" id="z-resp" style="left:86%;width:14%">resp</div>
    <div class="boundary" id="bnd" style="left:22%"></div>
    <div class="boundary-lbl" id="bnd-lbl" style="left:22%">tSendDone (회수 불가 경계)</div>
    <div class="sig" id="sig"></div>
    <div class="ghost" id="ghost"></div>
    <div class="dot" id="dot" style="left:0"></div>
  </div>

  <div class="readout">
    <div class="stat"><div class="stat-l">Reject</div><div class="stat-v muted" id="r-reject" style="color:var(--color-text-tertiary)">—</div></div>
    <div class="stat"><div class="stat-l">Reached</div><div class="stat-v" id="r-reached" style="color:var(--color-text-tertiary)">—</div></div>
    <div class="stat"><div class="stat-l">Processed</div><div class="stat-v" id="r-proc" style="color:var(--color-text-tertiary)">—</div></div>
  </div>
  <div class="msg" id="msg">"요청 발사"를 누르면 파란 신호가 client → server 로 흐릅니다. 흐르는 동안 "취소"를 눌러 시점별 결과를 확인하세요.</div>

  <div class="controls">
    <button id="fire"><span aria-hidden="true" style="font-size:15px;vertical-align:-2px">▶</span> 요청 발사</button>
    <button id="abort" disabled style="border-color:var(--color-border-secondary)"><span aria-hidden="true" style="font-size:15px;vertical-align:-2px">✕</span> 취소</button>
    <button id="reset"><span aria-hidden="true" style="font-size:15px;vertical-align:-2px">↻</span> 리셋</button>
  </div>
</div>
</div>

<script>
(function(){
  const dot=document.getElementById('dot'), ghost=document.getElementById('ghost'),
        sig=document.getElementById('sig'), track=document.getElementById('track'),
        fireBtn=document.getElementById('fire'), abortBtn=document.getElementById('abort'),
        resetBtn=document.getElementById('reset'), msg=document.getElementById('msg');
  const SEND_DONE=22, RESP=100, DUR=5000;
  let raf=null, start=null, state='idle', pos=0;

  function setStat(id,txt,color){const e=document.getElementById(id);e.textContent=txt;e.style.color=color;}
  function resetStats(){['r-reject','r-reached','r-proc'].forEach(i=>setStat(i,'—','var(--color-text-tertiary)'));}

  function frame(ts){
    if(!start)start=ts;
    const p=Math.min((ts-start)/DUR,1);
    pos=p*100;
    dot.style.left=pos+'%';
    if(p>=1){ finishSuccess(); return; }
    raf=requestAnimationFrame(frame);
  }

  function fire(){
    reset();
    state='running';
    fireBtn.disabled=true; abortBtn.disabled=false;
    msg.textContent='요청 in-flight... 지금 "취소"를 누르면 신호가 발사됩니다.';
    raf=requestAnimationFrame(frame);
  }

  function finishSuccess(){
    state='done'; abortBtn.disabled=true;
    dot.style.background='#34d399';
    setStat('r-reject','false','#6ee7b7');
    setStat('r-reached','true','#6ee7b7');
    setStat('r-proc','true','#6ee7b7');
    msg.textContent='취소 없이 완료. 응답 수신 → promise resolve. 서버 도달·처리 모두 정상.';
  }

  function abort(){
    if(state!=='running')return;
    cancelAnimationFrame(raf);
    state='aborted'; abortBtn.disabled=true;
    const reached = pos >= SEND_DONE;

    sig.style.left=pos+'%';
    sig.style.transition='width .4s,height .4s,opacity .5s';
    sig.style.width='46px'; sig.style.height='46px'; sig.style.opacity='1';
    setTimeout(()=>{sig.style.opacity='0';},450);

    setStat('r-reject','true','#fca5a5');

    if(!reached){
      dot.classList.add('client-dead');
      setStat('r-reached','false','#6ee7b7');
      setStat('r-proc','false','#6ee7b7');
      msg.innerHTML='전송 완료 경계 <b>이전</b> 취소 → byte 미전송. 서버 미도달, promise reject. 클라이언트·서버 모두 작업 절약.';
    } else {
      dot.classList.add('client-dead');
      ghost.style.left=pos+'%';
      ghost.style.opacity='1';
      ghost.style.transition='left 1.1s ease-out';
      requestAnimationFrame(()=>{ ghost.style.left=RESP+'%'; });
      setStat('r-reached','true','#fca5a5');
      setTimeout(()=>setStat('r-proc','true','#fca5a5'),550);
      msg.innerHTML='전송 완료 경계 <b>이후</b> 취소 → byte 이미 전송됨(초록). 클라이언트는 reject 하지만 <b>서버는 도달·처리를 계속</b>. 절약은 클라이언트 측뿐.';
    }
  }

  function reset(){
    cancelAnimationFrame(raf); start=null; pos=0; state='idle';
    dot.style.left='0'; dot.style.background='#60a5fa'; dot.classList.remove('client-dead');
    ghost.style.opacity='0'; ghost.style.transition='none'; ghost.style.left='0';
    sig.style.opacity='0'; sig.style.width='0'; sig.style.height='0'; sig.style.transition='none';
    fireBtn.disabled=false; abortBtn.disabled=true;
    resetStats();
    msg.textContent='"요청 발사"를 누르면 파란 신호가 client → server 로 흐릅니다. 흐르는 동안 "취소"를 눌러 시점별 결과를 확인하세요.';
  }

  fireBtn.addEventListener('click',fire);
  abortBtn.addEventListener('click',abort);
  resetBtn.addEventListener('click',reset);
})();
</script>
</body>
</html>
