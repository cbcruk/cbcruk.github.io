<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" width="100%" role="img">
<title>Native Messaging 의 통로</title>
<desc>확장 샌드박스 안: content.js → runtime.sendMessage → background.js(service worker). content.js 에서는 네이티브 통신을 못 한다. background.js → sendNativeMessage → Chrome. Chrome 은 OS 지정 위치의 manifest 에서 allowed_origins 에 이 확장이 있는지 대조한 뒤 호스트를 자식 프로세스로 spawn 한다. Chrome → 호스트는 stdin 으로 최대 64MiB, 호스트 → Chrome 은 stdout 으로 최대 1MB. 메시지 하나는 4바이트 길이 헤더 다음 UTF-8 JSON 이다. stdout 에 print 한 글자라도 새면 길이 자리에 끼어 프로토콜이 깨지므로 로그는 stderr 로 보낸다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:12px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.o{font-size:12px;fill:#C2621A}</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#C2621A"/></marker>
</defs>
<rect width="860" height="320" fill="#FFFFFF"/>

<rect x="12" y="100" width="400" height="130" rx="10" fill="none" stroke="#B5B5B5" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="24" y="92" class="s">확장 샌드박스</text>

<rect x="30" y="130" width="160" height="56" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="110" y="153" text-anchor="middle" class="m">content.js</text>
<text x="110" y="172" text-anchor="middle" class="s">페이지에서 값만 뽑음</text>
<text x="110" y="208" text-anchor="middle" class="o">✕ 네이티브 통신 불가</text>

<rect x="235" y="130" width="160" height="56" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="315" y="153" text-anchor="middle" class="m">background.js</text>
<text x="315" y="172" text-anchor="middle" class="s">service worker</text>

<rect x="450" y="130" width="150" height="56" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="525" y="153" text-anchor="middle" class="b">Chrome</text>
<text x="525" y="172" text-anchor="middle" class="s">호스트를 spawn</text>

<rect x="670" y="130" width="170" height="56" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="755" y="153" text-anchor="middle" class="b">호스트 프로세스</text>
<text x="755" y="172" text-anchor="middle" class="m">ytdlp_host.py</text>

<rect x="420" y="20" width="210" height="56" rx="7" fill="none" stroke="#8A8A8A" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="525" y="43" text-anchor="middle" class="b">manifest · OS 지정 위치</text>
<text x="525" y="62" text-anchor="middle" class="m">allowed_origins</text>
<line x1="525" y1="76" x2="525" y2="126" stroke="#8A8A8A" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="535" y="106" class="s">이 확장인가 대조</text>

<line x1="190" y1="158" x2="231" y2="158" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<text x="212" y="122" text-anchor="middle" class="m">sendMessage</text>
<line x1="395" y1="158" x2="446" y2="158" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<text x="422" y="122" text-anchor="middle" class="m">sendNativeMessage</text>

<line x1="600" y1="146" x2="666" y2="146" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<text x="635" y="120" text-anchor="middle" class="s">stdin ≤ 64MiB</text>
<line x1="670" y1="172" x2="604" y2="172" stroke="#C2621A" stroke-width="1.5" marker-end="url(#ao)"/>
<text x="635" y="206" text-anchor="middle" class="o">stdout ≤ 1MB</text>

<text x="450" y="266" class="s">메시지 하나 =</text>
<rect x="540" y="250" width="110" height="26" rx="4" fill="#FDEBD8" stroke="#C2621A" stroke-width="1.5"/>
<text x="595" y="268" text-anchor="middle" class="s">4바이트 길이</text>
<rect x="650" y="250" width="190" height="26" rx="4" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="745" y="268" text-anchor="middle" class="s">UTF-8 JSON</text>
<text x="450" y="302" class="o">stdout 에 print 한 글자라도 새면 길이 자리에 끼어 깨진다 → 로그는 stderr</text>
</svg>
