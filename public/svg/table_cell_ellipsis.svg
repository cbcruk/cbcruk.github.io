<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 240" width="100%" role="img">
<title>표 셀 ellipsis: overflow 셋만으로는 안 된다</title>
<desc>텍스트 말줄임은 맥락마다 방법이 다르다. 표 셀에서는 자동 레이아웃의 셀이 내용만큼 늘어나 잘라 낼 경계가 없으므로 overflow·text-overflow·white-space 셋만 주면 아무 효과가 없다. 표에 width 를 주고, 표의 table-layout: fixed 나 셀의 max-width: 0 중 하나를 더한다. fixed 는 열 너비를 표와 col 너비로만 정하고, max-width: 0 은 셀이 내용 기반 너비를 주장하지 못하게 한다(CSS 2.1 이 정의하지 않은 동작이라 브라우저 관행에 기댄다). 표 width 없이 max-width: 0 만 주면 열이 0 으로 접힌다. flexbox 와 여러 줄은 참고 링크로.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:12px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.r{font-size:11.5px;fill:#B3261E}.g{font-size:11.5px;fill:#2E7D32}.x{font-size:12px;font-family:ui-monospace,Menlo,monospace;fill:#999;text-decoration:line-through}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#B3261E"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2E7D32"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2F6DB5"/></marker></defs>
<rect width="860" height="240" fill="#FFFFFF"/>
<rect x="30" y="30" width="250" height="90" rx="7" fill="#FCE8E6" stroke="#B3261E" stroke-width="1.5"/>
<text x="155" y="59" text-anchor="middle" class="b">overflow 셋만</text>
<text x="155" y="79" text-anchor="middle" class="m">hidden · ellipsis · nowrap</text>
<text x="155" y="99" text-anchor="middle" class="s">셀이 내용만큼 늘어난다</text>
<rect x="310" y="30" width="250" height="90" rx="7" fill="#E3F1E4" stroke="#2E7D32" stroke-width="1.5"/>
<text x="435" y="59" text-anchor="middle" class="b">+ table width</text>
<text x="435" y="79" text-anchor="middle" class="m">table-layout: fixed</text>
<text x="435" y="99" text-anchor="middle" class="s">열 너비 = 표 · col</text>
<rect x="590" y="30" width="240" height="90" rx="7" fill="#E3F1E4" stroke="#2E7D32" stroke-width="1.5"/>
<text x="710" y="59" text-anchor="middle" class="b">+ table width</text>
<text x="710" y="79" text-anchor="middle" class="m">td { max-width: 0 }</text>
<text x="710" y="99" text-anchor="middle" class="s">브라우저 관행</text>
<rect x="310" y="140" width="520" height="45" rx="7" fill="#FCE8E6" stroke="#B3261E" stroke-width="1.5"/>
<text x="570" y="166" text-anchor="middle" class="m">max-width: 0 만, 표 width 없음 → 열이 0 으로 접힌다</text>
<text x="30" y="215" text-anchor="start" class="s">flexbox · 여러 줄 → 참고 링크</text>
</svg>
