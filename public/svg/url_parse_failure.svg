<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 220" width="100%" role="img">
<title>URL 파싱 실패를 알리는 세 방식</title>
<desc>같은 URL 파싱인데 실패를 알리는 방식만 다르다. new URL(null) 은 TypeError 를 던지고, URL.canParse(null) 은 false 를 돌려주고, URL.parse(null) 은 null 을 돌려준다. parse 는 try...catch 로 생성자를 감싸거나 canParse 로 먼저 확인하던 것을 한 번에 한다. 두 번째 인자 base 로 상대 URL 을 해석한다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:12px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.r{font-size:11.5px;fill:#B3261E}.g{font-size:11.5px;fill:#2E7D32}.x{font-size:12px;font-family:ui-monospace,Menlo,monospace;fill:#999;text-decoration:line-through}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#B3261E"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2E7D32"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2F6DB5"/></marker></defs>
<rect width="860" height="220" fill="#FFFFFF"/>
<rect x="30" y="40" width="200" height="64" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="130" y="66" text-anchor="middle" class="m">null</text>
<text x="130" y="86" text-anchor="middle" class="s">파싱 실패</text>
<rect x="330" y="20" width="240" height="50" rx="7" fill="#FCE8E6" stroke="#B3261E" stroke-width="1.5"/>
<text x="450" y="49" text-anchor="middle" class="m">new URL(x)</text>
<text x="600" y="50" text-anchor="start" class="m">throw TypeError</text>
<path d="M230 72 L326 45" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<rect x="330" y="82" width="240" height="50" rx="7" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1.5"/>
<text x="450" y="111" text-anchor="middle" class="m">URL.canParse(x)</text>
<text x="600" y="112" text-anchor="start" class="m">false</text>
<path d="M230 72 L326 107" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<rect x="330" y="144" width="240" height="50" rx="7" fill="#E3F1E4" stroke="#2E7D32" stroke-width="1.5"/>
<text x="450" y="173" text-anchor="middle" class="m">URL.parse(x)</text>
<text x="600" y="174" text-anchor="start" class="m">null</text>
<path d="M230 72 L326 169" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<text x="330" y="212" text-anchor="start" class="s">parse = try { new URL } catch → null 을 한 번에 · base 로 상대 URL</text>
</svg>
