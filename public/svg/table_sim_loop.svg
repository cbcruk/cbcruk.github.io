<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="100%" role="img">
<title>헤드리스 시뮬 — 한 턴의 흐름</title>
<desc>헤드리스 시뮬은 UI 없이 한 턴을 돈다: state 에서 legalActions 로 합법 행동을 뽑고, bot 이 하나를 고르고, applyAction 과 advanceTurn 이 다음 state 를 만든다. 매 턴 gold·action·port·choiceCount 를 trace 에 남긴다. 난수는 전역 난수 대신 시드를 주입한 생성기 하나가 state 와 함께 다니고, 항해·시세·이벤트 스트림을 나눠 두면 한쪽을 고쳐도 다른 쪽 난수열이 안 밀린다. legalActions·applyAction 이 UI 와 분리된 순수 함수여야 이 루프를 만들 수 있다. 같은 시드면 같은 해시가 나와야 한다. 창발적 문제는 코드를 읽어서 안 나오고 수십 년치를 돌려야 나온다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:11.5px;font-family:ui-monospace,Menlo,monospace}.mb{font-size:12px;font-weight:600;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.o{font-size:12px;fill:#C2621A}.r{font-size:12px;fill:#B3261E}.g{font-size:12px;fill:#2E7D32}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#C2621A"/></marker></defs>
<rect width="860" height="300" fill="#FFFFFF"/>
<rect x="20" y="40" width="140" height="46" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="90.0" y="67" text-anchor="middle" class="mb">state</text>
<rect x="190" y="40" width="140" height="46" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="260.0" y="67" text-anchor="middle" class="mb">legalActions</text>
<rect x="360" y="40" width="140" height="46" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="430.0" y="67" text-anchor="middle" class="mb">bot</text>
<rect x="530" y="40" width="140" height="46" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="600.0" y="67" text-anchor="middle" class="mb">applyAction</text>
<rect x="700" y="40" width="140" height="46" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="770.0" y="67" text-anchor="middle" class="mb">advanceTurn</text>
<line x1="160" y1="63" x2="186" y2="63" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="330" y1="63" x2="356" y2="63" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="500" y1="63" x2="526" y2="63" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="670" y1="63" x2="696" y2="63" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M770 40 L770 26 L90 26 L90 36" fill="none" stroke="#C2621A" stroke-width="1.5" marker-end="url(#ao)"/>
<text x="430" y="20" text-anchor="middle" class="o">다음 턴</text>
<rect x="330" y="140" width="340" height="56" rx="7" fill="#FFFFFF" stroke="#2F6DB5" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="500.0" y="163" text-anchor="middle" class="b">난수 — 시드 주입, state 와 함께 다닌다</text>
<text x="500.0" y="181" text-anchor="middle" class="s">항해 / 시세 / 이벤트 스트림 분리</text>
<line x1="430" y1="140" x2="430" y2="86" stroke="#2F6DB5" stroke-width="1.2" stroke-dasharray="3 3"/>
<line x1="600" y1="140" x2="600" y2="86" stroke="#2F6DB5" stroke-width="1.2" stroke-dasharray="3 3"/>
<line x1="810" y1="168" x2="810" y2="86" stroke="#2F6DB5" stroke-width="1.2" stroke-dasharray="3 3"/>
<line x1="670" y1="168" x2="810" y2="168" stroke="#2F6DB5" stroke-width="1.2" stroke-dasharray="3 3"/>
<rect x="20" y="140" width="260" height="56" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="150.0" y="163" text-anchor="middle" class="b">trace (매 턴)</text>
<text x="150.0" y="181" text-anchor="middle" class="m">gold · action · port · choiceCount</text>
<path d="M740 86 L740 116 L150 116 L150 136" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>
<text x="20" y="240" class="o">legalActions · applyAction 은 UI 와 분리된 순수 함수 — 아니면 시뮬을 못 만든다</text>
<text x="20" y="264" class="s">확인 — 전역 난수 호출이 0건 · 같은 시드로 두 번 돌리면 결과가 같다</text>
<text x="20" y="286" class="s">창발적 문제는 코드를 읽어서 안 나온다 — 수십 년치를 돌려야 나오는 종류가 있다</text>
</svg>
