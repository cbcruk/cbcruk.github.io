<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 220" width="100%" role="img">
<title>JSON 값 타입: 기본값 · 객체 · 배열의 재귀</title>
<desc>JSON 값은 셋 중 하나다. 기본값(string·number·boolean·null), 문자열 키에 JSON 값을 담은 객체, JSON 값의 배열. 객체와 배열이 다시 JSON 값을 담아 재귀한다. type-fest 의 JsonObject 는 선택 속성이 undefined 일 수 있게 한 겹 더 열어 두고, JsonArray 는 readonly 배열도 받는다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:12px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.r{font-size:11.5px;fill:#B3261E}.g{font-size:11.5px;fill:#2E7D32}.x{font-size:12px;font-family:ui-monospace,Menlo,monospace;fill:#999;text-decoration:line-through}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#B3261E"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2E7D32"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2F6DB5"/></marker></defs>
<rect width="860" height="220" fill="#FFFFFF"/>
<rect x="330" y="30" width="200" height="56" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="430" y="62" text-anchor="middle" class="b">JsonValue</text>
<rect x="30" y="130" width="240" height="64" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="150" y="156" text-anchor="middle" class="b">JsonPrimitive</text>
<text x="150" y="176" text-anchor="middle" class="s">string · number · boolean · null</text>
<path d="M430 86 L150 126" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<rect x="310" y="130" width="240" height="64" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="430" y="156" text-anchor="middle" class="b">JsonObject</text>
<text x="430" y="176" text-anchor="middle" class="m">{ [k: string]: JsonValue }</text>
<path d="M430 86 L430 126" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<rect x="590" y="130" width="240" height="64" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="710" y="156" text-anchor="middle" class="b">JsonArray</text>
<text x="710" y="176" text-anchor="middle" class="m">JsonValue[] · readonly</text>
<path d="M430 86 L710 126" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<text x="560" y="62" text-anchor="start" class="s">객체·배열이 다시 JsonValue 를 담는다</text>
</svg>
