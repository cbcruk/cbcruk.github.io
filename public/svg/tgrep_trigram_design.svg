<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="100%" role="img">
<title>tgrep 은 왜 빠른가</title>
<desc>ripgrep 은 질의마다 모든 파일을 열어 읽는다. tgrep 은 미리 만든 trigram 인덱스에서 후보 파일을 마이크로초 단위로 고르고, 후보만 열어 정규식으로 확인한다. 리눅스 커널에서는 후보가 전체 9만 6천 파일의 4~12% 였다. 그래서 파일 하나를 여는 비용이 비싼 Windows 와, 파일이 많은 큰 저장소에서 차이가 가장 크다. 대신 tgrep 은 서버와 클라이언트로 나뉘어 있어 결과 한 줄마다 직렬화하고 프로세스 사이로 보내고 다시 읽어 출력하는 배달비가 든다. 결과가 수만 줄이면 이 배달비가 인덱스로 아낀 것보다 커져 ripgrep 이 이긴다. 페이지 캐시가 따뜻한 리눅스에서는 ripgrep 의 병렬 스캔도 싸서 차이가 작다.</desc>
<style>text{white-space:pre;font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.w{font-size:12px;font-weight:600}.s{font-size:11px;fill:#555}.m{font-size:11px;font-family:ui-monospace,Menlo,monospace}.r{fill:#B3261E}.g{fill:#2E8B4E}.o{fill:#B07D00}</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker>
<pattern id="all" width="10" height="10" patternUnits="userSpaceOnUse"><rect x="1" y="1" width="8" height="8" fill="#F2C9C4" stroke="#B3261E" stroke-width="0.6"/></pattern>
<pattern id="none" width="10" height="10" patternUnits="userSpaceOnUse"><rect x="1" y="1" width="8" height="8" fill="#F3F3F3" stroke="#CCC" stroke-width="0.6"/></pattern>
</defs>
<rect width="760" height="470" fill="#FFFFFF"/>

<text x="20" y="24" class="b">질의 한 번에 드는 것</text>

<!-- ripgrep lane -->
<text x="20" y="54" class="w">ripgrep</text>
<rect x="90" y="40" width="400" height="20" fill="url(#all)"/>
<text x="500" y="54" class="s r">모든 파일을 열고 읽는다</text>
<line x1="90" y1="66" x2="490" y2="66" stroke="#B3261E" stroke-width="2"/>
<text x="500" y="80" class="s">찾은 줄은 스캔하던 스레드가 stdout 으로 바로</text>

<!-- tgrep lane -->
<text x="20" y="120" class="w">tgrep</text>
<rect x="90" y="106" width="400" height="20" fill="url(#none)"/>
<rect x="130" y="106" width="10" height="20" fill="#F2C9C4" stroke="#B3261E" stroke-width="0.6"/>
<rect x="210" y="106" width="10" height="20" fill="#F2C9C4" stroke="#B3261E" stroke-width="0.6"/>
<rect x="310" y="106" width="10" height="20" fill="#F2C9C4" stroke="#B3261E" stroke-width="0.6"/>
<rect x="400" y="106" width="10" height="20" fill="#F2C9C4" stroke="#B3261E" stroke-width="0.6"/>
<text x="500" y="120" class="s g">후보만 연다 — 커널에선 전체의 4~12%</text>
<g>
<rect x="90" y="134" width="14" height="10" fill="#9AB"/>
<rect x="104" y="134" width="4" height="10" fill="#3B6FB6"/>
<rect x="108" y="134" width="40" height="10" fill="#B3261E"/>
<rect x="148" y="134" width="40" height="10" fill="#B07D00"/>
</g>
<text x="500" y="144" class="s">+ 시작 · TCP 왕복 · 후보 고르기(μs) · 배달</text>
<g>
<rect x="90" y="156" width="10" height="10" fill="#9AB"/><text x="104" y="165" class="s">프로세스 시작·TCP</text>
<rect x="210" y="156" width="10" height="10" fill="#3B6FB6"/><text x="224" y="165" class="s">게시 목록 교집합</text>
<rect x="320" y="156" width="10" height="10" fill="#B3261E"/><text x="334" y="165" class="s">후보 확인</text>
<rect x="400" y="156" width="10" height="10" fill="#B07D00"/><text x="414" y="165" class="s">결과 배달</text>
</g>

<line x1="20" y1="184" x2="740" y2="184" stroke="#DDD"/>

<!-- why -->
<text x="20" y="208" class="b">빠른 이유 — 고르기는 거의 공짜, 여는 수가 준다</text>
<text x="20" y="230" class="s">· 게시 목록은 파일 번호로 정렬돼 있어 정렬·중복 제거 없이 교집합: AND 1만 파일 29μs</text>
<text x="20" y="248" class="s">· 마스크 두 바이트(이웃 자리 · 다음 바이트)로 확인 전에 한 번 더 거른다</text>
<text x="20" y="266" class="s">· 인덱스는 한 번 짓고(Go 3초 · Chromium 248초) 서버가 바뀐 것만 고친다 — 벤치는 이 비용을 빼고 잰다</text>

<!-- margin -->
<text x="20" y="300" class="b">차이를 움직이는 것</text>
<rect x="20" y="312" width="230" height="74" rx="7" fill="#E3F3E6" stroke="#2E8B4E"/>
<text x="32" y="332" class="w g">커진다</text>
<text x="32" y="350" class="s">파일이 많다 (Chromium 50만)</text>
<text x="32" y="368" class="s">파일 하나 열기가 비싸다 (Windows)</text>
<rect x="265" y="312" width="230" height="74" rx="7" fill="#FFF4D6" stroke="#B07D00"/>
<text x="277" y="332" class="w o">작아진다</text>
<text x="277" y="350" class="s">페이지 캐시가 따뜻한 Linux</text>
<text x="277" y="368" class="s">작은 저장소 · 쓸 trigram 이 없는 패턴</text>
<rect x="510" y="312" width="230" height="74" rx="7" fill="#FBE9E7" stroke="#B3261E"/>
<text x="522" y="332" class="w r">뒤집힌다</text>
<text x="522" y="350" class="s">결과가 수만 줄 — 줄마다 직렬화·</text>
<text x="522" y="368" class="s">IPC·역직렬화·출력이 붙는다</text>

<text x="20" y="410" class="s">평균 배율(기하): Windows 14.6x · macOS 8.61x · Linux 2.82x — 18칸 중 Kubernetes·Linux 만 0.93x</text>
<text x="20" y="430" class="s">커널을 흔한 토큰(read · write)으로 쟀을 땐 후보가 4~12% 로 줄었는데도 0.74~0.95x 로 졌다</text>
<text x="20" y="450" class="s">→ 실제로 쓸 법한 질의로 바꾸자 tgrep 49~128초 → 4.6~8.1초, ripgrep 은 그대로 33~46초</text>
</svg>
