<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" width="100%" role="img">
<title>리스너가 붙는 창과 노드가 사는 창</title>
<desc>컴포넌트 코드는 원래 창에서 돌고, window.open·포털로 렌더한 DOM 노드(ref.current)는 새 창에 산다. window.addEventListener → 원래 창의 window 에 붙는다, 노드가 없는 창이다. ref.current.ownerDocument.defaultView → 새 창의 window 에 붙는다, 노드가 사는 창이다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:12px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.o{font-size:12px;fill:#C2621A}.g{font-size:12px;fill:#2F6DB5}</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2F6DB5"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#C2621A"/></marker>
</defs>
<rect width="860" height="260" fill="#FFFFFF"/>

<rect x="12" y="34" width="400" height="214" rx="10" fill="none" stroke="#B5B5B5" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="24" y="26" class="s">원래 창</text>
<rect x="448" y="34" width="400" height="214" rx="10" fill="none" stroke="#B5B5B5" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="460" y="26" class="s">새 창 · window.open / 포털 대상</text>

<rect x="120" y="64" width="190" height="56" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="215" y="87" text-anchor="middle" class="b">컴포넌트 코드</text>
<text x="215" y="106" text-anchor="middle" class="s">effect 가 여기서 돈다</text>

<rect x="560" y="64" width="190" height="56" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="655" y="87" text-anchor="middle" class="b">DOM 노드</text>
<text x="655" y="106" text-anchor="middle" class="m">ref.current</text>

<line x1="310" y1="92" x2="556" y2="92" stroke="#8A8A8A" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="433" y="84" text-anchor="middle" class="s">렌더</text>

<rect x="120" y="184" width="190" height="44" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="215" y="211" text-anchor="middle" class="m">window</text>

<rect x="560" y="184" width="190" height="44" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="655" y="211" text-anchor="middle" class="m">window</text>

<line x1="215" y1="120" x2="215" y2="180" stroke="#C2621A" stroke-width="1.5" marker-end="url(#ao)"/>
<text x="225" y="146" class="m" style="fill:#C2621A">window.addEventListener</text>
<text x="225" y="165" class="o">✕ 노드가 없는 창</text>

<line x1="655" y1="120" x2="655" y2="180" stroke="#2F6DB5" stroke-width="1.5" marker-end="url(#ab)"/>
<text x="665" y="140" class="m" style="fill:#2F6DB5">ownerDocument</text>
<text x="665" y="154" class="m" style="fill:#2F6DB5">.defaultView</text>
<text x="665" y="170" class="g">✓ 노드가 사는 창</text>
</svg>
