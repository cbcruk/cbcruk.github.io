<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 220" width="100%" role="img">
<title>전화번호 포맷: 길이와 02 로 그룹 자릿수를 고른다</title>
<desc>숫자만 남긴 뒤 길이와 02 로 시작하는지로 그룹 자릿수를 고른다. 11자리는 3-4-4, 02 로 시작하는 10자리는 2-4-4, 그 밖의 10자리는 3-3-4, 02 로 시작하는 9자리는 2-3-4. 나머지는 Invalid. replace 는 매치된 부분만 바꾸고 나머지를 뒤에 남기므로 그룹 자릿수의 합이 길이와 같아야 한다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:12px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.r{font-size:11.5px;fill:#B3261E}.g{font-size:11.5px;fill:#2E7D32}.x{font-size:12px;font-family:ui-monospace,Menlo,monospace;fill:#999;text-decoration:line-through}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#B3261E"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2E7D32"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2F6DB5"/></marker></defs>
<rect width="860" height="220" fill="#FFFFFF"/>
<rect x="30" y="40" width="200" height="130" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="130" y="99" text-anchor="middle" class="b">숫자만</text>
<text x="130" y="119" text-anchor="middle" class="m">replace(/\D/g, "")</text>
<path d="M230 105 H276" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<rect x="280" y="40" width="550" height="28" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="555" y="58" text-anchor="middle" class="m">11       3-4-4   010-1234-1234</text>
<rect x="280" y="74" width="550" height="28" rx="7" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1.5"/>
<text x="555" y="92" text-anchor="middle" class="m">10 · 02  2-4-4   02-1234-5678</text>
<rect x="280" y="108" width="550" height="28" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="555" y="126" text-anchor="middle" class="m">10       3-3-4   031-123-4567</text>
<rect x="280" y="142" width="550" height="28" rx="7" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1.5"/>
<text x="555" y="160" text-anchor="middle" class="m">9 · 02   2-3-4   02-123-4567</text>
<text x="280" y="200" text-anchor="start" class="r">합 ≠ 길이면 남은 자릿수가 뒤에 그대로 붙는다</text>
</svg>
