<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" width="100%" role="img">
<title>숫자를 세 층으로 가르기</title>
<desc>숫자 리터럴을 전수 조사한 뒤 하나씩 묻는다. 인스턴스마다 다른 값이면 Content — 그 개념의 표로. 아니면 0이나 무한대로 만들었을 때 다른 장르가 되는지 묻는다. 그렇다면 Shape — 코드에 남기고 docs/shape.md 에 적는다(최대 함대 4 는 1 이면 다른 게임). 아니면 Knob — data/tuning.ts 로(순풍 배수 1.3 은 0 이어도 항해 게임). docs/shape.md 자체가 산출물이다 — 없으면 표로 못 바꾸는 축을 몇 주간 튜닝한다. 애매하면 Shape 로 둔다: Shape 를 Knob 으로 내리는 건 쉽지만, Knob 으로 뺀 게 Shape 였다는 걸 알면 표 전체가 무의미해진 상태다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:11.5px;font-family:ui-monospace,Menlo,monospace}.mb{font-size:12px;font-weight:600;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.o{font-size:12px;fill:#C2621A}.r{font-size:12px;fill:#B3261E}.g{font-size:12px;fill:#2E7D32}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#C2621A"/></marker></defs>
<rect width="860" height="320" fill="#FFFFFF"/>
<rect x="20" y="30" width="200" height="46" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="120.0" y="48" text-anchor="middle" class="b">숫자 리터럴 전수 조사</text>
<text x="120.0" y="66" text-anchor="middle" class="s">기능 추가를 멈추고</text>
<rect x="270" y="30" width="270" height="46" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="405.0" y="57" text-anchor="middle" class="s">인스턴스마다 다른 값?</text>
<line x1="220" y1="53" x2="266" y2="53" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="540" y1="53" x2="586" y2="53" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<text x="563" y="46" text-anchor="middle" class="s">예</text>
<rect x="590" y="30" width="250" height="46" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="715.0" y="48" text-anchor="middle" class="b">Content</text>
<text x="715.0" y="66" text-anchor="middle" class="s">그 개념의 표로 (PORTS …)</text>
<line x1="405" y1="76" x2="405" y2="102" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<text x="413" y="94" class="s">아니오</text>
<rect x="270" y="106" width="270" height="46" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="405.0" y="124" text-anchor="middle" class="s">0 이나 무한대로 만들면</text>
<text x="405.0" y="142" text-anchor="middle" class="s">다른 장르가 되나?</text>
<line x1="540" y1="129" x2="586" y2="129" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<text x="563" y="122" text-anchor="middle" class="s">예</text>
<rect x="590" y="106" width="250" height="46" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="715.0" y="124" text-anchor="middle" class="b">Shape</text>
<text x="715.0" y="142" text-anchor="middle" class="s">코드에 남기고 docs/shape.md 에 적는다</text>
<line x1="405" y1="152" x2="405" y2="178" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<text x="413" y="170" class="s">아니오</text>
<rect x="270" y="182" width="270" height="46" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="405.0" y="200" text-anchor="middle" class="b">Knob</text>
<text x="405.0" y="218" text-anchor="middle" class="s">data/tuning.ts 로</text>
<text x="590" y="196" class="s">최대 함대 4 → 1 이면 다른 게임 → Shape</text>
<text x="590" y="216" class="s">순풍 배수 1.3 → 0 이어도 항해 게임 → Knob</text>
<text x="20" y="262" class="b">애매하면 Shape 로 —</text>
<text x="170" y="262" class="g">Shape → Knob 으로 내리기는 쉽다</text>
<text x="170" y="284" class="r">Knob 으로 뺀 게 Shape 였다면 → 표 전체가 무의미해진 상태로 발견된다</text>
<text x="20" y="310" class="s">확인 — docs/shape.md 가 있다. 이 문서가 산출물이다 — 없으면 표로 못 바꾸는 축을 몇 주간 튜닝한다</text>
</svg>
