<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="100%" role="img">
<title>배열 참조를 키로 쓰는 WeakMap 인덱스 캐시</title>
<desc>흩어진 호출 지점이 모두 lookup 하나를 거쳐 indexCache.get(items) 로 배열 참조를 찾는다. 같은 참조면 hit 라 인덱스를 재사용하고, refetch 로 새 참조가 오면 miss 라 buildIndex 를 한 번 돌리며 옛 entry 는 옛 배열과 함께 GC 된다. push 처럼 제자리에서 바꾸면 참조가 같아 hit 인데 옛 인덱스라 틀린 값이 나온다. 매번 새 배열을 넘기면 항상 miss 라 캐시가 무의미하다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:12px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.o{font-size:12px;fill:#C2621A}</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2F6DB5"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#C2621A"/></marker>
</defs>
<rect width="860" height="330" fill="#FFFFFF"/>

<text x="16" y="34" class="s">호출 지점 — 어디서든</text>
<rect x="16" y="50" width="132" height="44" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="82" y="76" text-anchor="middle" class="m">cell renderer</text>
<rect x="16" y="120" width="132" height="44" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="82" y="146" text-anchor="middle" class="m">&lt;TreeNode&gt;</text>
<rect x="16" y="190" width="132" height="44" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="82" y="216" text-anchor="middle" class="m">hasPermission()</text>

<rect x="164" y="100" width="128" height="84" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="228" y="138" text-anchor="middle" class="m">lookup(items,</text>
<text x="228" y="154" text-anchor="middle" class="m">key)</text>

<rect x="316" y="100" width="128" height="84" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="380" y="130" text-anchor="middle" class="m">indexCache</text>
<text x="380" y="148" text-anchor="middle" class="m">.get(items)</text>
<text x="380" y="168" text-anchor="middle" class="s">참조로 찾는다</text>

<path d="M148 72 L154 72 L154 212 L148 212" fill="none" stroke="#555" stroke-width="1.5"/>
<line x1="148" y1="142" x2="160" y2="142" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="292" y1="142" x2="312" y2="142" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>

<path d="M444 142 L464 142 L464 68 L644 68" fill="none" stroke="#2F6DB5" stroke-width="1.5" marker-end="url(#ab)"/>
<text x="472" y="61" class="s">같은 참조</text>
<line x1="464" y1="156" x2="644" y2="156" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="464" y1="142" x2="464" y2="244" stroke="#555" stroke-width="1.5"/>
<text x="472" y="149" class="s">새 참조 (refetch)</text>
<line x1="464" y1="244" x2="644" y2="244" stroke="#C2621A" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ao)"/>
<text x="472" y="237" class="s">제자리 변경 (push)</text>

<rect x="648" y="36" width="200" height="64" rx="7" fill="#2F6DB5" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="748" y="64" text-anchor="middle" class="b" style="fill:#FFFFFF">hit · O(1)</text>
<text x="748" y="84" text-anchor="middle" class="s" style="fill:#FFFFFF">인덱스 재사용</text>

<rect x="648" y="124" width="200" height="64" rx="7" fill="#FDEBD8" stroke="#C2621A" stroke-width="1.5"/>
<text x="748" y="152" text-anchor="middle" class="m">miss → buildIndex</text>
<text x="748" y="172" text-anchor="middle" class="s">O(n) 한 번 · 옛 entry 는 GC</text>

<rect x="648" y="212" width="200" height="64" rx="7" fill="#FFFFFF" stroke="#C2621A" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="748" y="240" text-anchor="middle" class="m">hit — 옛 인덱스</text>
<text x="748" y="260" text-anchor="middle" class="o">✕ 틀린 값</text>

<text x="16" y="312" class="o">✕ 매번 [...data] · filter() 로 넘기면 → 항상 새 참조 → 항상 miss, 캐시가 무의미</text>
</svg>
