<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 240" width="100%" role="img">
<title>null 이면 뒤 단계를 건너뛴다</title>
<desc>null 일 수 있는 단계를 잇는다: 스크롤 요소 → 그 안의 #id 요소 → 첫 사각형 → scrollLeft 를 그 left 로. 어느 단계든 null 이 나오면 뒤 단계는 부르지 않고 null 로 끝난다. Maybe 의 map 으로 쓰면 체인 하나, generator 로 쓰면 단계마다 if (!x) return 으로 일찍 빠져나간다 — 같은 모양이다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:12px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.r{font-size:11.5px;fill:#B3261E}.g{font-size:11.5px;fill:#2E7D32}.x{font-size:12px;font-family:ui-monospace,Menlo,monospace;fill:#999;text-decoration:line-through}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#B3261E"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2E7D32"/></marker></defs>
<rect width="860" height="240" fill="#FFFFFF"/>
<rect x="30" y="40" width="170" height="64" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="115" y="66" text-anchor="middle" class="b">스크롤 요소</text>
<text x="115" y="86" text-anchor="middle" class="m">scrollElement.current</text>
<path d="M200 72 H236" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<text x="218" y="64" text-anchor="middle" class="s">map</text>
<rect x="240" y="40" width="170" height="64" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="325" y="66" text-anchor="middle" class="b">대상</text>
<text x="325" y="86" text-anchor="middle" class="m">querySelector(#id)</text>
<path d="M410 72 H446" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<text x="428" y="64" text-anchor="middle" class="s">map</text>
<rect x="450" y="40" width="170" height="64" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="535" y="66" text-anchor="middle" class="b">사각형</text>
<text x="535" y="86" text-anchor="middle" class="m">getClientRects()[0]</text>
<path d="M620 72 H656" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<text x="638" y="64" text-anchor="middle" class="s">map</text>
<rect x="660" y="40" width="170" height="64" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="745" y="66" text-anchor="middle" class="b">스크롤</text>
<text x="745" y="86" text-anchor="middle" class="m">scrollLeft = rect.left</text>
<path d="M115 104 V146" stroke="#B3261E" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
<path d="M325 104 V146" stroke="#B3261E" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
<path d="M535 104 V146" stroke="#B3261E" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
<rect x="30" y="150" width="640" height="44" rx="7" fill="#FCE8E6" stroke="#B3261E" stroke-width="1.5"/>
<text x="350" y="176" text-anchor="middle" class="m">null → 뒤는 부르지 않는다  (generator 면 if (!x) return)</text>
</svg>
