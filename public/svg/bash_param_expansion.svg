<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="100%" role="img">
<title>Bash 매개변수 확장: # 은 앞, % 는 뒤, 하나는 짧게 둘은 길게</title>
<desc>파일 이름 앞부분을 떼어 일괄 rename 한다. for f in *.md 를 돌며 mv "$f" "${f#* }" — "351 529.md" 는 앞에서 "* " 에 맞는 가장 짧은 부분 "351 " 이 지워져 "529.md" 가 된다. 규칙: # 은 앞에서, % 는 뒤에서 지우고, 하나면 가장 짧게, 둘이면 가장 길게 맞는 부분을 지운다. x="a.b.c" 면 ${x#*.} 는 b.c, ${x##*.} 는 c, ${x%.*} 는 a.b, ${x%%.*} 는 a. 변수는 따옴표로 감싼다 — 없으면 공백에서 단어가 갈려 mv 가 깨진다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:12px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.r{font-size:11.5px;fill:#B3261E}.g{font-size:11.5px;fill:#2E7D32}.x{font-size:12px;font-family:ui-monospace,Menlo,monospace;fill:#999;text-decoration:line-through}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#B3261E"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2E7D32"/></marker></defs>
<rect width="860" height="300" fill="#FFFFFF"/>
<rect x="30" y="30" width="250" height="60" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="155" y="54" text-anchor="middle" class="b">"351 529.md"</text>
<text x="155" y="74" text-anchor="middle" class="s">for f in *.md</text>
<path d="M280 60 H336" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<rect x="340" y="30" width="230" height="60" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="455" y="54" text-anchor="middle" class="m">mv "$f" "${f#* }"</text>
<text x="455" y="74" text-anchor="middle" class="s">앞에서 "* " 가장 짧게</text>
<path d="M570 60 H626" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<rect x="630" y="30" width="200" height="60" rx="7" fill="#E3F1E4" stroke="#2E7D32" stroke-width="1.5"/>
<text x="730" y="54" text-anchor="middle" class="b">"529.md"</text>
<text x="730" y="74" text-anchor="middle" class="s">"351 " 이 지워졌다</text>
<text x="30" y="135" text-anchor="start" class="m">x="a.b.c"</text>
<text x="260" y="135" text-anchor="middle" class="b">하나 — 가장 짧게</text>
<text x="560" y="135" text-anchor="middle" class="b">둘 — 가장 길게</text>
<text x="30" y="180" text-anchor="start" class="b"># 앞에서</text>
<text x="30" y="240" text-anchor="start" class="b">% 뒤에서</text>
<rect x="150" y="152" width="220" height="48" rx="7" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1.5"/>
<text x="260" y="180" text-anchor="middle" class="m">${x#*.}  →  b.c</text>
<rect x="450" y="152" width="220" height="48" rx="7" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1.5"/>
<text x="560" y="180" text-anchor="middle" class="m">${x##*.}  →  c</text>
<rect x="150" y="212" width="220" height="48" rx="7" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1.5"/>
<text x="260" y="240" text-anchor="middle" class="m">${x%.*}  →  a.b</text>
<rect x="450" y="212" width="220" height="48" rx="7" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1.5"/>
<text x="560" y="240" text-anchor="middle" class="m">${x%%.*}  →  a</text>
<text x="700" y="180" text-anchor="start" class="s">키보드에서</text>
<text x="700" y="198" text-anchor="start" class="s"># 은 $ 왼쪽</text>
<text x="700" y="232" text-anchor="start" class="r">따옴표 없으면</text>
<text x="700" y="250" text-anchor="start" class="r">공백에서 갈린다</text>
</svg>
