<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 230" width="100%" role="img">
<title>원격 호스트와 병렬화의 진짜 병목</title>
<desc>24시간 켜진 호스트가 있으면 Tailscale 로 SSH·HTTPS 를 호스트명으로 연다. 포트포워딩 대신 이걸 택하는 이유는 HTTPS 인증서로 secure context 를 얻기 때문이다. 랩탑을 닫아도 지속되려면 하네스의 원격 세션 모드를 쓰고 tmux 는 최후 수단이다. 머신이 둘이 되니 chezmoi 가 정당화된다. 다만 워크트리·포트를 아무리 격리해도 병렬화의 상한은 사람의 diff 리뷰 대역폭이다 — 4개 동시 실행은 4개의 리뷰 큐를 만들 뿐이니 병렬도를 올리기 전에 리뷰 처리량을 먼저 잰다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:11.5px;font-family:ui-monospace,Menlo,monospace}.mb{font-size:12px;font-weight:600;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.o{font-size:12px;fill:#C2621A}.r{font-size:12px;fill:#B3261E}.g{font-size:12px;fill:#2E7D32}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#C2621A"/></marker></defs>
<rect width="860" height="230" fill="#FFFFFF"/>
<rect x="20" y="36" width="180" height="56" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="110.0" y="59" text-anchor="middle" class="b">Tailscale</text>
<text x="110.0" y="77" text-anchor="middle" class="s">SSH · HTTPS 호스트명</text>
<rect x="240" y="36" width="190" height="56" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="335.0" y="59" text-anchor="middle" class="b">HTTPS 인증서</text>
<text x="335.0" y="77" text-anchor="middle" class="g">→ secure context</text>
<rect x="470" y="36" width="180" height="56" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="560.0" y="59" text-anchor="middle" class="b">원격 세션 모드</text>
<text x="560.0" y="77" text-anchor="middle" class="s">tmux 는 최후 수단</text>
<rect x="690" y="36" width="150" height="56" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="765.0" y="59" text-anchor="middle" class="b">chezmoi</text>
<text x="765.0" y="77" text-anchor="middle" class="s">머신 2대 → 정당화</text>
<line x1="200" y1="64" x2="236" y2="64" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="430" y1="64" x2="466" y2="64" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="650" y1="64" x2="686" y2="64" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="20" y="126" width="820" height="70" rx="7" fill="#FFFFFF" stroke="#B3261E" stroke-width="1.5"/>
<text x="430.0" y="147" text-anchor="middle" class="r">함정 — 병렬화의 진짜 병목은 사람의 diff 리뷰 대역폭</text>
<text x="430.0" y="165" text-anchor="middle" class="s">에이전트 4개 동시 = 리뷰 큐 4개</text>
<text x="430.0" y="183" text-anchor="middle" class="o">병렬도를 올리기 전에 리뷰 처리량을 먼저 잰다</text>
</svg>
