<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="100%" role="img">
<title>Navigation API 이탈 방지 — 사전 차단과 사후 롤백</title>
<desc>링크 클릭·폼 제출·프로그램 호출·history.pushState()·뒤로·앞으로까지 떠나는 모든 경로가 navigate 이벤트 하나로 모인다. 블로커가 켜져 있을 때 navigationType 이 push·replace·reload 면 preventDefault() 로 아예 안 움직이게 막는다(사전 차단) — 이때 destination.index 는 -1 이다. traverse(뒤로·앞으로)는 사용자를 사이트에 가둘 수 없도록 preventDefault() 로 취소할 수 없어 이미 움직인 뒤다. 그래서 history.go(현재 index − destination.index) 로 되돌린다(사후 롤백) — destination.index 는 traverse 일 때만 목적지 커서 값을 준다. API 자체가 같은 선을 긋고 있어 블로커 하나로 통일할 수 없고 라우터 안에 두 갈래가 남는다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:11.5px;font-family:ui-monospace,Menlo,monospace}.mb{font-size:12px;font-weight:600;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.o{font-size:12px;fill:#C2621A}.r{font-size:12px;fill:#B3261E}.g{font-size:12px;fill:#2E7D32}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#C2621A"/></marker></defs>
<rect width="860" height="330" fill="#FFFFFF"/>
<rect x="20" y="20" width="140" height="34" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="90.0" y="41" text-anchor="middle" class="s">링크 클릭</text>
<line x1="160" y1="37" x2="200" y2="125" stroke="#8A8A8A" stroke-width="1.2"/>
<rect x="20" y="64" width="140" height="34" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="90.0" y="85" text-anchor="middle" class="s">폼 제출</text>
<line x1="160" y1="81" x2="200" y2="125" stroke="#8A8A8A" stroke-width="1.2"/>
<rect x="20" y="108" width="140" height="34" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="90.0" y="129" text-anchor="middle" class="s">프로그램 호출</text>
<line x1="160" y1="125" x2="200" y2="125" stroke="#8A8A8A" stroke-width="1.2"/>
<rect x="20" y="152" width="140" height="34" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="90.0" y="173" text-anchor="middle" class="s">pushState()</text>
<line x1="160" y1="169" x2="200" y2="125" stroke="#8A8A8A" stroke-width="1.2"/>
<rect x="20" y="196" width="140" height="34" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="90.0" y="217" text-anchor="middle" class="s">뒤로 · 앞으로</text>
<line x1="160" y1="213" x2="200" y2="125" stroke="#8A8A8A" stroke-width="1.2"/>
<rect x="200" y="100" width="150" height="50" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="275.0" y="120" text-anchor="middle" class="mb">navigate 이벤트</text>
<text x="275.0" y="138" text-anchor="middle" class="s">한 자리로 모인다</text>
<rect x="400" y="30" width="440" height="100" rx="7" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.5"/>
<text x="620.0" y="57" text-anchor="middle" class="mb">push · replace · reload</text>
<text x="620.0" y="75" text-anchor="middle" class="s">preventDefault() → 아예 안 움직인다</text>
<text x="620.0" y="93" text-anchor="middle" class="b">사전 차단</text>
<text x="620.0" y="111" text-anchor="middle" class="m">destination.index = -1</text>
<rect x="400" y="150" width="440" height="120" rx="7" fill="#FFFFFF" stroke="#B3261E" stroke-width="1.5"/>
<text x="620.0" y="178" text-anchor="middle" class="mb">traverse — 뒤로 · 앞으로</text>
<text x="620.0" y="196" text-anchor="middle" class="r">preventDefault() 불가 — 사용자를 가둘 수 없다</text>
<text x="620.0" y="214" text-anchor="middle" class="s">이미 움직인 뒤 → history.go(현재 − destination.index)</text>
<text x="620.0" y="232" text-anchor="middle" class="b">사후 롤백</text>
<text x="620.0" y="250" text-anchor="middle" class="m">destination.index = 목적지 커서</text>
<line x1="350" y1="115" x2="396" y2="80" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="350" y1="135" x2="396" y2="200" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<text x="20" y="306" class="o">index 가 traverse 에서만 값을 가진다 — API 자체가 같은 선을 긋는다 → 블로커 하나로 통일할 수 없다</text>
</svg>
