<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 250" width="100%" role="img">
<title>DFS: 한 갈래를 끝까지 내려간 뒤 돌아온다</title>
<desc>그래프 0–1, 0–2, 1–3, 1–4, 2–5 에서 0 부터 깊이 우선으로 돌면, 1 로 내려가 3, 4 를 끝까지 본 뒤 돌아와 2, 5 를 본다 — 0, 1, 3, 4, 2, 5. 재귀로 쓰면 콜 스택이 돌아올 자리를 기억하고, 명시적 스택으로 쓰면 이웃을 거꾸로 넣어 첫 이웃이 먼저 나오게 한다. 이미 방문한 노드는 건너뛴다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:12px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.r{font-size:11.5px;fill:#B3261E}.g{font-size:11.5px;fill:#2E7D32}.x{font-size:12px;font-family:ui-monospace,Menlo,monospace;fill:#999;text-decoration:line-through}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#B3261E"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2E7D32"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2F6DB5"/></marker></defs>
<rect width="860" height="250" fill="#FFFFFF"/>
<line x1="200" y1="40" x2="110" y2="120" stroke="#8A8A8A"/>
<line x1="200" y1="40" x2="290" y2="120" stroke="#8A8A8A"/>
<line x1="110" y1="120" x2="60" y2="200" stroke="#8A8A8A"/>
<line x1="110" y1="120" x2="160" y2="200" stroke="#8A8A8A"/>
<line x1="290" y1="120" x2="290" y2="200" stroke="#8A8A8A"/>
<circle cx="200" cy="40" r="18" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="200" y="45" text-anchor="middle" class="b">0</text>
<circle cx="110" cy="120" r="18" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="110" y="125" text-anchor="middle" class="b">1</text>
<circle cx="290" cy="120" r="18" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="290" y="125" text-anchor="middle" class="b">2</text>
<circle cx="60" cy="200" r="18" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="60" y="205" text-anchor="middle" class="b">3</text>
<circle cx="160" cy="200" r="18" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="160" y="205" text-anchor="middle" class="b">4</text>
<circle cx="290" cy="200" r="18" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="290" y="205" text-anchor="middle" class="b">5</text>
<rect x="420" y="40" width="410" height="70" rx="7" fill="#E3F1E4" stroke="#2E7D32" stroke-width="1.5"/>
<text x="625" y="69" text-anchor="middle" class="b">방문 순서</text>
<text x="625" y="89" text-anchor="middle" class="m">0 → 1 → 3 → 4 → 2 → 5</text>
<rect x="420" y="130" width="410" height="90" rx="7" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1.5"/>
<text x="625" y="159" text-anchor="middle" class="b">돌아올 자리를 누가 기억하나</text>
<text x="625" y="179" text-anchor="middle" class="s">재귀: 콜 스택</text>
<text x="625" y="199" text-anchor="middle" class="s">스택: 이웃을 거꾸로 push — 첫 이웃이 먼저 pop</text>
</svg>
