<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 230" width="100%" role="img">
<title>MDIR 스타일 SQLite 탐색기: 어디에 붙일까 셋</title>
<desc>SQLite DB 를 MDIR 처럼 목록으로 훑고 고르는 도구를 만든다. 붙일 자리가 셋이다: Neovim 안에서 Telescope 로(:StoryBrowse·:StorySearch), VS Code 확장으로(Activity Bar·Tree View·Quick Pick), 또는 Bun 의 --compile 로 DB·웹서버·프론트엔드를 실행 파일 하나(약 100MB)에 묶어 어디서든.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:12px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.r{font-size:11.5px;fill:#B3261E}.g{font-size:11.5px;fill:#2E7D32}.x{font-size:12px;font-family:ui-monospace,Menlo,monospace;fill:#999;text-decoration:line-through}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#B3261E"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2E7D32"/></marker></defs>
<rect width="860" height="230" fill="#FFFFFF"/>
<rect x="330" y="30" width="200" height="56" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="430" y="52" text-anchor="middle" class="b">SQLite DB</text>
<text x="430" y="72" text-anchor="middle" class="s">목록으로 훑고 고른다</text>
<rect x="30" y="130" width="240" height="70" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="150" y="159" text-anchor="middle" class="b">Neovim Telescope</text>
<text x="150" y="179" text-anchor="middle" class="s">:StoryBrowse · :StorySearch</text>
<path d="M430 86 L150 126" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<rect x="310" y="130" width="240" height="70" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="430" y="159" text-anchor="middle" class="b">VS Code 확장</text>
<text x="430" y="179" text-anchor="middle" class="s">Activity Bar · Tree View · Quick Pick</text>
<path d="M430 86 L430 126" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<rect x="590" y="130" width="240" height="70" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="710" y="159" text-anchor="middle" class="b">Bun --compile</text>
<text x="710" y="179" text-anchor="middle" class="s">DB + 서버 + 프론트 한 파일 (~100MB)</text>
<path d="M430 86 L710 126" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
</svg>
