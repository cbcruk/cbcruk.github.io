<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="100%" role="img">
<title>location.href 두 번 — JS 는 끝까지 돌고, 이동은 그 뒤에 시작된다</title>
<desc>JS(콜 스택): href = '/a' → 실행됨 1 → href = '/b' → 실행됨 2 → evaluate 반환까지 끊기지 않고 돈다. href 를 넣을 때는 이동 요청만 등록된다. await 였다면 첫 href 에서 멈췄어야 한다. 브라우저 이동은 evaluate 가 끝난 517ms 뒤에 시작된다: /a 가 시작되어 요청까지 나갔다가 /b 가 시작되며 ERR_ABORTED 로 취소되고, /b 가 요청되어 528ms 에 frameNavigated 로 도착한다. 서버는 /a 와 /b 를 둘 다 받았다. 마지막 값이 이기는 건 덮어써서가 아니라 앞의 이동이 시작됐다가 취소되기 때문이다. 눈금은 비례가 아니다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:12px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.o{font-size:12px;fill:#C2621A}.g{font-size:12px;fill:#2F6DB5}</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#C2621A"/></marker>
</defs>
<rect width="860" height="330" fill="#FFFFFF"/>

<text x="20" y="84" class="b">JS</text>
<text x="20" y="101" class="s">콜 스택</text>
<text x="20" y="184" class="b">브라우저 이동</text>
<text x="20" y="264" class="b">서버</text>

<text x="160" y="36" class="o">✕ await 였다면 여기서 멈추고 /a 로 갔어야 한다</text>
<line x1="192" y1="42" x2="192" y2="66" stroke="#C2621A" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#ao)"/>

<rect x="160" y="70" width="320" height="40" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="192" y="95" text-anchor="middle" class="m">href=/a</text>
<text x="256" y="95" text-anchor="middle" class="s">실행됨 1</text>
<text x="320" y="95" text-anchor="middle" class="m">href=/b</text>
<text x="384" y="95" text-anchor="middle" class="s">실행됨 2</text>
<text x="448" y="95" text-anchor="middle" class="s">반환</text>
<line x1="224" y1="76" x2="224" y2="104" stroke="#9DBEE6" stroke-width="1"/>
<line x1="288" y1="76" x2="288" y2="104" stroke="#9DBEE6" stroke-width="1"/>
<line x1="352" y1="76" x2="352" y2="104" stroke="#9DBEE6" stroke-width="1"/>
<line x1="416" y1="76" x2="416" y2="104" stroke="#9DBEE6" stroke-width="1"/>
<text x="160" y="128" class="s">512ms 시작 · href 는 이동 요청만 등록한다 — 흐름은 안 끊긴다</text>

<line x1="480" y1="56" x2="480" y2="290" stroke="#8A8A8A" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="486" y="62" class="s">517ms · evaluate 끝</text>

<rect x="492" y="164" width="150" height="34" rx="6" fill="#FDEBD8" stroke="#C2621A" stroke-width="1.5"/>
<text x="567" y="186" text-anchor="middle" class="m">/a 시작 → 요청</text>
<text x="642" y="216" text-anchor="end" class="o">✕ ERR_ABORTED</text>
<rect x="652" y="164" width="188" height="34" rx="6" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="746" y="186" text-anchor="middle" class="m">/b 시작 → 요청 → 도착</text>
<text x="840" y="216" text-anchor="end" class="g">528ms frameNavigated</text>
<text x="492" y="156" class="s">518ms</text>
<text x="652" y="156" class="s">523ms</text>

<line x1="520" y1="198" x2="520" y2="246" stroke="#C2621A" stroke-width="1.5" marker-end="url(#ao)"/>
<rect x="470" y="250" width="100" height="26" rx="5" fill="#FFFFFF" stroke="#C2621A" stroke-width="1.2"/>
<text x="520" y="268" text-anchor="middle" class="o">/a 받음</text>
<line x1="680" y1="198" x2="680" y2="246" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="630" y="250" width="100" height="26" rx="5" fill="#FFFFFF" stroke="#8A8A8A" stroke-width="1.2"/>
<text x="680" y="268" text-anchor="middle" class="s">/b 받음</text>

<text x="20" y="306" class="s">마지막 값이 이기는 건 덮어써서가 아니라 <tspan class="o">/a 가 시작됐다가 취소되기</tspan> 때문 · 취소된 /a 도 서버에는 도착했다</text>
<text x="20" y="324" class="s">Chrome 154 headless 실측 · 눈금은 비례 아님</text>
</svg>
