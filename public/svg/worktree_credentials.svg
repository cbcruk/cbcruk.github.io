<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" width="100%" role="img">
<title>자격증명 축소가 먼저다</title>
<desc>VM 으로 파일시스템 경계를 그어도 그 안에 전권 토큰을 넣으면 토큰은 계정 전체에 닿는다 — 실제 폭발 반경은 VM 이 아니라 계정이다. 위협은 사고만이 아니라 prompt injection 이다: 이슈 본문·PR 코멘트·의존성 README 를 읽는 순간 외부 텍스트가 명령이 된다. 순서: 1 토큰 축소(30분·1회) — fine-grained PAT, 대상 리포만, Contents·PR·Issues 만 read/write, Workflows 와 Administration 제외, 만료일. 2 실행 격리 — 순수 웹/Node 만 devcontainer 에서 bypassPermissions, 네이티브 의존은 컨테이너 불가라 기본 권한. 3 주입 표면 좁히기 — 신뢰할 수 없는 텍스트를 읽는 세션과 쓰기 권한 세션을 나눈다. 컨테이너를 미룰 때 비용이 거의 없는 토큰 축소까지 미루지 않는다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:11.5px;font-family:ui-monospace,Menlo,monospace}.mb{font-size:12px;font-weight:600;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.o{font-size:12px;fill:#C2621A}.r{font-size:12px;fill:#B3261E}.g{font-size:12px;fill:#2E7D32}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#C2621A"/></marker></defs>
<rect width="860" height="320" fill="#FFFFFF"/>
<rect x="20" y="36" width="300" height="120" rx="7" fill="#FFFFFF" stroke="#B3261E" stroke-width="1.5"/>
<rect x="40" y="64" width="150" height="70" rx="7" fill="#FFFFFF" stroke="#8A8A8A" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="115.0" y="94" text-anchor="middle" class="b">VM 경계</text>
<text x="115.0" y="112" text-anchor="middle" class="s">파일시스템만 격리</text>
<text x="36" y="54" class="r">실제 폭발 반경 = 계정 전체</text>
<rect x="210" y="80" width="90" height="36" rx="7" fill="#FFFFFF" stroke="#B3261E" stroke-width="1.5"/>
<text x="255.0" y="102" text-anchor="middle" class="s">전권 토큰</text>
<text x="20" y="184" class="b">외부 텍스트가 명령이 된다</text>
<text x="20" y="206" class="s">이슈 본문 · PR 코멘트 · 의존성 README</text>
<text x="20" y="226" class="o">→ 위협은 사고가 아니라 prompt injection</text>
<rect x="370" y="20" width="470" height="74" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="605.0" y="43" text-anchor="middle" class="b">1 토큰 축소 — 30분 · 1회</text>
<text x="605.0" y="61" text-anchor="middle" class="s">fine-grained PAT · 대상 리포만 · Contents/PR/Issues</text>
<text x="605.0" y="79" text-anchor="middle" class="s">Workflows · Administration 제외 · 만료일</text>
<rect x="370" y="106" width="470" height="74" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="605.0" y="129" text-anchor="middle" class="b">2 실행 격리</text>
<text x="605.0" y="147" text-anchor="middle" class="s">순수 웹/Node 만 devcontainer + bypassPermissions</text>
<text x="605.0" y="165" text-anchor="middle" class="s">네이티브 의존 → 컨테이너 불가, 기본 권한</text>
<line x1="605" y1="94" x2="605" y2="104" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="370" y="192" width="470" height="74" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="605.0" y="215" text-anchor="middle" class="b">3 주입 표면 좁히기</text>
<text x="605.0" y="233" text-anchor="middle" class="s">외부 텍스트를 읽는 세션 ≠ 쓰기 권한 세션</text>
<text x="605.0" y="251" text-anchor="middle" class="s">웹 페치 + gh 쓰기가 한 세션 = 유출 경로</text>
<line x1="605" y1="180" x2="605" y2="190" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<text x="20" y="296" class="o">컨테이너를 미룰 때 비용이 거의 없는 1번까지 같이 미루지 않는다</text>
</svg>
