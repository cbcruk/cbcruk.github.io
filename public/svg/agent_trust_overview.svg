<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 395" width="100%" role="img">
<title>에이전트 신뢰 — 구간과 레시피 순서</title>
<desc>먼저 R00 으로 거른다: 자동 검증이 닿지 않는 도메인(실제 예약·결제·외부 파트너), 규칙이 코드 밖에 있는 영역(규제), 강제 계층 1~3층을 바꿀 권한이 없는 코드베이스는 자동화 대상에서 뺀다 — 방법론을 약화하지 않고 대상을 좁힌다. 남은 곳에서 구간을 오른다. 0 불신(출력을 매번 다 읽음, 병렬 0~1) → R02 검증 스킬과 R03 feature map. 1 관찰(툴 콜을 읽으며 실패 수집, 병렬 1~3) → R04 실패 모드 승격과 R05 eval. 2 위임(검증 경로가 있고 판정을 에이전트가 냄, 병렬 3~8) → R06 강제 계층, R07 리뷰를 하드 제약으로, R08 그린필드 가드레일. 3 자동화(하드 제약이 CI·hook 에, 병렬 8+) → R09 병렬화 기준. 4 무감독(자동 머지 후 사후 리뷰) → R10 자동 머지 진입 조건. 신뢰는 인프라의 결과라 순서를 건너뛰면 토큰만 태운다. 판정 질문: 지금 PR 을 읽지 않고 머지하면 문제를 며칠 뒤에 아는가 — 모르면 구간 0.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:11.5px;font-family:ui-monospace,Menlo,monospace}.mb{font-size:12px;font-weight:600;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.o{font-size:12px;fill:#C2621A}.r{font-size:12px;fill:#B3261E}.g{font-size:12px;fill:#2E7D32}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#C2621A"/></marker></defs>
<rect width="860" height="395" fill="#FFFFFF"/>
<text x="20" y="24" class="b">R00 먼저 거른다</text>
<rect x="20" y="36" width="200" height="150" rx="7" fill="#FFFFFF" stroke="#B3261E" stroke-width="1.5"/>
<text x="120.0" y="70" text-anchor="middle" class="b">자동화하지 않는 곳</text>
<text x="120.0" y="88" text-anchor="middle" class="s"></text>
<text x="120.0" y="106" text-anchor="middle" class="s">검증이 닿지 않는 도메인</text>
<text x="120.0" y="124" text-anchor="middle" class="s">예약 · 결제 · 외부 연동</text>
<text x="120.0" y="142" text-anchor="middle" class="s">규칙이 코드 밖 (규제)</text>
<text x="120.0" y="160" text-anchor="middle" class="s">1~3층을 못 바꾸는 코드</text>
<text x="120" y="206" text-anchor="middle" class="o">대상을 좁힌다</text>
<text x="120" y="224" text-anchor="middle" class="s">방법론은 그대로</text>
<rect x="260" y="296" width="290" height="46" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="405.0" y="314" text-anchor="middle" class="b">0 불신</text>
<text x="405.0" y="332" text-anchor="middle" class="s">매번 다 읽는다 · 병렬 0~1</text>
<text x="564" y="324" class="o">→ R02 검증 스킬 · R03 feature map</text>
<rect x="290" y="234" width="290" height="46" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="435.0" y="252" text-anchor="middle" class="b">1 관찰</text>
<text x="435.0" y="270" text-anchor="middle" class="s">툴 콜을 읽으며 실패 수집 · 1~3</text>
<text x="594" y="262" class="s">→ R04 실패 모드 승격 · R05 eval</text>
<line x1="330" y1="296" x2="330" y2="284" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="320" y="172" width="290" height="46" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="465.0" y="190" text-anchor="middle" class="b">2 위임</text>
<text x="465.0" y="208" text-anchor="middle" class="s">판정을 에이전트가 낸다 · 3~8</text>
<text x="624" y="200" class="s">→ R06 강제 계층 · R07 · R08</text>
<line x1="360" y1="234" x2="360" y2="222" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="350" y="110" width="290" height="46" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="495.0" y="128" text-anchor="middle" class="b">3 자동화</text>
<text x="495.0" y="146" text-anchor="middle" class="s">하드 제약이 CI · hook 에 · 8+</text>
<text x="654" y="138" class="s">→ R09 병렬화 기준</text>
<line x1="390" y1="172" x2="390" y2="160" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="380" y="48" width="290" height="46" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="525.0" y="66" text-anchor="middle" class="b">4 무감독</text>
<text x="525.0" y="84" text-anchor="middle" class="s">자동 머지 후 사후 리뷰</text>
<text x="684" y="76" class="s">→ R10 자동 머지 진입</text>
<line x1="420" y1="110" x2="420" y2="98" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="220" y1="110" x2="256" y2="300" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<text x="20" y="270" class="b">신뢰는 인프라의 결과</text>
<text x="20" y="290" class="s">순서를 건너뛰면</text>
<text x="20" y="308" class="s">토큰만 태운다</text>
<text x="20" y="382" class="o">판정 — 지금 PR 을 읽지 않고 머지하면 문제를 며칠 뒤에 아는가? 모르면 구간 0</text>
</svg>
