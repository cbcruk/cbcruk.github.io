<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="100%" role="img">
<title>지위 대신 프로토타입</title>
<desc>아이디어를 실행할 권리를 얻는 수단이 바뀌었다. 실행이 비쌀 때는 조직이 아이디어에 걸어 보기 전에 지위부터 쌓아야 했고, 기획서와 동의와 디자이너·PM 시간을 구하는 승인 층을 넘어야 했다. 실행이 싸진 지금은 주말에 만든 돌아가는 프로토타입이 그 자리를 대신한다. 보면 기회와 이걸 끌고 갈 사람을 바로 알아보기 때문이다. 지위 없는 사람이 볼 수 있는 것이 있어서 이 변화가 그들에게 특히 크다. 순서는 회사가 이루려는 목표를 알고, 그 목표를 크게 당길 아이디어를 고르고, 주말에 만들고, 좋은 아이디어 하나만 담는 것이다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.s{font-size:11.5px;fill:#555}.w{font-size:12px;font-weight:600}.r{fill:#B3261E}.g{fill:#2E8B4E}</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2E8B4E"/></marker>
</defs>
<rect width="760" height="360" fill="#FFFFFF"/>

<text x="20" y="24" class="b">아이디어를 실행할 권리를 무엇으로 얻나</text>

<text x="20" y="66" class="s">실행이 비쌀 때</text>
<rect x="120" y="48" width="80" height="32" rx="6" fill="#F3F3F3" stroke="#888"/>
<text x="160" y="69" text-anchor="middle" class="w">아이디어</text>
<line x1="202" y1="64" x2="300" y2="64" stroke="#555" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="302" y="42" width="16" height="44" fill="#B3261E"/>
<text x="330" y="60" class="w r">지위</text>
<text x="362" y="60" class="s r">— 연차로 쌓아야 조직이 걸어 본다</text>
<text x="330" y="78" class="s r">기획서 · 동의 · 디자이너·PM 시간 로비 · 몇 사람이 켜고 끄는 승인 층</text>

<text x="20" y="138" class="s">실행이 싼 지금</text>
<rect x="120" y="120" width="80" height="32" rx="6" fill="#F3F3F3" stroke="#888"/>
<text x="160" y="141" text-anchor="middle" class="w">아이디어</text>
<line x1="202" y1="136" x2="248" y2="136" stroke="#2E8B4E" stroke-width="1.6" marker-end="url(#g)"/>
<rect x="250" y="116" width="180" height="40" rx="6" fill="#E3F3E6" stroke="#2E8B4E" stroke-width="1.5"/>
<text x="340" y="141" text-anchor="middle" class="w">주말에 만든 프로토타입</text>
<line x1="432" y1="136" x2="478" y2="136" stroke="#2E8B4E" stroke-width="1.6" marker-end="url(#g)"/>
<text x="484" y="132" class="s g">보면 바로 안다: 기회 +</text>
<text x="484" y="148" class="s g">"끌고 갈 사람이 이 사람"</text>

<text x="20" y="190" class="s">왜 지위 없는 사람에게 특히 큰가 — 고참이 더는 못 느끼는 어색함, 아무도 확인 안 한 "불가능"이 보인다</text>

<line x1="20" y1="210" x2="740" y2="210" stroke="#DDD"/>
<text x="20" y="236" class="b">만드는 순서</text>
<rect x="20" y="250" width="170" height="60" rx="7" fill="#F7F7F7" stroke="#BBB"/>
<text x="32" y="270" class="w">① 백로그 말고 목표</text>
<text x="32" y="288" class="s">매니저의 매니저가</text>
<text x="32" y="304" class="s">가진 목표 높이</text>
<rect x="206" y="250" width="170" height="60" rx="7" fill="#F7F7F7" stroke="#BBB"/>
<text x="218" y="270" class="w">② 급진적 아이디어</text>
<text x="218" y="288" class="s">되면 목표를</text>
<text x="218" y="304" class="s">크게 당기는 것</text>
<rect x="392" y="250" width="170" height="60" rx="7" fill="#E3F3E6" stroke="#2E8B4E"/>
<text x="404" y="270" class="w">③ 주말에 만든다</text>
<text x="404" y="288" class="s">돌아가는 것으로</text>
<text x="404" y="304" class="s">문서 대신 말한다</text>
<rect x="578" y="250" width="162" height="60" rx="7" fill="#FFF4D6" stroke="#B07D00"/>
<text x="590" y="270" class="w">④ 하나만 담는다</text>
<text x="590" y="288" class="s">좋은 셋을 나쁜 스물</text>
<text x="590" y="304" class="s">사이에 숨기지 않는다</text>
<text x="20" y="338" class="s">내내: 사용자 쪽이면 바깥 사용자의 감각, 인프라면 "불가능"한 이유를 배운 적 없다는 것을 쓴다</text>
</svg>
