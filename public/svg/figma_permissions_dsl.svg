<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 230" width="100%" role="img">
<title>Figma 권한 DSL: 정책을 JSON 으로, 평가는 TypeScript 로</title>
<desc>Figma 는 흩어진 권한 로직(불필요한 복잡성·계층 권한 비효율·DB 부하·여러 진실 소스)을 JSON 으로 직렬화되는 DSL 로 모았다. 식은 셋뿐이다: [필드, 연산자, 값] 꼴의 이항 식, 그리고 그걸 묶는 and·or. 예: file.id 가 null 이 아니고 team.permission 이 open 이면. 정책이 데이터라 어디로든 보낼 수 있고, TypeScript 평가 엔진이 하나로 판정한다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:12px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.r{font-size:11.5px;fill:#B3261E}.g{font-size:11.5px;fill:#2E7D32}.x{font-size:12px;font-family:ui-monospace,Menlo,monospace;fill:#999;text-decoration:line-through}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#B3261E"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2E7D32"/></marker></defs>
<rect width="860" height="230" fill="#FFFFFF"/>
<rect x="30" y="40" width="360" height="150" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="210" y="79" text-anchor="middle" class="b">정책 (JSON)</text>
<text x="210" y="99" text-anchor="middle" class="m">{ and: [</text>
<text x="210" y="119" text-anchor="middle" class="m">  ['file.id', '&lt;&gt;', null],</text>
<text x="210" y="139" text-anchor="middle" class="m">  ['team.permission', '=', 'open']</text>
<text x="210" y="159" text-anchor="middle" class="m">]}</text>
<path d="M390 115 H456" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<text x="423" y="72" text-anchor="middle" class="s">평가</text>
<rect x="460" y="60" width="370" height="110" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="645" y="99" text-anchor="middle" class="b">TypeScript 평가 엔진</text>
<text x="645" y="119" text-anchor="middle" class="s">하나로 판정한다</text>
<text x="645" y="139" text-anchor="middle" class="s">이전: 복잡성 · 계층 비효율 · DB 부하 · 진실 소스 여럿</text>
</svg>
