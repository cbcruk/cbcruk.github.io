<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="100%" role="img">
<title>워크트리를 프로젝트 밖으로</title>
<desc>기본 위치 &lt;project&gt;/.claude/worktrees/&lt;name&gt; 은 프로젝트 안이라, 워크트리에서 node_modules 해석이 상위 프로젝트까지 올라가 의존성 삭제·다운그레이드 검증이 거짓 통과하고, tsc project references·vitest glob·rg·find 같은 재귀 도구가 전부 워크트리로 들어간다. AGENTS.md 에 적는 건 확률적 층이라 WorktreeCreate·WorktreeRemove 훅으로 내린다 — 이 훅은 기본 git 동작을 증강이 아니라 대체한다. 훅은 ~/.worktrees/&lt;project&gt;/&lt;name&gt; 에 만든다. stdout 은 경로 한 줄 전용이라 git worktree add 를 포함한 다른 출력은 전부 &gt;&amp;2 로 보내고, 비영 종료는 생성 중단이며 JSON 반환도 못 한다. 훅은 settings.local.json 이 아니라 settings.json 에 둔다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:11.5px;font-family:ui-monospace,Menlo,monospace}.mb{font-size:12px;font-weight:600;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.o{font-size:12px;fill:#C2621A}.r{font-size:12px;fill:#B3261E}.g{font-size:12px;fill:#2E7D32}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#C2621A"/></marker></defs>
<rect width="860" height="300" fill="#FFFFFF"/>
<text x="20" y="24" class="b">기본 위치 — 프로젝트 안</text>
<rect x="20" y="36" width="380" height="110" rx="7" fill="#FFFFFF" stroke="#B3261E" stroke-width="1.5"/>
<text x="36" y="58" class="m">&lt;project&gt;/</text>
<text x="52" y="80" class="m">node_modules/</text>
<text x="52" y="102" class="m">.claude/worktrees/&lt;name&gt;/</text>
<path d="M220 98 L240 98 L240 76 L160 76" fill="none" stroke="#C2621A" stroke-width="1.5" marker-end="url(#ao)"/>
<text x="250" y="92" class="o">해석이 위로 올라간다</text>
<text x="36" y="134" class="r">→ 의존성 삭제 검증이 거짓 통과 · rg · tsc · vitest 가 워크트리로</text>
<text x="460" y="24" class="b">훅으로 내린다 — 기본 동작을 대체</text>
<rect x="460" y="36" width="380" height="50" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="650.0" y="56" text-anchor="middle" class="mb">WorktreeCreate / WorktreeRemove</text>
<text x="650.0" y="74" text-anchor="middle" class="s">AGENTS.md 는 확률적 층 — 훅은 결정적</text>
<rect x="460" y="96" width="380" height="50" rx="7" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.5"/>
<text x="650.0" y="116" text-anchor="middle" class="mb">~/.worktrees/&lt;project&gt;/&lt;name&gt;</text>
<text x="650.0" y="134" text-anchor="middle" class="s">프로젝트 밖 — 해석이 섞이지 않는다</text>
<line x1="650" y1="86" x2="650" y2="92" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<text x="20" y="182" class="b">stdout 계약</text>
<rect x="20" y="194" width="260" height="50" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="150.0" y="214" text-anchor="middle" class="mb">stdout = 경로 한 줄</text>
<text x="150.0" y="232" text-anchor="middle" class="s">읽히는 유일한 출력</text>
<rect x="300" y="194" width="260" height="50" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="430.0" y="214" text-anchor="middle" class="mb">나머지는 전부 &gt;&amp;2</text>
<text x="430.0" y="232" text-anchor="middle" class="s">git worktree add 도 stdout 에 쓴다</text>
<rect x="580" y="194" width="260" height="50" rx="7" fill="#FFFFFF" stroke="#B3261E" stroke-width="1.5"/>
<text x="710.0" y="214" text-anchor="middle" class="b">비영 종료 = 생성 중단</text>
<text x="710.0" y="232" text-anchor="middle" class="s">JSON 반환도 못 한다</text>
<text x="20" y="278" class="s">훅은 settings.local.json 이 아니라 settings.json 에</text>
</svg>
