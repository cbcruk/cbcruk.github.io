<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 230" width="100%" role="img">
<title>Jest 부분 매칭: objectContaining · arrayContaining 을 중첩한다</title>
<desc>toHaveBeenCalledWith 나 toEqual 의 기대값 자리에 expect.objectContaining 을 넣으면 적은 속성만 맞으면 통과하고 나머지는 무시한다. 그 안의 속성 자리에 expect.arrayContaining 을 넣으면 배열이 적은 원소를 포함하기만 하면 된다. 반대로 배열 안의 객체를 부분 매칭하려면 arrayContaining 안에 objectContaining 을 넣는다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:12px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.r{font-size:11.5px;fill:#B3261E}.g{font-size:11.5px;fill:#2E7D32}.x{font-size:12px;font-family:ui-monospace,Menlo,monospace;fill:#999;text-decoration:line-through}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#B3261E"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2E7D32"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2F6DB5"/></marker></defs>
<rect width="860" height="230" fill="#FFFFFF"/>
<rect x="30" y="30" width="380" height="90" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="220" y="59" text-anchor="middle" class="b">받은 인자</text>
<text x="220" y="79" text-anchor="middle" class="m">{ id: 1, name: 'Alice',</text>
<text x="220" y="99" text-anchor="middle" class="m">  tags: ['developer', 'designer'] }</text>
<path d="M410 75 H456" stroke="#2E7D32" stroke-width="1.4" fill="none" marker-end="url(#ag)"/>
<rect x="460" y="30" width="370" height="90" rx="7" fill="#E3F1E4" stroke="#2E7D32" stroke-width="1.5"/>
<text x="645" y="59" text-anchor="middle" class="m">objectContaining({</text>
<text x="645" y="79" text-anchor="middle" class="m">  name: 'Alice',</text>
<text x="645" y="99" text-anchor="middle" class="m">  tags: arrayContaining(['designer']) })</text>
<rect x="30" y="150" width="800" height="50" rx="7" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1.5"/>
<text x="430" y="179" text-anchor="middle" class="m">toEqual(arrayContaining([objectContaining({ name: 'Alice' }), objectContaining({ id: 2 })]))</text>
</svg>
