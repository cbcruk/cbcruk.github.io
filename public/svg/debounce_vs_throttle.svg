<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 250" width="100%" role="img">
<title>debounce 는 멈출 때까지 기다리고, throttle 은 빈도를 제한한다</title>
<desc>"자바스크립트" 를 한 글자씩 치는 동안 입력 이벤트가 연달아 온다. debounce(300ms) 는 입력이 300ms 멈춘 뒤 마지막 값으로 한 번만 검색한다 — 검색어 필터링 UI 에 맞다. throttle(1초) 은 계속 치는 동안에도 1초에 최대 한 번씩 검색해 결과를 실시간으로 보여주면서 요청 수를 묶는다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:12px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.r{font-size:11.5px;fill:#B3261E}.g{font-size:11.5px;fill:#2E7D32}.x{font-size:12px;font-family:ui-monospace,Menlo,monospace;fill:#999;text-decoration:line-through}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#B3261E"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2E7D32"/></marker></defs>
<rect width="860" height="250" fill="#FFFFFF"/>
<text x="30" y="50" text-anchor="start" class="b">입력</text>
<line x1="120" y1="35" x2="120" y2="58" stroke="#555" stroke-width="2"/>
<line x1="170" y1="35" x2="170" y2="58" stroke="#555" stroke-width="2"/>
<line x1="215" y1="35" x2="215" y2="58" stroke="#555" stroke-width="2"/>
<line x1="265" y1="35" x2="265" y2="58" stroke="#555" stroke-width="2"/>
<line x1="300" y1="35" x2="300" y2="58" stroke="#555" stroke-width="2"/>
<line x1="350" y1="35" x2="350" y2="58" stroke="#555" stroke-width="2"/>
<line x1="390" y1="35" x2="390" y2="58" stroke="#555" stroke-width="2"/>
<line x1="440" y1="35" x2="440" y2="58" stroke="#555" stroke-width="2"/>
<line x1="470" y1="35" x2="470" y2="58" stroke="#555" stroke-width="2"/>
<line x1="515" y1="35" x2="515" y2="58" stroke="#555" stroke-width="2"/>
<text x="30" y="115" text-anchor="start" class="b">debounce</text>
<line x1="515" y1="100" x2="815" y2="100" stroke="#BBBBBB" stroke-dasharray="4 3"/>
<text x="665" y="92" text-anchor="middle" class="s">300ms 조용</text>
<rect x="810" y="96" width="12" height="28" fill="#2F6DB5"/>
<text x="820" y="140" text-anchor="end" class="s">1회</text>
<text x="30" y="190" text-anchor="start" class="b">throttle</text>
<rect x="120" y="172" width="12" height="28" fill="#2E7D32"/>
<rect x="320" y="172" width="12" height="28" fill="#2E7D32"/>
<rect x="520" y="172" width="12" height="28" fill="#2E7D32"/>
<text x="520" y="220" text-anchor="start" class="s">1초마다 최대 1회</text>
<text x="560" y="50" text-anchor="start" class="m">"자바스크립트"</text>
</svg>
