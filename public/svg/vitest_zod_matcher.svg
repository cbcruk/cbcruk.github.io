<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 210" width="100%" role="img">
<title>vitest 커스텀 매처: Response 를 Zod 스키마로</title>
<desc>expect.extend 로 toMatchSchema 를 추가한다. 매처는 Response 의 json 을 꺼내 schema.safeParseAsync 로 검사하고 성공 여부를 pass 로 돌려준다. 비동기 매처라 타입 선언의 반환은 R 이 아니라 Promise&lt;void&gt; 이고, 테스트에서 await expect(res).toMatchSchema(schema) 로 기다려야 한다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:12px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.r{font-size:11.5px;fill:#B3261E}.g{font-size:11.5px;fill:#2E7D32}.x{font-size:12px;font-family:ui-monospace,Menlo,monospace;fill:#999;text-decoration:line-through}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#B3261E"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2E7D32"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2F6DB5"/></marker></defs>
<rect width="860" height="210" fill="#FFFFFF"/>
<rect x="30" y="40" width="200" height="80" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="130" y="74" text-anchor="middle" class="m">Response</text>
<text x="130" y="94" text-anchor="middle" class="s">received</text>
<path d="M230 80 H276" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<text x="253" y="30" text-anchor="middle" class="s">.json()</text>
<rect x="280" y="40" width="250" height="80" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="405" y="74" text-anchor="middle" class="m">safeParseAsync</text>
<text x="405" y="94" text-anchor="middle" class="s">schema</text>
<path d="M530 80 H576" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<rect x="580" y="40" width="250" height="80" rx="7" fill="#E3F1E4" stroke="#2E7D32" stroke-width="1.5"/>
<text x="705" y="84" text-anchor="middle" class="m">{ pass: success }</text>
<rect x="30" y="140" width="800" height="50" rx="7" fill="#FFF4DE" stroke="#B7791F" stroke-width="1.5"/>
<text x="430" y="169" text-anchor="middle" class="m">await expect(res).toMatchSchema(schema)   — 선언 반환은 Promise&lt;void&gt;</text>
</svg>
