<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 230" width="100%" role="img">
<title>시트를 CSV 로 드라이브에: 셀마다 따옴표로 감싼다</title>
<desc>스프레드시트가 커서 보기 힘들 때 첫 시트의 모든 값을 CSV 로 만들어 구글 드라이브에 파일로 올린다. 셀에 쉼표·줄바꿈·큰따옴표가 있으면 join(",") 만으로는 열이 밀리므로, 셀마다 큰따옴표로 감싸고 안의 " 는 "" 로 겹친다. 행은 줄바꿈으로 잇고 DriveApp.createFile 로 만든 파일의 URL 을 로그로 찍는다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:12px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.r{font-size:11.5px;fill:#B3261E}.g{font-size:11.5px;fill:#2E7D32}.x{font-size:12px;font-family:ui-monospace,Menlo,monospace;fill:#999;text-decoration:line-through}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#B3261E"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2E7D32"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2F6DB5"/></marker></defs>
<rect width="860" height="230" fill="#FFFFFF"/>
<rect x="30" y="40" width="220" height="70" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="140" y="69" text-anchor="middle" class="b">첫 시트</text>
<text x="140" y="89" text-anchor="middle" class="m">getDataRange().getValues()</text>
<path d="M250 75 H306" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<rect x="310" y="30" width="280" height="90" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="450" y="59" text-anchor="middle" class="b">셀마다</text>
<text x="450" y="79" text-anchor="middle" class="m">a"b → "a""b"</text>
<text x="450" y="99" text-anchor="middle" class="s">쉼표·줄바꿈·따옴표에도 열이 안 밀린다</text>
<path d="M590 75 H646" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<rect x="650" y="40" width="180" height="70" rx="7" fill="#E3F1E4" stroke="#2E7D32" stroke-width="1.5"/>
<text x="740" y="69" text-anchor="middle" class="b">드라이브</text>
<text x="740" y="89" text-anchor="middle" class="m">createFile(…, CSV)</text>
</svg>
