<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 200" width="100%" role="img">
<title>webpack 의 .mjs: javascript/esm 을 javascript/auto 로</title>
<desc>webpack 은 .mjs 파일을 javascript/esm 으로 다뤄 require·module.exports 같은 CommonJS 를 막는다. node_modules 의 .mjs 가 CommonJS 를 섞어 쓰면 빌드가 깨지므로, 규칙에 type: javascript/auto 를 직접 주면 기본 규칙을 건너뛰고 둘 다 허용한다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:12px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.r{font-size:11.5px;fill:#B3261E}.g{font-size:11.5px;fill:#2E7D32}.x{font-size:12px;font-family:ui-monospace,Menlo,monospace;fill:#999;text-decoration:line-through}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#B3261E"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2E7D32"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2F6DB5"/></marker></defs>
<rect width="860" height="200" fill="#FFFFFF"/>
<rect x="30" y="40" width="200" height="90" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="130" y="79" text-anchor="middle" class="m">node_modules</text>
<text x="130" y="99" text-anchor="middle" class="m">*.mjs</text>
<path d="M230 70 H346" stroke="#B3261E" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
<text x="288" y="58" text-anchor="middle" class="s">기본 규칙</text>
<rect x="350" y="30" width="480" height="50" rx="7" fill="#FCE8E6" stroke="#B3261E" stroke-width="1.5"/>
<text x="590" y="59" text-anchor="middle" class="m">javascript/esm  — require · module.exports 금지</text>
<path d="M230 110 H346" stroke="#2E7D32" stroke-width="1.4" fill="none" marker-end="url(#ag)"/>
<text x="288" y="128" text-anchor="middle" class="s">type 지정</text>
<rect x="350" y="90" width="480" height="50" rx="7" fill="#E3F1E4" stroke="#2E7D32" stroke-width="1.5"/>
<text x="590" y="119" text-anchor="middle" class="m">javascript/auto  — 기본 규칙을 건너뛴다</text>
</svg>
