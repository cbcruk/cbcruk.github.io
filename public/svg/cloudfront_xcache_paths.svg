<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 310" width="100%" role="img">
<title>x-cache 값별로 요청이 가는 길</title>
<desc>Miss: 브라우저 → 엣지 → 오리진(S3)까지 가서 새로 받는다. 엣지 캐시가 비어 있었을 뿐 최신이라는 뜻은 아니다. Hit: 브라우저 → 엣지에서 멈추고 오리진에는 가지 않은 채 캐시본을 돌려준다 — 구버전이 서빙되는 지점이다. RefreshHit: 브라우저 → 엣지 → 오리진에 재검증 → 304 → 엣지가 캐시본을 돌려준다 — max-age=0 의 정상 동작이고 HTML 의 목표 상태다. 엣지의 TTL 타이머는 POP·경로별로 독립이라 새 화면과 구 화면이 재현성 없이 섞인다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:12px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.o{font-size:12px;fill:#C2621A}.g{font-size:12px;fill:#2F6DB5}</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#C2621A"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2F6DB5"/></marker>
</defs>
<rect width="860" height="310" fill="#FFFFFF"/>

<rect x="215" y="20" width="110" height="32" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="270" y="41" text-anchor="middle" class="b">브라우저</text>
<rect x="435" y="20" width="130" height="32" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="500" y="41" text-anchor="middle" class="b">엣지 (POP)</text>
<rect x="675" y="20" width="130" height="32" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="740" y="41" text-anchor="middle" class="b">오리진 (S3)</text>

<line x1="270" y1="52" x2="270" y2="272" stroke="#B5B5B5" stroke-width="1.2" stroke-dasharray="3 3"/>
<line x1="500" y1="52" x2="500" y2="272" stroke="#B5B5B5" stroke-width="1.2" stroke-dasharray="3 3"/>
<line x1="740" y1="52" x2="740" y2="272" stroke="#B5B5B5" stroke-width="1.2" stroke-dasharray="3 3"/>

<text x="20" y="84" class="m">Miss</text>
<text x="20" y="101" class="s">비어 있었을 뿐</text>
<line x1="270" y1="78" x2="496" y2="78" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="500" y1="78" x2="736" y2="78" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="740" y1="100" x2="274" y2="100" stroke="#555" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="620" y="94" text-anchor="middle" class="s">새로 받음</text>

<text x="20" y="154" class="m" style="fill:#C2621A">Hit</text>
<text x="20" y="171" class="o">구버전 서빙 지점</text>
<line x1="270" y1="148" x2="496" y2="148" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="500" y1="170" x2="274" y2="170" stroke="#C2621A" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ao)"/>
<text x="385" y="164" text-anchor="middle" class="o">캐시본</text>
<line x1="510" y1="148" x2="600" y2="148" stroke="#C2621A" stroke-width="1.5" stroke-dasharray="2 3"/>
<text x="608" y="153" class="o">✕ 오리진에 안 감 (TTL 안)</text>

<text x="20" y="224" class="m" style="fill:#2F6DB5">RefreshHit</text>
<text x="20" y="241" class="g">HTML 목표 상태</text>
<line x1="270" y1="214" x2="496" y2="214" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="500" y1="214" x2="736" y2="214" stroke="#2F6DB5" stroke-width="1.5" marker-end="url(#ab)"/>
<text x="620" y="208" text-anchor="middle" class="g">재검증</text>
<line x1="740" y1="234" x2="504" y2="234" stroke="#2F6DB5" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ab)"/>
<text x="620" y="250" text-anchor="middle" class="g">304</text>
<line x1="500" y1="256" x2="274" y2="256" stroke="#2F6DB5" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ab)"/>
<text x="385" y="250" text-anchor="middle" class="g">캐시본</text>

<text x="20" y="298" class="s">엣지의 TTL 타이머는 POP·경로별로 독립 — 새 화면과 구 화면이 재현성 없이 섞인다</text>
</svg>
