<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" width="100%" role="img">
<title>LB 가 만든 503 이 CORS 에러로 보이는 경로</title>
<desc>정상일 때는 OPTIONS 가 LB 를 지나 앱에 닿고 앱이 204 와 access-control-allow-origin 을 돌려준다. 장애일 때는 healthy 타깃이 0 이라 LB 가 앱에 닿지 못하고 CORS 헤더 없는 503 을 직접 만들어 돌려주며, 브라우저는 이를 CORS error 로 표시한다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:12px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.r{fill:#B3261E}</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2E8B4E"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#B3261E"/></marker>
</defs>
<rect width="760" height="310" fill="#FFFFFF"/>
<text x="20" y="26" class="b">정상</text>
<rect x="20" y="40" width="130" height="56" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="85" y="64" text-anchor="middle" class="b">브라우저</text>
<text x="85" y="82" text-anchor="middle" class="s">통과</text>
<rect x="315" y="40" width="130" height="56" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="380" y="64" text-anchor="middle" class="b">LB</text>
<text x="380" y="82" text-anchor="middle" class="m">awselb/2.0</text>
<rect x="610" y="40" width="130" height="56" rx="7" fill="#E3F3E6" stroke="#2E8B4E" stroke-width="1.5"/>
<text x="675" y="64" text-anchor="middle" class="b">앱</text>
<text x="675" y="82" text-anchor="middle" class="s">healthy</text>
<line x1="152" y1="62" x2="311" y2="62" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
<text x="231" y="55" text-anchor="middle" class="m">OPTIONS</text>
<line x1="447" y1="62" x2="606" y2="62" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
<text x="526" y="55" text-anchor="middle" class="s">전달</text>
<path d="M675 98 V124 H85 V100" fill="none" stroke="#2E8B4E" stroke-width="1.4" marker-end="url(#ab)"/>
<text x="380" y="142" text-anchor="middle" class="m">204 + access-control-allow-origin</text>
<text x="20" y="182" class="b">장애</text>
<rect x="20" y="196" width="130" height="56" rx="7" fill="#FBE4E2" stroke="#B3261E" stroke-width="1.5"/>
<text x="85" y="220" text-anchor="middle" class="b">브라우저</text>
<text x="85" y="238" text-anchor="middle" class="m r">"CORS error"</text>
<rect x="315" y="196" width="130" height="56" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="380" y="220" text-anchor="middle" class="b">LB</text>
<text x="380" y="238" text-anchor="middle" class="m">awselb/2.0</text>
<rect x="610" y="196" width="130" height="56" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="675" y="220" text-anchor="middle" class="b" fill-opacity="0.6">앱</text>
<text x="675" y="238" text-anchor="middle" class="s">healthy 0</text>
<line x1="152" y1="218" x2="311" y2="218" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
<text x="231" y="211" text-anchor="middle" class="m">OPTIONS</text>
<line x1="447" y1="218" x2="606" y2="218" stroke="#B3261E" stroke-width="1.4" stroke-dasharray="5 4"/>
<path d="M519 211 L533 225 M533 211 L519 225" stroke="#B3261E" stroke-width="2"/>
<text x="526" y="206" text-anchor="middle" class="s">닿지 못함</text>
<path d="M380 254 V280 H85 V256" fill="none" stroke="#B3261E" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="232" y="298" text-anchor="middle" class="m r">503 · CORS 헤더 없음</text>
<text x="400" y="298" class="s">LB 가 직접 만든 응답 — 앱을 거치지 않았다</text>
</svg>
