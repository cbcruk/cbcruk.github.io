<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 230" width="100%" role="img">
<title>진행 상태가 어디에 있나 — 재귀 대 포인터</title>
<desc>재귀로 순회하면 어디까지 했는지가 JS 콜 스택의 프레임(App → Main → List)에 쌓여 있어, 도중에 양보하려고 함수를 빠져나오면 그 프레임이 풀려나간다. 세 포인터로 순회하면 진행 상태가 workInProgress 포인터 하나로 줄어든다 — 노드마다 걸린 링크를 직접 따라가므로 호출 스택이 필요 없고, 멈추면 그 포인터만 남아 거기서 다시 시작한다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:11.5px;font-family:ui-monospace,Menlo,monospace}.mb{font-size:12px;font-weight:600;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.o{font-size:12px;fill:#C2621A}.r{font-size:12px;fill:#B3261E}.g{font-size:12px;fill:#2E7D32}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#C2621A"/></marker></defs>
<rect width="860" height="230" fill="#FFFFFF"/>
<text x="20" y="24" class="b">재귀</text>
<rect x="40" y="40" width="200" height="34" rx="7" fill="#FFFFFF" stroke="#8A8A8A" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="140.0" y="61" text-anchor="middle" class="m">List 프레임</text>
<rect x="40" y="80" width="200" height="34" rx="7" fill="#FFFFFF" stroke="#8A8A8A" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="140.0" y="101" text-anchor="middle" class="m">Main 프레임</text>
<rect x="40" y="120" width="200" height="34" rx="7" fill="#FFFFFF" stroke="#8A8A8A" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="140.0" y="141" text-anchor="middle" class="m">App 프레임</text>
<text x="260" y="80" class="s">진행 상태 = 콜 스택</text>
<text x="260" y="100" class="s">양보하려고 빠져나오면</text>
<text x="260" y="120" class="r">프레임이 풀려나간다</text>
<text x="460" y="24" class="b">세 포인터</text>
<rect x="480" y="60" width="160" height="44" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="560.0" y="86" text-anchor="middle" class="mb">workInProgress</text>
<rect x="700" y="60" width="120" height="44" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="760.0" y="86" text-anchor="middle" class="mb">List</text>
<line x1="640" y1="82" x2="696" y2="82" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<text x="480" y="140" class="s">진행 상태 = 포인터 하나</text>
<text x="480" y="160" class="g">멈춰도 남는다 → 거기서 다시 시작</text>
<text x="20" y="214" class="o">링크를 직접 따라가므로 호출 스택이 필요 없다 — 그래서 언제든 멈출 수 있다</text>
</svg>
