<svg width="100%" viewBox="0 0 680 430" role="img" style="" xmlns="http://www.w3.org/2000/svg"><title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Text 스타일 타입 헬퍼 4종의 트레이드오프 사분면</title><desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">가로축은 excess(프로퍼티명 오타) 검출 강도, 세로축은 개별 type 리터럴 보존 여부. 제네릭 항등함수는 좌상(리터럴 보존·excess 약함), Record&lt;K&gt; 방식은 우하(excess 잡힘·리터럴 미보존), satisfies와 Exact-never는 우상(둘 다 만족)에 위치하며 satisfies만 메시지 품질이 좋다.</desc>

