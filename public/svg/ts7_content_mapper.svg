<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="100%" role="img">
<title>CSS 모듈을 TypeScript 로 바꾸는 transform</title>
<desc>transform 은 CSS 를 네 단계로 TypeScript 모듈로 바꾼다. 먼저 파싱하고, 문법 오류가 있으면 진단을 남긴 뒤 관대한 파서로 다시 읽는다. 다음으로 내보낼 이름(클래스, id, keyframes, @value, :export 키)을 모으면서 CSS 에 적힌 위치를 같이 적는다. 그다음 이름을 설정에 따라 camelCase 같은 키로 바꾼다. 마지막으로 TypeScript 를 써 내려가면서, 키를 하나 쓸 때마다 그 자리를 원본 CSS 의 이름 자리에 잇는 대응 한 칸을 남긴다. 키와 원본 이름의 글자가 달라도 hover 와 정의로 가기는 CSS 의 그 이름으로 간다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:12px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.h{fill:#B07D00;font-weight:600}</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker>
<marker id="o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#B07D00"/></marker>
</defs>
<rect width="760" height="450" fill="#FFFFFF"/>
<rect x="20" y="20" width="160" height="56" rx="7" fill="#F3F3F3" stroke="#888"/>
<text x="100" y="42" text-anchor="middle" class="b">① parse</text>
<text x="100" y="62" text-anchor="middle" class="s">오류면 진단 + 관대하게 다시</text>
<line x1="182" y1="48" x2="198" y2="48" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="200" y="20" width="170" height="56" rx="7" fill="#F3F3F3" stroke="#888"/>
<text x="285" y="42" text-anchor="middle" class="b">② collectLocals</text>
<text x="285" y="62" text-anchor="middle" class="s">이름 + CSS 속 위치</text>
<line x1="372" y1="48" x2="388" y2="48" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="390" y="20" width="160" height="56" rx="7" fill="#F3F3F3" stroke="#888"/>
<text x="470" y="42" text-anchor="middle" class="b">③ exportsOf</text>
<text x="470" y="62" text-anchor="middle" class="s">이름 → 키 (camelCase…)</text>
<line x1="552" y1="48" x2="568" y2="48" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="570" y="20" width="170" height="56" rx="7" fill="#FFF4D6" stroke="#B07D00" stroke-width="1.5"/>
<text x="655" y="42" text-anchor="middle" class="b">④ render</text>
<text x="655" y="62" text-anchor="middle" class="s">TS 를 쓰며 대응을 남긴다</text>
<text x="20" y="112" class="b">button.module.css (원본)</text>
<rect x="20" y="122" width="300" height="150" rx="7" fill="#F7F7F7" stroke="#BBB"/>
<text x="34" y="148" class="m">/** 주 버튼 */</text>
<text x="34" y="170" class="m">.<tspan class="h" text-decoration="underline">btn-primary</tspan> {</text>
<text x="34" y="192" class="m">  color: white;</text>
<text x="34" y="214" class="m">}</text>
<text x="34" y="244" class="s">위치 1 · 길이 11 ← ②가 적어둔다</text>
<text x="420" y="112" class="b">만든 TypeScript (camelCase)</text>
<rect x="420" y="122" width="320" height="150" rx="7" fill="#F7F7F7" stroke="#BBB"/>
<text x="434" y="148" class="m">declare const styles: {</text>
<text x="434" y="170" class="m">  readonly <tspan class="h">"btn-primary"</tspan>: string;</text>
<text x="434" y="192" class="m">  readonly <tspan class="h">btnPrimary</tspan>: string;</text>
<text x="434" y="214" class="m">};  export default styles;</text>
<text x="434" y="236" class="m">export declare const <tspan class="h">btnPrimary</tspan>…</text>
<path d="M418 166 C 300 166, 200 200, 80 177" fill="none" stroke="#B07D00" stroke-width="1.3" marker-end="url(#o)"/>
<path d="M418 188 C 300 192, 200 205, 95 178" fill="none" stroke="#B07D00" stroke-width="1.3" marker-end="url(#o)"/>
<path d="M418 232 C 300 232, 200 215, 110 178" fill="none" stroke="#B07D00" stroke-width="1.3" marker-end="url(#o)"/>
<text x="20" y="306" class="s">키를 하나 쓸 때마다 [만든 위치, 키 길이, 원본 위치, 원본 길이, Alias, hover·정의·참조·강조] 한 칸.</text>
<text x="20" y="328" class="s">Alias — 키(btnPrimary)와 원본(btn-primary) 글자가 달라도, 에러·정의로 가기는 CSS 의 그 이름으로.</text>
<text x="20" y="358" class="s">hover 에는 앞의 /** */ 주석과 선언 CSS(12줄까지)가 뜬다.</text>
<text x="20" y="380" class="s">식별자가 아닌 키는 문자열 키로만, 식별자이고 예약어가 아니면 named export 도.</text>
<text x="20" y="402" class="s">composes 로 이 파일에 없는 클래스를 부르면 진단 (from 이 붙으면 건너뛴다).</text>
<text x="20" y="424" class="s">BOM 은 파서가 떼므로, 원본 위치와 진단 위치를 그만큼 민다.</text>
</svg>
