<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 190" width="100%" role="img">
<title>sharp: 여백을 자르고 절반으로</title>
<desc>PNG 마다 sharp 의 trim 으로 가장자리 여백을 잘라 낸 뒤, 잘린 이미지의 크기를 다시 읽어 가로·세로를 절반으로 resize 하고 .half.png 로 저장한다. 특정 영역만 잘라 내려면 extract 에 left·top 오프셋과 width·height 를 준다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:12px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.r{font-size:11.5px;fill:#B3261E}.g{font-size:11.5px;fill:#2E7D32}.x{font-size:12px;font-family:ui-monospace,Menlo,monospace;fill:#999;text-decoration:line-through}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#B3261E"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2E7D32"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2F6DB5"/></marker></defs>
<rect width="860" height="190" fill="#FFFFFF"/>
<rect x="30" y="40" width="200" height="100" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="130" y="84" text-anchor="middle" class="m">*.png</text>
<text x="130" y="104" text-anchor="middle" class="s">fast-glob</text>
<path d="M230 90 H276" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<text x="253" y="30" text-anchor="middle" class="s">trim</text>
<rect x="280" y="40" width="200" height="100" rx="7" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1.5"/>
<text x="380" y="84" text-anchor="middle" class="b">여백 제거</text>
<text x="380" y="104" text-anchor="middle" class="s">metadata 다시 읽기</text>
<path d="M480 90 H526" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<text x="503" y="30" text-anchor="middle" class="s">resize ½</text>
<rect x="530" y="40" width="300" height="100" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="680" y="84" text-anchor="middle" class="m">*.half.png</text>
<text x="680" y="104" text-anchor="middle" class="s">extract({ left, top, width, height }) 로 crop</text>
</svg>
