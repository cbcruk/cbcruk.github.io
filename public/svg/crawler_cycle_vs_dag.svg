<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" width="100%" role="img">
<title>크롤러의 사이클과 lychee 의 DAG</title>
<desc>크롤러: frontier(가변 작업 큐) → worker pool → fetch/parse → 새 링크가 visited 확인(enqueue 시점, 요청보다 먼저)을 거쳐 다시 frontier 로 돌아간다 — 이 back-edge 가 사이클이다. 일이 언제 바닥날지 모르므로 quiescence detector 가 따로 종료를 판정하고, 일이 남아 있는 동안 카운터가 0 을 읽는 창이 없어야 한다. lychee: inputs → extractor → checker → results. back-edge 가 없는 DAG 라 끝까지 흘려보내면 끝난다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:12px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.o{font-size:12px;fill:#C2621A}</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#C2621A"/></marker>
</defs>
<rect width="860" height="280" fill="#FFFFFF"/>

<text x="20" y="28" class="b">크롤러 — 사이클</text>
<rect x="40" y="44" width="150" height="50" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="115" y="65" text-anchor="middle" class="b">frontier</text>
<text x="115" y="83" text-anchor="middle" class="s">가변 작업 큐</text>
<rect x="240" y="44" width="150" height="50" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="315" y="74" text-anchor="middle" class="b">worker pool</text>
<rect x="440" y="44" width="150" height="50" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="515" y="74" text-anchor="middle" class="b">fetch / parse</text>
<line x1="190" y1="69" x2="236" y2="69" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="390" y1="69" x2="436" y2="69" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>

<path d="M515 94 L515 134 L115 134 L115 98" fill="none" stroke="#C2621A" stroke-width="1.5" marker-end="url(#ao)"/>
<rect x="240" y="120" width="160" height="28" rx="6" fill="#FFFFFF" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="320" y="139" text-anchor="middle" class="s">visited · enqueue 시점</text>
<text x="460" y="164" text-anchor="middle" class="o">새 링크 (back-edge)</text>
<text x="320" y="164" text-anchor="middle" class="s">요청보다 먼저</text>

<rect x="640" y="44" width="200" height="104" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="740" y="68" text-anchor="middle" class="b">quiescence detector</text>
<text x="740" y="90" text-anchor="middle" class="s">"이제 다 끝났나"</text>
<text x="740" y="112" text-anchor="middle" class="s">일이 남은 동안 카운터가</text>
<text x="740" y="130" text-anchor="middle" class="s">0 을 읽는 창이 없어야</text>
<line x1="590" y1="96" x2="636" y2="96" stroke="#8A8A8A" stroke-width="1.5" stroke-dasharray="3 3"/>

<text x="20" y="206" class="b">lychee — DAG</text>
<rect x="40" y="220" width="150" height="40" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="115" y="245" text-anchor="middle" class="b">inputs</text>
<rect x="240" y="220" width="150" height="40" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="315" y="245" text-anchor="middle" class="b">extractor</text>
<rect x="440" y="220" width="150" height="40" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="515" y="245" text-anchor="middle" class="b">checker</text>
<rect x="640" y="220" width="150" height="40" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="715" y="245" text-anchor="middle" class="b">results</text>
<line x1="190" y1="240" x2="236" y2="240" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="390" y1="240" x2="436" y2="240" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="590" y1="240" x2="636" y2="240" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<text x="800" y="206" text-anchor="end" class="s">back-edge 없음 · 흘려보내면 끝</text>
</svg>
