<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 210" width="100%" role="img">
<title>리다이렉트에서 query 를 갈아끼우면 측정 정보가 사라진다</title>
<desc>Google Optimize 의 Redirect 테스트는 리다이렉트하면서 utm_expid 같은 측정 정보를 query 에 붙인다. 우리 코드가 리다이렉트 URL 을 바꾸며 query 를 새로 만들어 버려 그 정보가 날아갔고, 기능은 돌지만 세션이 잡히지 않았다. replace 할 때 기존 query 를 이어 붙이도록 고쳐 해결했다. Charles 로 배포 없이 확인했다. Optimize 는 2023년 9월 30일 종료됐다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:12px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.r{font-size:11.5px;fill:#B3261E}.g{font-size:11.5px;fill:#2E7D32}.x{font-size:12px;font-family:ui-monospace,Menlo,monospace;fill:#999;text-decoration:line-through}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#B3261E"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2E7D32"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2F6DB5"/></marker></defs>
<rect width="860" height="210" fill="#FFFFFF"/>
<rect x="30" y="40" width="240" height="90" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="150" y="79" text-anchor="middle" class="b">Optimize redirect</text>
<text x="150" y="99" text-anchor="middle" class="m">?utm_expid=…</text>
<path d="M270 70 H446" stroke="#B3261E" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
<text x="358" y="58" text-anchor="middle" class="s">query 를 새로</text>
<rect x="450" y="40" width="380" height="45" rx="7" fill="#FCE8E6" stroke="#B3261E" stroke-width="1.5"/>
<text x="640" y="66" text-anchor="middle" class="s">utm_expid 가 사라진다 — 세션이 안 잡힌다</text>
<path d="M270 110 H446" stroke="#2E7D32" stroke-width="1.4" fill="none" marker-end="url(#ag)"/>
<text x="358" y="128" text-anchor="middle" class="s">기존 query 를 이어</text>
<rect x="450" y="95" width="380" height="45" rx="7" fill="#E3F1E4" stroke="#2E7D32" stroke-width="1.5"/>
<text x="640" y="122" text-anchor="middle" class="m">{ ...prevQuery, ...newQuery }</text>
<text x="30" y="180" text-anchor="start" class="s">Optimize 는 2023-09-30 종료 — 남는 건 교훈 · 확인은 Charles 로 배포 없이</text>
</svg>
