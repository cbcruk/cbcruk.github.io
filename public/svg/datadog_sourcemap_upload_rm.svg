<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 190" width="100%" role="img">
<title>소스맵: Datadog 에 올리고 배포물에서 지운다</title>
<desc>빌드 결과의 소스맵을 git 커밋 해시를 release-version 으로 붙여 datadog-ci 로 Datadog 에 올린다. 올린 뒤에는 build 에서 .map 파일을 지운다 — Datadog 은 이미 받아 두었으니 스택을 풀 수 있고, 브라우저에는 원본 소스가 노출되지 않는다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:12px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.r{font-size:11.5px;fill:#B3261E}.g{font-size:11.5px;fill:#2E7D32}.x{font-size:12px;font-family:ui-monospace,Menlo,monospace;fill:#999;text-decoration:line-through}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#B3261E"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2E7D32"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2F6DB5"/></marker></defs>
<rect width="860" height="190" fill="#FFFFFF"/>
<rect x="30" y="50" width="200" height="80" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="130" y="84" text-anchor="middle" class="m">./build</text>
<text x="130" y="104" text-anchor="middle" class="s">*.js · *.map</text>
<path d="M230 70 H446" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<text x="338" y="58" text-anchor="middle" class="s">datadog-ci sourcemaps upload</text>
<rect x="450" y="40" width="380" height="55" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="640" y="62" text-anchor="middle" class="b">Datadog</text>
<text x="640" y="82" text-anchor="middle" class="s">version = git 해시 · 스택을 푼다</text>
<path d="M230 110 H446" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<text x="338" y="128" text-anchor="middle" class="s">rm *.map</text>
<rect x="450" y="105" width="380" height="45" rx="7" fill="#E3F1E4" stroke="#2E7D32" stroke-width="1.5"/>
<text x="640" y="132" text-anchor="middle" class="s">배포물: .map 없음 — 원본이 노출되지 않는다</text>
</svg>
