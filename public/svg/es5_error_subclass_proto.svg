<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 210" width="100%" role="img">
<title>ES5 로 내리면 Error 상속의 instanceof 가 깨진다</title>
<desc>ES2015 이상에서는 Error 생성자가 new.target 으로 프로토타입 사슬을 서브클래스로 맞춰 준다. ES5 로 내리면 new.target 이 없어 만들어진 객체의 프로토타입이 Error.prototype 에 머물고, instanceof CustomError 가 false 가 된다. super() 바로 뒤에 Object.setPrototypeOf(this, CustomError.prototype) 로 직접 맞춘다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:12px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.r{font-size:11.5px;fill:#B3261E}.g{font-size:11.5px;fill:#2E7D32}.x{font-size:12px;font-family:ui-monospace,Menlo,monospace;fill:#999;text-decoration:line-through}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#B3261E"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2E7D32"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2F6DB5"/></marker></defs>
<rect width="860" height="210" fill="#FFFFFF"/>
<rect x="30" y="40" width="250" height="90" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="155" y="79" text-anchor="middle" class="m">new CustomError()</text>
<text x="155" y="99" text-anchor="middle" class="s">super(message)</text>
<path d="M280 70 H446" stroke="#2E7D32" stroke-width="1.4" fill="none" marker-end="url(#ag)"/>
<text x="363" y="58" text-anchor="middle" class="s">ES2015+ · new.target</text>
<rect x="450" y="30" width="380" height="50" rx="7" fill="#E3F1E4" stroke="#2E7D32" stroke-width="1.5"/>
<text x="640" y="59" text-anchor="middle" class="m">proto = CustomError.prototype ✓</text>
<path d="M280 110 H446" stroke="#B3261E" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
<text x="363" y="128" text-anchor="middle" class="s">ES5</text>
<rect x="450" y="90" width="380" height="50" rx="7" fill="#FCE8E6" stroke="#B3261E" stroke-width="1.5"/>
<text x="640" y="119" text-anchor="middle" class="m">proto = Error.prototype — instanceof ✗</text>
<rect x="450" y="155" width="380" height="40" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="640" y="179" text-anchor="middle" class="m">Object.setPrototypeOf(this, CustomError.prototype)</text>
</svg>
