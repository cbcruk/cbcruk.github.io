<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 210" width="100%" role="img">
<title>confirm 을 함수로 부르기: 별도 루트에 렌더하고 promise 로 답을 받는다</title>
<desc>확인 창은 window.confirm 처럼 함수로 불러 답을 받는 게 가장 편하다 — 컴포넌트 state 로 열고 닫으면 쓰는 곳마다 같은 코드가 반복된다. 그래서 react-confirm·react-confirm-alert 는 confirm 을 부르면 별도 DOM 노드에 createRoot 로 확인 창을 렌더하고, 사용자가 고르면 promise 를 그 답으로 resolve 한 뒤 루트를 걷는다. createRoot 에는 셀렉터 문자열이 아니라 DOM 요소를 넘긴다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:12px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.r{font-size:11.5px;fill:#B3261E}.g{font-size:11.5px;fill:#2E7D32}.x{font-size:12px;font-family:ui-monospace,Menlo,monospace;fill:#999;text-decoration:line-through}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#B3261E"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2E7D32"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2F6DB5"/></marker></defs>
<rect width="860" height="210" fill="#FFFFFF"/>
<rect x="30" y="40" width="200" height="90" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="130" y="79" text-anchor="middle" class="m">await confirm(…)</text>
<text x="130" y="99" text-anchor="middle" class="s">함수로 부른다</text>
<path d="M230 85 H276" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<text x="253" y="30" text-anchor="middle" class="s">createRoot(el)</text>
<rect x="280" y="40" width="250" height="90" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="405" y="79" text-anchor="middle" class="m">root.render(&lt;Confirm/&gt;)</text>
<text x="405" y="99" text-anchor="middle" class="s">별도 노드 · el 은 DOM 요소</text>
<path d="M530 85 H576" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<text x="553" y="30" text-anchor="middle" class="s">선택</text>
<rect x="580" y="40" width="250" height="90" rx="7" fill="#E3F1E4" stroke="#2E7D32" stroke-width="1.5"/>
<text x="705" y="79" text-anchor="middle" class="m">resolve(true | false)</text>
<text x="705" y="99" text-anchor="middle" class="m">root.unmount()</text>
<rect x="30" y="155" width="800" height="40" rx="7" fill="#FCE8E6" stroke="#B3261E" stroke-width="1.5"/>
<text x="430" y="179" text-anchor="middle" class="m">useState 로 열고 닫기 — 쓰는 곳마다 같은 코드가 반복된다</text>
</svg>
