<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="100%" role="img">
<title>useTransition·useOptimistic 대 React Query</title>
<desc>useTransition 으로 감싼 상태 갱신은 급하지 않은 것으로 처리돼, 타이핑 같은 급한 갱신이 먼저 되고 그동안 기존 화면을 유지하며 isPending 으로 진행을 알린다. await 뒤의 set 은 transition 에 안 잡혀 한 번 더 startTransition 으로 감싼다. useOptimistic 은 Action 이 진행 중일 때만 낙관적 값을 보여 주고 끝나면 원래 items 로 돌아간다 — 그래서 성공하면 items 를 갱신해야 남고, Action 밖에서 부르면 바로 되돌아간다. 그런데 React Query 가 캐싱·리페치·devtools·stale-while-revalidate·onMutate 롤백까지 이미 해 줘서, 쓰고 있다면 굳이일 때가 많다. useTransition 이 값을 하는 곳은 무거운 클라이언트 연산과 Server Actions 조합이다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:12px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.r{font-size:11.5px;fill:#B3261E}.g{font-size:11.5px;fill:#2E7D32}.x{font-size:12px;font-family:ui-monospace,Menlo,monospace;fill:#999;text-decoration:line-through}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#B3261E"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2E7D32"/></marker></defs>
<rect width="860" height="300" fill="#FFFFFF"/>
<rect x="30" y="30" width="380" height="110" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="220" y="69" text-anchor="middle" class="b">useTransition</text>
<text x="220" y="89" text-anchor="middle" class="s">급한 갱신 먼저, 기존 화면 유지 · isPending</text>
<text x="220" y="109" text-anchor="middle" class="m">await 뒤 set → 다시 startTransition</text>
<rect x="450" y="30" width="380" height="110" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="640" y="59" text-anchor="middle" class="b">useOptimistic</text>
<text x="640" y="79" text-anchor="middle" class="s">Action 진행 중에만 낙관적 값</text>
<text x="640" y="99" text-anchor="middle" class="s">끝나면 items — 성공하면 items 를 갱신</text>
<text x="640" y="119" text-anchor="middle" class="r">Action 밖에서 부르면 바로 되돌아간다</text>
<rect x="30" y="170" width="380" height="100" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="220" y="204" text-anchor="middle" class="b">React Query 가 이미</text>
<text x="220" y="224" text-anchor="middle" class="s">캐싱 · 리페치 · devtools · SWR</text>
<text x="220" y="244" text-anchor="middle" class="s">onMutate / onError 롤백</text>
<rect x="450" y="170" width="380" height="100" rx="7" fill="#E3F1E4" stroke="#2E7D32" stroke-width="1.5"/>
<text x="640" y="204" text-anchor="middle" class="b">useTransition 이 값을 하는 곳</text>
<text x="640" y="224" text-anchor="middle" class="s">무거운 클라이언트 연산</text>
<text x="640" y="244" text-anchor="middle" class="m">&lt;form action&gt; + Server Actions</text>
</svg>
