<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 200" width="100%" role="img">
<title>확장 설치 여부: 확장 리소스를 이미지로 불러 본다</title>
<desc>웹 페이지에서 chrome-extension://&lt;id&gt;/icon-128.png 를 img 로 불러 보고, 로드되면 설치된 것, 에러면 없거나 막힌 것으로 본다. 웹 페이지가 읽을 수 있는 확장 리소스는 manifest 의 web_accessible_resources 에 선언된 것뿐이라, 그 확장이 아이콘을 공개해 두었을 때만 이 방법이 통한다 — 기본값은 지문 채취를 막으려고 아무것도 공개하지 않는다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:12px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.r{font-size:11.5px;fill:#B3261E}.g{font-size:11.5px;fill:#2E7D32}.x{font-size:12px;font-family:ui-monospace,Menlo,monospace;fill:#999;text-decoration:line-through}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#B3261E"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2E7D32"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2F6DB5"/></marker></defs>
<rect width="860" height="200" fill="#FFFFFF"/>
<rect x="30" y="40" width="280" height="90" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="170" y="79" text-anchor="middle" class="m">new Image()</text>
<text x="170" y="99" text-anchor="middle" class="m">chrome-extension://id/…png</text>
<path d="M310 70 H446" stroke="#2E7D32" stroke-width="1.4" fill="none" marker-end="url(#ag)"/>
<text x="378" y="58" text-anchor="middle" class="s">onload</text>
<rect x="450" y="40" width="380" height="45" rx="7" fill="#E3F1E4" stroke="#2E7D32" stroke-width="1.5"/>
<text x="640" y="66" text-anchor="middle" class="m">설치됨</text>
<path d="M310 110 H446" stroke="#B3261E" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
<text x="378" y="128" text-anchor="middle" class="s">onerror</text>
<rect x="450" y="95" width="380" height="45" rx="7" fill="#FCE8E6" stroke="#B3261E" stroke-width="1.5"/>
<text x="640" y="122" text-anchor="middle" class="s">없거나 · web_accessible_resources 에 없다</text>
<text x="30" y="175" text-anchor="start" class="s">기본은 아무것도 공개하지 않는다 — 공개된 리소스만 이 방법이 통한다</text>
</svg>
