<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" width="100%" role="img">
<title>쿠폰 수집가: 90개 전부 보기까지 평균 457번</title>
<desc>목록 90개에서 매번 무작위로 하나를 뽑을 때, i 번째 새 항목을 만나기까지의 평균 대기는 90/(90-i+1) 번이다. 처음 수십 개는 한두 번이면 새것이 나오지만 끝으로 갈수록 대기가 급격히 길어지고, 마지막 한 개는 평균 90번을 기다린다 — 섞어서 한 바퀴 돌면 90개 전부를 보는 횟수다. 다 합치면 평균 457번으로, 섞어 도는 90번의 약 5배다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:12px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.r{font-size:12px;fill:#B3261E}</style>
