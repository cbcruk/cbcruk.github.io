<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 390" width="100%" role="img">
<title>2주 안의 워터폴과 수직 슬라이싱</title>
<desc>형식만 애자일: 2주 스프린트 안에서 기능 전체를 한 단위로 기획 → 디자인 → 서버/클라 → QA 가 차례로 넘긴다. 각 직군의 산출물이 다음 직군의 하드 의존성이라, 2주 컨테이너에 워터폴을 압축한 모양이 된다. 수직 슬라이싱: 같은 2주를 얇은 슬라이스 셋으로 잘라, 슬라이스마다 기획·디자인·서버/클라·QA 가 한 바퀴씩 돈다. 단기적으로는 모든 직군에 더 불편하다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:12px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.o{font-size:12px;fill:#C2621A}.g{font-size:12px;fill:#2F6DB5}</style>
<rect width="860" height="390" fill="#FFFFFF"/>

<text x="20" y="28" class="b">형식만 애자일 — 기능 전체가 한 단위</text>
<rect x="130" y="38" width="712" height="124" rx="8" fill="none" stroke="#B5B5B5" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="836" y="54" text-anchor="end" class="s">2주</text>
<text x="20" y="72" class="s">기획</text>
<text x="20" y="98" class="s">디자인</text>
<text x="20" y="124" class="s">서버/클라</text>
<text x="20" y="150" class="s">QA</text>
<rect x="140" y="60" width="170" height="16" rx="3" fill="#FDEBD8" stroke="#C2621A" stroke-width="1.2"/>
<rect x="310" y="86" width="170" height="16" rx="3" fill="#FDEBD8" stroke="#C2621A" stroke-width="1.2"/>
<rect x="480" y="112" width="180" height="16" rx="3" fill="#FDEBD8" stroke="#C2621A" stroke-width="1.2"/>
<rect x="660" y="138" width="170" height="16" rx="3" fill="#FDEBD8" stroke="#C2621A" stroke-width="1.2"/>
<text x="20" y="184" class="o">산출물이 다음 직군의 하드 의존성 → 2주 안에 압축된 워터폴</text>

<text x="20" y="220" class="b">수직 슬라이싱 — 기능을 얇게 잘라</text>
<rect x="130" y="230" width="712" height="124" rx="8" fill="none" stroke="#B5B5B5" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="836" y="246" text-anchor="end" class="s">2주</text>
<text x="20" y="264" class="s">기획</text>
<text x="20" y="290" class="s">디자인</text>
<text x="20" y="316" class="s">서버/클라</text>
<text x="20" y="342" class="s">QA</text>

<rect x="140" y="252" width="52" height="16" rx="3" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.2"/>
<rect x="192" y="278" width="52" height="16" rx="3" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.2"/>
<rect x="244" y="304" width="58" height="16" rx="3" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.2"/>
<rect x="302" y="330" width="52" height="16" rx="3" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.2"/>

<rect x="378" y="252" width="52" height="16" rx="3" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.2"/>
<rect x="430" y="278" width="52" height="16" rx="3" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.2"/>
<rect x="482" y="304" width="58" height="16" rx="3" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.2"/>
<rect x="540" y="330" width="52" height="16" rx="3" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.2"/>

<rect x="616" y="252" width="52" height="16" rx="3" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.2"/>
<rect x="668" y="278" width="52" height="16" rx="3" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.2"/>
<rect x="720" y="304" width="58" height="16" rx="3" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.2"/>
<rect x="778" y="330" width="52" height="16" rx="3" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.2"/>

<line x1="366" y1="240" x2="366" y2="350" stroke="#B5B5B5" stroke-width="1" stroke-dasharray="2 3"/>
<line x1="604" y1="240" x2="604" y2="350" stroke="#B5B5B5" stroke-width="1" stroke-dasharray="2 3"/>
<text x="20" y="378" class="g">슬라이스마다 전 직군이 한 바퀴 — 단기적으로는 모두에게 더 불편하다</text>
</svg>
