<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 220" width="100%" role="img">
<title>게시물 수정 내역: 바꾸기 전에 지금 행을 history 에 복사</title>
<desc>posts 와 post_history 는 1 : N 이다. 게시물을 수정하기 전에 지금의 제목·내용·수정 시각을 post_history 에 한 행으로 복사해 두고, 그다음 posts 를 새 값으로 UPDATE 한다. 게시물이 지워지면 ON DELETE CASCADE 로 내역도 같이 지워진다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:12px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.r{font-size:11.5px;fill:#B3261E}.g{font-size:11.5px;fill:#2E7D32}.x{font-size:12px;font-family:ui-monospace,Menlo,monospace;fill:#999;text-decoration:line-through}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#B3261E"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2E7D32"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2F6DB5"/></marker></defs>
<rect width="860" height="220" fill="#FFFFFF"/>
<rect x="30" y="40" width="300" height="110" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="180" y="79" text-anchor="middle" class="b">posts</text>
<text x="180" y="99" text-anchor="middle" class="m">id · title · content</text>
<text x="180" y="119" text-anchor="middle" class="m">created_at · updated_at</text>
<path d="M330 70 H446" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<text x="388" y="58" text-anchor="middle" class="s">① 지금 행 복사</text>
<rect x="450" y="40" width="380" height="110" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="640" y="69" text-anchor="middle" class="b">post_history (N)</text>
<text x="640" y="89" text-anchor="middle" class="m">post_id → posts.id</text>
<text x="640" y="109" text-anchor="middle" class="m">title · content · updated_at</text>
<text x="640" y="129" text-anchor="middle" class="s">ON DELETE CASCADE</text>
<path d="M180 150 C 180 200, 300 200, 300 155" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<text x="330" y="195" text-anchor="start" class="s">② 그다음 UPDATE posts</text>
</svg>
