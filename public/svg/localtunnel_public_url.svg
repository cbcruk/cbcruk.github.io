<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 200" width="100%" role="img">
<title>로컬 포트에 공개 URL: 터널</title>
<desc>localtunnel 은 로컬 포트에 공개 URL 을 붙인다 — 배포나 DNS 설정 없이 남에게 보여 주거나 웹훅 같은 외부 콜백을 받을 때 쓴다. 서버가 listen 을 시작하면 그 포트로 터널을 연다. 다만 너무 느려서 ngrok 이나 cloudflared 가 현실적일 수 있다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:12px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.r{font-size:11.5px;fill:#B3261E}.g{font-size:11.5px;fill:#2E7D32}.x{font-size:12px;font-family:ui-monospace,Menlo,monospace;fill:#999;text-decoration:line-through}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#B3261E"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2E7D32"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2F6DB5"/></marker></defs>
<rect width="860" height="200" fill="#FFFFFF"/>
<rect x="30" y="40" width="230" height="90" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="145" y="79" text-anchor="middle" class="b">웹훅 · 다른 사람</text>
<text x="145" y="99" text-anchor="middle" class="s">외부</text>
<path d="M260 85 H306" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<text x="283" y="30" text-anchor="middle" class="s">https://name.loca.lt</text>
<rect x="310" y="40" width="230" height="90" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="425" y="69" text-anchor="middle" class="b">터널</text>
<text x="425" y="89" text-anchor="middle" class="m">localtunnel</text>
<text x="425" y="109" text-anchor="middle" class="s">느렸다 → ngrok · cloudflared</text>
<path d="M540 85 H586" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<rect x="590" y="40" width="240" height="90" rx="7" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1.5"/>
<text x="710" y="79" text-anchor="middle" class="m">localhost:PORT</text>
<text x="710" y="99" text-anchor="middle" class="s">배포 · DNS 없이</text>
</svg>
