<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="100%" role="img">
<title>WebSocket 과 SSE 비교</title>
<desc>WebSocket 은 별도 핸드셰이크로 여는 양방향 연결이고, SSE 는 서버가 text/event-stream 으로 계속 내보내는 평범한 HTTP 응답이라 서버에서 클라이언트로 한 방향만 간다. SSE 는 UTF-8 텍스트만 나르고, 끊기면 브라우저가 알아서 다시 연결하며 마지막 이벤트 id 를 기억한다. 이벤트에 이름을 붙일 수 있다. 대신 HTTP/1.1 에서는 브라우저와 도메인마다 연결이 6개로 묶이고, HTTP/2 에서는 기본 100개까지다. WebSocket API 는 역압이 없어 받는 속도를 못 따라가면 메모리에 쌓이고, 열린 연결이 있으면 뒤로 가기 캐시에서 빠질 수 있다. 가장 큰 갈림은 쓰기다: SSE 는 쓰기를 Fetch 로 따로 보내 같은 화면을 고치는 줄이 둘이 되고, 두 줄은 서로 경주해 순서가 깨진다. WebSocket 은 한 줄이라 내 요청과 응답의 순서가 지켜지고, 연결을 한 번만 인증한다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:11.5px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.r{fill:#B3261E}.g{fill:#2E8B4E}.w{font-size:12px;font-weight:600}</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2E8B4E"/></marker>
<marker id="o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9z" fill="#B07D00"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#B3261E"/></marker>
</defs>
<rect width="760" height="470" fill="#FFFFFF"/>

<!-- WebSocket -->
<text x="20" y="26" class="b">WebSocket — 한 줄로 주고받는다</text>
<rect x="20" y="40" width="80" height="160" rx="7" fill="#F3F3F3" stroke="#888"/>
<text x="60" y="124" text-anchor="middle" class="w">브라우저</text>
<rect x="290" y="40" width="80" height="160" rx="7" fill="#F3F3F3" stroke="#888"/>
<text x="330" y="124" text-anchor="middle" class="w">서버</text>
<rect x="104" y="56" width="182" height="128" rx="18" fill="#EAF1FB" stroke="#3B6FB6" stroke-width="1.5"/>
<text x="195" y="50" text-anchor="middle" class="s">핸드셰이크 한 번 · 인증 한 번</text>
<line x1="112" y1="78" x2="278" y2="78" stroke="#555" stroke-width="1.3" marker-end="url(#a)"/>
<text x="120" y="73" class="m">요청 1</text>
<line x1="112" y1="104" x2="278" y2="104" stroke="#555" stroke-width="1.3" marker-end="url(#a)"/>
<text x="120" y="99" class="m">요청 2</text>
<line x1="278" y1="140" x2="112" y2="140" stroke="#2E8B4E" stroke-width="1.3" marker-end="url(#g)"/>
<text x="230" y="135" class="m g">응답 1</text>
<line x1="278" y1="166" x2="112" y2="166" stroke="#2E8B4E" stroke-width="1.3" marker-end="url(#g)"/>
<text x="230" y="161" class="m g">응답 2</text>
<text x="195" y="222" text-anchor="middle" class="s g">같은 줄이라 보낸 순서대로 돌아온다</text>

<text x="20" y="262" class="b">약점</text>
<line x1="150" y1="290" x2="72" y2="290" stroke="#B3261E" stroke-width="1.3" marker-end="url(#r)"/>
<line x1="150" y1="304" x2="72" y2="304" stroke="#B3261E" stroke-width="1.3" marker-end="url(#r)"/>
<line x1="150" y1="318" x2="72" y2="318" stroke="#B3261E" stroke-width="1.3" marker-end="url(#r)"/>
<rect x="30" y="330" width="36" height="9" fill="#FBE9E7" stroke="#B3261E"/>
<rect x="30" y="318" width="36" height="9" fill="#FBE9E7" stroke="#B3261E"/>
<rect x="30" y="306" width="36" height="9" fill="#FBE9E7" stroke="#B3261E"/>
<rect x="30" y="294" width="36" height="9" fill="#FBE9E7" stroke="#B3261E"/>
<rect x="30" y="282" width="36" height="9" fill="#FBE9E7" stroke="#B3261E"/>
<text x="164" y="298" class="s">역압이 없다: 처리보다 빨리 오면</text>
<text x="164" y="316" class="s">메모리에 쌓인다 (WebTransport 는 있다)</text>
<text x="30" y="362" class="s">열린 연결이 있으면 뒤로 가기 캐시(bfcache)에서</text>
<text x="30" y="378" class="s">빠질 수 있다 → 다 쓰면 닫는다</text>

<line x1="380" y1="16" x2="380" y2="380" stroke="#DDD"/>

<!-- SSE -->
<text x="400" y="26" class="b">SSE — 서버가 흘려보내는 HTTP 응답</text>
<rect x="400" y="40" width="80" height="160" rx="7" fill="#F3F3F3" stroke="#888"/>
<text x="440" y="124" text-anchor="middle" class="w">브라우저</text>
<rect x="660" y="40" width="80" height="160" rx="7" fill="#F3F3F3" stroke="#888"/>
<text x="700" y="124" text-anchor="middle" class="w">서버</text>
<line x1="656" y1="76" x2="600" y2="76" stroke="#B07D00" stroke-width="3"/>
<line x1="580" y1="76" x2="486" y2="76" stroke="#B07D00" stroke-width="3" marker-end="url(#o)"/>
<text x="590" y="81" text-anchor="middle" class="b r">✕</text>
<text x="570" y="62" text-anchor="middle" class="m">text/event-stream</text>
<text x="570" y="98" text-anchor="middle" class="s">끊겨도 알아서 다시 연결,</text>
<text x="570" y="113" class="s" text-anchor="middle">마지막 id 부터 이어서</text>
<line x1="484" y1="160" x2="656" y2="160" stroke="#B3261E" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#r)"/>
<text x="570" y="152" text-anchor="middle" class="m r">쓰기는 Fetch 로 따로</text>
<text x="570" y="178" text-anchor="middle" class="s">요청마다 세션·사용자 조회를 다시</text>
<text x="570" y="222" text-anchor="middle" class="s r">받는 줄과 보내는 줄이 경주 → 순서 보장 없음</text>

<text x="400" y="262" class="b">덤과 한계</text>
<text x="400" y="288" class="s">받는 건 UTF-8 텍스트만 · event: 로 이름 붙인 이벤트</text>
<text x="400" y="314" class="s">HTTP/1.1 이면 브라우저+도메인당 연결 6개:</text>
<rect x="400" y="324" width="22" height="18" rx="3" fill="#E3F3E6" stroke="#2E8B4E"/>
<rect x="426" y="324" width="22" height="18" rx="3" fill="#E3F3E6" stroke="#2E8B4E"/>
<rect x="452" y="324" width="22" height="18" rx="3" fill="#E3F3E6" stroke="#2E8B4E"/>
<rect x="478" y="324" width="22" height="18" rx="3" fill="#E3F3E6" stroke="#2E8B4E"/>
<rect x="504" y="324" width="22" height="18" rx="3" fill="#E3F3E6" stroke="#2E8B4E"/>
<rect x="530" y="324" width="22" height="18" rx="3" fill="#E3F3E6" stroke="#2E8B4E"/>
<rect x="562" y="324" width="22" height="18" rx="3" fill="#FBE9E7" stroke="#B3261E" stroke-dasharray="3 2"/>
<text x="573" y="337" text-anchor="middle" class="m r">7</text>
<text x="592" y="337" class="s r">막힌다</text>
<text x="400" y="366" class="s">HTTP/2 면 서버와 협상해 기본 100개</text>

<line x1="20" y1="398" x2="740" y2="398" stroke="#BBB" stroke-width="1.2"/>
<text x="20" y="424" class="b">진짜 갈림은 줄 수다</text>
<text x="20" y="448" class="s">WebSocket 이어도 쓰기를 Fetch 로 하면 오른쪽처럼 두 줄이 되어 똑같이 경주한다 — 원인은 SSE 가 아니다.</text>
</svg>
