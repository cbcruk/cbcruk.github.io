<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 220" width="100%" role="img">
<title>Map 을 localStorage 에: 엔트리 배열로 저장</title>
<desc>JSON.stringify(map) 은 열거 가능한 자기 속성만 보므로 {} 가 된다. 그래서 [...map] 으로 엔트리 배열을 만들어 저장하고, 읽을 때 new Map(JSON.parse(data)) 로 되살린다. set·delete 마다 전체를 다시 저장한다. 출처당 5MiB 를 넘으면 setItem 이 QuotaExceededError 를 던진다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:12px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.r{font-size:11.5px;fill:#B3261E}.g{font-size:11.5px;fill:#2E7D32}.x{font-size:12px;font-family:ui-monospace,Menlo,monospace;fill:#999;text-decoration:line-through}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#B3261E"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2E7D32"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2F6DB5"/></marker></defs>
<rect width="860" height="220" fill="#FFFFFF"/>
<rect x="30" y="40" width="200" height="90" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="130" y="79" text-anchor="middle" class="b">Map</text>
<text x="130" y="99" text-anchor="middle" class="m">a → 1, b → 2</text>
<path d="M230 70 H436" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<text x="333" y="58" text-anchor="middle" class="s">JSON.stringify([...map])</text>
<path d="M436 105 H234" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<text x="333" y="125" text-anchor="middle" class="s">new Map(JSON.parse(data))</text>
<rect x="440" y="40" width="390" height="90" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="635" y="69" text-anchor="middle" class="b">localStorage</text>
<text x="635" y="89" text-anchor="middle" class="m">'[["a",1],["b",2]]'</text>
<text x="635" y="109" text-anchor="middle" class="s">출처당 5MiB — 넘으면 QuotaExceededError</text>
<rect x="30" y="160" width="800" height="40" rx="7" fill="#FCE8E6" stroke="#B3261E" stroke-width="1.5"/>
<text x="430" y="184" text-anchor="middle" class="m">JSON.stringify(map) == "{}"   — Map 은 열거 가능한 속성이 없다</text>
</svg>
