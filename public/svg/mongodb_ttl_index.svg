<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 230" width="100%" role="img">
<title>MongoDB TTL 인덱스: 시각이 지나면 백그라운드가 지운다</title>
<desc>expireAt 에 Date 를 넣고 { expireAt: 1 } 에 expireAfterSeconds: 0 인 TTL 인덱스를 걸면, 그 시각이 지난 문서를 MongoDB 가 지운다. 지우는 건 60초마다 도는 백그라운드 작업이라 즉시가 아니다. expireAt 이 Date 가 아니면 만료되지 않는다. 세션 만료·캐시·임시 데이터에 쓴다. SQLite 엔 TTL 이 없어 트리거나 외부 스케줄러로 만든다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:12px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.r{font-size:11.5px;fill:#B3261E}.g{font-size:11.5px;fill:#2E7D32}.x{font-size:12px;font-family:ui-monospace,Menlo,monospace;fill:#999;text-decoration:line-through}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#B3261E"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2E7D32"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2F6DB5"/></marker></defs>
<rect width="860" height="230" fill="#FFFFFF"/>
<rect x="30" y="40" width="250" height="70" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="155" y="69" text-anchor="middle" class="b">문서</text>
<text x="155" y="89" text-anchor="middle" class="m">expireAt: Date('…')</text>
<path d="M280 75 H336" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<text x="308" y="32" text-anchor="middle" class="s">TTL 인덱스</text>
<rect x="340" y="40" width="230" height="70" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="455" y="69" text-anchor="middle" class="m">{ expireAt: 1 }</text>
<text x="455" y="89" text-anchor="middle" class="m">expireAfterSeconds: 0</text>
<path d="M570 75 H626" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<text x="598" y="32" text-anchor="middle" class="s">60초마다</text>
<rect x="630" y="40" width="200" height="70" rx="7" fill="#E3F1E4" stroke="#2E7D32" stroke-width="1.5"/>
<text x="730" y="69" text-anchor="middle" class="b">삭제</text>
<text x="730" y="89" text-anchor="middle" class="s">즉시는 아니다</text>
<rect x="30" y="140" width="370" height="56" rx="7" fill="#FCE8E6" stroke="#B3261E" stroke-width="1.5"/>
<text x="215" y="172" text-anchor="middle" class="r">expireAt 이 Date 가 아니면 만료 안 됨</text>
<rect x="430" y="140" width="400" height="56" rx="7" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1.5"/>
<text x="630" y="172" text-anchor="middle" class="s">SQLite 는 TTL 없음 — 트리거 · 외부 스케줄러</text>
</svg>
