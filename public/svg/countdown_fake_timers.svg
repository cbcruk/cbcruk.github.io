<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 220" width="100%" role="img">
<title>카운트다운 테스트: 가짜 타이머를 직접 민다</title>
<desc>종료 시각을 지금부터 60초 뒤로 주고 Countdown 을 렌더하면 처음엔 비어 있다. vi.useFakeTimers 로 setTimeout·setInterval·Date 를 가짜로 바꾼 뒤 act 안에서 advanceTimersByTime(10000) 으로 10초를 밀면 00:00:50, 50초를 더 밀면 00:00:00 이 된다. advanceTimersByTime 은 그 시간 안에 걸린 타이머를 전부 실행한다. 끝나면 useRealTimers 로 되돌린다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:12px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.r{font-size:11.5px;fill:#B3261E}.g{font-size:11.5px;fill:#2E7D32}.x{font-size:12px;font-family:ui-monospace,Menlo,monospace;fill:#999;text-decoration:line-through}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#B3261E"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2E7D32"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2F6DB5"/></marker></defs>
<rect width="860" height="220" fill="#FFFFFF"/>
<rect x="30" y="50" width="170" height="70" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="115" y="69" text-anchor="middle" class="b">렌더</text>
<text x="115" y="89" text-anchor="middle" class="m">end = +60s</text>
<text x="115" y="109" text-anchor="middle" class="s">비어 있다</text>
<path d="M200 85 H256" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<text x="228" y="40" text-anchor="middle" class="s">+10s</text>
<rect x="260" y="50" width="170" height="70" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="345" y="89" text-anchor="middle" class="m">00:00:50</text>
<path d="M430 85 H486" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<text x="458" y="40" text-anchor="middle" class="s">+50s</text>
<rect x="490" y="50" width="170" height="70" rx="7" fill="#E3F1E4" stroke="#2E7D32" stroke-width="1.5"/>
<text x="575" y="89" text-anchor="middle" class="m">00:00:00</text>
<text x="30" y="170" text-anchor="start" class="s">act(() =&gt; vi.advanceTimersByTime(ms)) — 그 시간 안의 타이머를 전부 실행 · Date 도 가짜</text>
</svg>
