<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 190" width="100%" role="img">
<title>select 를 덜 고쳐서 꾸민다</title>
<desc>네이티브 select 를 버리지 않고 손대는 건 셋이다. font·letter-spacing·word-spacing 을 부모에서 상속받게 하고, appearance 를 꺼서 화살표를 직접 그리고, focus·required·invalid 상태마다 스타일을 준다. 키보드·스크린리더 동작은 네이티브가 그대로 맡는다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:12px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.r{font-size:11.5px;fill:#B3261E}.g{font-size:11.5px;fill:#2E7D32}.x{font-size:12px;font-family:ui-monospace,Menlo,monospace;fill:#999;text-decoration:line-through}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#B3261E"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2E7D32"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2F6DB5"/></marker></defs>
<rect width="860" height="190" fill="#FFFFFF"/>
<rect x="30" y="40" width="250" height="100" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="155" y="74" text-anchor="middle" class="b">글꼴 상속</text>
<text x="155" y="94" text-anchor="middle" class="m">font · letter-spacing</text>
<text x="155" y="114" text-anchor="middle" class="m">word-spacing: inherit</text>
<rect x="305" y="40" width="250" height="100" rx="7" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1.5"/>
<text x="430" y="74" text-anchor="middle" class="b">화살표</text>
<text x="430" y="94" text-anchor="middle" class="m">appearance: none</text>
<text x="430" y="114" text-anchor="middle" class="m">화살표를 직접</text>
<rect x="580" y="40" width="250" height="100" rx="7" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1.5"/>
<text x="705" y="74" text-anchor="middle" class="b">상태</text>
<text x="705" y="94" text-anchor="middle" class="m">:focus · :required</text>
<text x="705" y="114" text-anchor="middle" class="m">:invalid</text>
<text x="30" y="170" text-anchor="start" class="s">키보드·스크린리더 동작은 네이티브 select 가 그대로</text>
</svg>
