<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" width="100%" role="img">
<title>GenUI 세 갈래의 데이터 흐름</title>
<desc>Static 과 Declarative 는 Result 를 Node 로 바꾸는 한 칸만 다르다 — Static 은 우리 render() 함수, Declarative 는 모델. Open-ended 는 모델이 코드 문자열을 내놓아 계약 없이 샌드박스로 간다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px}.h{font-size:13px;font-weight:600}.s{font-size:12px;fill:#555}.hl{font-size:12px;font-weight:600;fill:#C2621A}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker></defs>
<rect width="820" height="320" fill="#FFFFFF"/>
<text x="370.0" y="20" text-anchor="middle" class="h">② 인텐트 계약</text>
<text x="370.0" y="36" text-anchor="middle" class="s">기획·도메인</text>
<path d="M218.0 52 V46 H522.0 V52" fill="none" stroke="#8A8A8A" stroke-width="1.2"/>
<text x="720.0" y="20" text-anchor="middle" class="h">① 카탈로그</text>
