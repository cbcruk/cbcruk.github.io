<line x1="414.0" y1="156" x2="434.0" y2="156" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="558.0" y="138.0" width="84" height="36" rx="6" fill="#FDEBD8" stroke="#C2621A" stroke-width="1.5"/>
