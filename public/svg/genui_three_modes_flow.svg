<rect x="548.0" y="74" width="104" height="112" rx="8" fill="none" stroke="#C2621A" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="600" y="68" text-anchor="middle" class="hl">여기만 다르다</text>
<text x="16" y="109" class="h">Static</text>
<rect x="108.0" y="86.0" width="84" height="36" rx="6" fill="#FDEBD8" stroke="#C2621A" stroke-width="1.5"/>
<text x="150" y="109" text-anchor="middle" class="b">모델</text>
<rect x="218.0" y="86.0" width="84" height="36" rx="6" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="260" y="109" text-anchor="middle" class="b">Args</text>
<line x1="194.0" y1="104" x2="214.0" y2="104" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="328.0" y="86.0" width="84" height="36" rx="6" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
