<rect x="678.0" y="138.0" width="84" height="36" rx="6" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="720" y="161" text-anchor="middle" class="b">Node</text>
<line x1="644.0" y1="156" x2="674.0" y2="156" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
