<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 200" width="100%" role="img">
<title>폼 제출 테스트: onSubmit 안에서 FormData 를 꺼내 비교</title>
<desc>입력란 두 개에 값을 넣고 로그인 버튼을 누르면 onSubmit 이 불린다. 테스트용 핸들러 안에서 preventDefault 한 뒤 new FormData(e.target) 를 Object.fromEntries 로 객체로 바꿔 기대값 { username, password } 와 비교하고, 바깥에서는 핸들러가 불렸는지만 확인한다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:12px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.r{font-size:11.5px;fill:#B3261E}.g{font-size:11.5px;fill:#2E7D32}.x{font-size:12px;font-family:ui-monospace,Menlo,monospace;fill:#999;text-decoration:line-through}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#B3261E"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2E7D32"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2F6DB5"/></marker></defs>
<rect width="860" height="200" fill="#FFFFFF"/>
<rect x="30" y="40" width="230" height="100" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="145" y="74" text-anchor="middle" class="b">fireEvent.change</text>
<text x="145" y="94" text-anchor="middle" class="m">아이디 = testuser</text>
<text x="145" y="114" text-anchor="middle" class="m">비밀번호 = password</text>
<path d="M260 90 H306" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<text x="283" y="30" text-anchor="middle" class="s">click</text>
<rect x="310" y="40" width="250" height="100" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="435" y="74" text-anchor="middle" class="b">onSubmit(e)</text>
<text x="435" y="94" text-anchor="middle" class="m">new FormData(e.target)</text>
<text x="435" y="114" text-anchor="middle" class="m">Object.fromEntries</text>
<path d="M560 90 H606" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<rect x="610" y="40" width="220" height="100" rx="7" fill="#E3F1E4" stroke="#2E7D32" stroke-width="1.5"/>
<text x="720" y="84" text-anchor="middle" class="m">{ username, password }</text>
<text x="720" y="104" text-anchor="middle" class="s">toEqual 로 비교</text>
</svg>
