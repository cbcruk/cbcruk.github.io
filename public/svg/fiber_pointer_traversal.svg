<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 410" width="100%" role="img">
<title>Fiber — 세 포인터로 도는 DFS</title>
<desc>노드마다 child(첫 자식), sibling(다음 형제), return(부모) 세 링크가 걸려 있다. App 의 child 는 Header, Header 의 sibling 은 Main, Main 의 child 는 List, 각자의 return 은 부모다. 규칙은 넷: child 가 있으면 내려가고, root 에 도달하면 끝내고, sibling 이 없으면 return 으로 올라가며 반복하고, sibling 이 있으면 옆으로 간다. 내려가는 길이 beginWork, 올라오는 길이 completeWork 라 한 노드를 두 번 지난다. 순서: begin App → begin Header → complete Header → begin Main → begin List → complete List → complete Main → complete App.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:11.5px;font-family:ui-monospace,Menlo,monospace}.mb{font-size:12px;font-weight:600;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.o{font-size:12px;fill:#C2621A}.r{font-size:12px;fill:#B3261E}.g{font-size:12px;fill:#2E7D32}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#C2621A"/></marker></defs>
<rect width="860" height="410" fill="#FFFFFF"/>
<rect x="370" y="30" width="120" height="44" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="430.0" y="56" text-anchor="middle" class="mb">App</text>
<rect x="190" y="130" width="120" height="44" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="250.0" y="156" text-anchor="middle" class="mb">Header</text>
<rect x="550" y="130" width="120" height="44" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="610.0" y="156" text-anchor="middle" class="mb">Main</text>
<rect x="550" y="230" width="120" height="44" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="610.0" y="256" text-anchor="middle" class="mb">List</text>
<line x1="400" y1="74" x2="260" y2="126" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<text x="300" y="96" text-anchor="end" class="m">child</text>
<line x1="310" y1="152" x2="546" y2="152" stroke="#555" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>
<text x="428" y="146" text-anchor="middle" class="m">sibling</text>
<path d="M220 130 L220 52 L366 52" fill="none" stroke="#C2621A" stroke-width="1.5" marker-end="url(#ao)"/>
<text x="214" y="96" text-anchor="end" class="o">return</text>
<path d="M640 130 L640 52 L494 52" fill="none" stroke="#C2621A" stroke-width="1.5" marker-end="url(#ao)"/>
<text x="648" y="96" class="o">return</text>
<line x1="590" y1="174" x2="590" y2="226" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<text x="582" y="204" text-anchor="end" class="m">child</text>
<path d="M640 230 L640 196 L644 178" fill="none" stroke="#C2621A" stroke-width="1.5" marker-end="url(#ao)"/>
<text x="648" y="212" class="o">return</text>
<text x="20" y="316" class="b">규칙</text>
<text x="30" y="338" class="s">1  child 있으면 → 내려간다</text>
<text x="30" y="356" class="s">2  root 에 도달하면 → 끝</text>
<text x="30" y="374" class="s">3  sibling 없으면 → return 으로 올라가며 반복</text>
<text x="30" y="392" class="s">4  sibling 있으면 → 옆으로</text>
<text x="420" y="316" class="b">순서 — 내려가며 beginWork, 올라오며 completeWork</text>
<text x="430" y="338" class="m">1  begin App</text>
<text x="430" y="356" class="m">2  begin Header</text>
<text x="430" y="374" class="s">3  complete Header</text>
<text x="430" y="392" class="m">4  begin Main</text>
<text x="630" y="338" class="m">5  begin List</text>
<text x="630" y="356" class="s">6  complete List</text>
<text x="630" y="374" class="s">7  complete Main</text>
<text x="630" y="392" class="s">8  complete App</text>
</svg>
