<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 230" width="100%" role="img">
<title>AuthContext 테스트: 저장소·Provider·훅 셋</title>
<desc>인증 컨텍스트를 세 층으로 테스트한다. localStorage 는 Storage.prototype.getItem 을 spy 해 auth_token 이면 test_token 을 돌려준다. Provider 는 token 을 보여 주고 login·logout 버튼을 가진 테스트 컴포넌트를 렌더해 상태 변화를 본다. useAuth 훅은 Provider 밖에서 renderHook 하면 에러, wrapper 로 Provider 를 감싸면 token 이 null 로 시작한다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:12px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.r{font-size:11.5px;fill:#B3261E}.g{font-size:11.5px;fill:#2E7D32}.x{font-size:12px;font-family:ui-monospace,Menlo,monospace;fill:#999;text-decoration:line-through}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#B3261E"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2E7D32"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2F6DB5"/></marker></defs>
<rect width="860" height="230" fill="#FFFFFF"/>
<rect x="30" y="40" width="250" height="110" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="155" y="69" text-anchor="middle" class="b">localStorage</text>
<text x="155" y="89" text-anchor="middle" class="m">spyOn(Storage.prototype,</text>
<text x="155" y="109" text-anchor="middle" class="m">  'getItem')</text>
<text x="155" y="129" text-anchor="middle" class="s">auth_token → test_token</text>
<rect x="305" y="40" width="250" height="110" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="430" y="69" text-anchor="middle" class="b">AuthProvider</text>
<text x="430" y="89" text-anchor="middle" class="m">&lt;p data-testid="token"&gt;</text>
<text x="430" y="109" text-anchor="middle" class="m">Login · Logout 버튼</text>
<text x="430" y="129" text-anchor="middle" class="s">상태 변화를 본다</text>
<rect x="580" y="40" width="250" height="110" rx="7" fill="#E3F1E4" stroke="#2E7D32" stroke-width="1.5"/>
<text x="705" y="79" text-anchor="middle" class="b">useAuth</text>
<text x="705" y="99" text-anchor="middle" class="m">밖 → throw</text>
<text x="705" y="119" text-anchor="middle" class="m">wrapper 안 → token null</text>
</svg>
