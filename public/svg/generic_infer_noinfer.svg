<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 220" width="100%" role="img">
<title>NoInfer 가 있을 때와 없을 때</title>
<desc>rows={[{ name: 'lee' }]} selectedRow={{ name: 'kim', age: 1 }} 를 넘긴다. NoInfer 가 없으면 두 자리 모두에서 후보를 줍고, 둘 다 객체 리터럴이라 union 으로 합쳐져 TRow 가 넓어지고 에러가 나지 않는다. NoInfer 가 있으면 selectedRow 는 후보로 줍지 않아 TRow = { name: string } 이 되고, selectedRow 를 그 타입으로 검사하다 age 에서 에러가 난다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:11.5px;font-family:ui-monospace,Menlo,monospace}.mb{font-size:12px;font-weight:600;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.o{font-size:12px;fill:#C2621A}.r{font-size:12px;fill:#B3261E}.g{font-size:12px;fill:#2E7D32}</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#C2621A"/></marker>
</defs>
<rect width="860" height="220" fill="#FFFFFF"/>
<text x="20" y="24" class="m">&lt;Table rows={[{ name: 'lee' }]} selectedRow={{ name: 'kim', age: 1 }} … /&gt;</text>

<text x="20" y="72" class="b">NoInfer 없음</text>
<rect x="140" y="42" width="270" height="56" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="275" y="64" text-anchor="middle" class="m">{ name: string }</text>
<text x="275" y="84" text-anchor="middle" class="m">{ name: string; age: number }</text>
<rect x="460" y="50" width="150" height="40" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="535" y="75" text-anchor="middle" class="s">union 으로 합친다</text>
<rect x="660" y="50" width="180" height="40" rx="7" fill="#FFFFFF" stroke="#B3261E" stroke-width="1.5"/>
<text x="750" y="75" text-anchor="middle" class="r">TRow 가 넓어짐 · 에러 없음</text>
<line x1="410" y1="70" x2="456" y2="70" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="610" y1="70" x2="656" y2="70" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>

<text x="20" y="162" class="b">NoInfer 있음</text>
<rect x="140" y="132" width="270" height="56" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="275" y="154" text-anchor="middle" class="m">{ name: string }</text>
<text x="275" y="174" text-anchor="middle" class="s">selectedRow 는 줍지 않는다</text>
<rect x="460" y="140" width="150" height="40" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="535" y="165" text-anchor="middle" class="m">{ name: string }</text>
<rect x="660" y="140" width="180" height="40" rx="7" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.5"/>
<text x="750" y="165" text-anchor="middle" class="g">selectedRow 검사 → age 에러</text>
<line x1="410" y1="160" x2="456" y2="160" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="610" y1="160" x2="656" y2="160" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<text x="535" y="206" text-anchor="middle" class="s">TRow</text>
<text x="275" y="206" text-anchor="middle" class="s">후보</text>
<text x="750" y="206" text-anchor="middle" class="s">결과</text>
</svg>
