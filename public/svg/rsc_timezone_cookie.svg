<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="100%" role="img">
<title>RSC 날짜: 타임존을 요청에 실어 서버에서 그린다</title>
<desc>서버가 날짜를 사용자 시간대로 그리려면 요청에 시간대가 있어야 한다. proxy(Next 16, 예전 middleware)가 쿠키 user-timezone, 없으면 Vercel 의 x-vercel-ip-timezone, 없으면 UTC 를 골라 요청 헤더 x-user-timezone 으로 넘기고, 서버 컴포넌트가 headers() 로 읽어 그 시간대로 렌더한다. 응답 헤더로 넘기면 headers() 가 못 읽는다. 클라이언트는 Intl 로 실제 시간대를 알아내 쿠키에 1년 저장한다. 그래서 첫 방문만 IP 추정값이고 그 뒤로는 정확하며, 서버가 이미 맞게 그려서 깜빡임(FOUT)이 없다. 대안인 useSyncExternalStore 는 서버에서 UTC 로 그린 뒤 클라이언트에서 실제 시간대로 다시 그려 하이드레이션 에러는 없지만 깜빡인다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:12px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.r{font-size:11.5px;fill:#B3261E}.g{font-size:11.5px;fill:#2E7D32}.x{font-size:12px;font-family:ui-monospace,Menlo,monospace;fill:#999;text-decoration:line-through}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#B3261E"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2E7D32"/></marker></defs>
<rect width="860" height="300" fill="#FFFFFF"/>
<rect x="30" y="30" width="200" height="90" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="130" y="49" text-anchor="middle" class="b">요청</text>
<text x="130" y="69" text-anchor="middle" class="m">cookie user-timezone</text>
<text x="130" y="89" text-anchor="middle" class="m">x-vercel-ip-timezone</text>
<text x="130" y="109" text-anchor="middle" class="m">UTC</text>
<path d="M230 75 H286" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<text x="258" y="22" text-anchor="middle" class="s">처음 있는 것</text>
<rect x="290" y="30" width="240" height="90" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="410" y="49" text-anchor="middle" class="b">proxy.js</text>
<text x="410" y="69" text-anchor="middle" class="m">요청 헤더</text>
<text x="410" y="89" text-anchor="middle" class="m">x-user-timezone</text>
<text x="410" y="109" text-anchor="middle" class="s">응답 헤더면 못 읽는다</text>
<path d="M530 75 H586" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<rect x="590" y="30" width="240" height="90" rx="7" fill="#E3F1E4" stroke="#2E7D32" stroke-width="1.5"/>
<text x="710" y="59" text-anchor="middle" class="b">서버 컴포넌트</text>
<text x="710" y="79" text-anchor="middle" class="m">await headers()</text>
<text x="710" y="99" text-anchor="middle" class="s">그 시간대로 렌더 — FOUT 없음</text>
<rect x="30" y="150" width="500" height="56" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="280" y="172" text-anchor="middle" class="b">클라이언트</text>
<text x="280" y="192" text-anchor="middle" class="m">cookie = Intl…timeZone (1년)  → 다음 요청부터 정확</text>
<path d="M130 150 V124" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<rect x="30" y="225" width="800" height="56" rx="7" fill="#FCE8E6" stroke="#B3261E" stroke-width="1.5"/>
<text x="430" y="247" text-anchor="middle" class="b">대안: useSyncExternalStore</text>
<text x="430" y="267" text-anchor="middle" class="s">서버 UTC → 클라이언트 실제 시간대로 다시 그린다 · 하이드레이션 에러는 없지만 깜빡인다</text>
</svg>
