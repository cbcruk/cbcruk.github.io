<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 210" width="100%" role="img">
<title>HttpOnly 쿠키는 브라우저 저장소에서 꺼낸다</title>
<desc>HttpOnly 는 페이지의 JS(document.cookie)에서만 가려질 뿐 브라우저 쿠키 저장소에는 있다. Puppeteer 의 browser.cookies() 가 그 저장소를 읽으므로 HttpOnly·Secure 쿠키도 받는다. 받은 쿠키를 파일에 저장해 두고 다음에 browser.setCookie 로 되돌려 쓰다가 만료되면 갱신한다. 예전 방식인 CDP Network.getAllCookies 와 page.setCookie 는 폐기됐다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:12px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.r{font-size:11.5px;fill:#B3261E}.g{font-size:11.5px;fill:#2E7D32}.x{font-size:12px;font-family:ui-monospace,Menlo,monospace;fill:#999;text-decoration:line-through}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#B3261E"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2E7D32"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2F6DB5"/></marker></defs>
<rect width="860" height="210" fill="#FFFFFF"/>
<rect x="30" y="40" width="230" height="90" rx="7" fill="#FCE8E6" stroke="#B3261E" stroke-width="1.5"/>
<text x="145" y="79" text-anchor="middle" class="m">document.cookie</text>
<text x="145" y="99" text-anchor="middle" class="s">HttpOnly 는 안 보인다</text>
<rect x="300" y="40" width="250" height="90" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="425" y="69" text-anchor="middle" class="b">브라우저 쿠키 저장소</text>
<text x="425" y="89" text-anchor="middle" class="m">browser.cookies()</text>
<text x="425" y="109" text-anchor="middle" class="s">httpOnly: true 도 있다</text>
<path d="M550 85 H596" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<text x="573" y="30" text-anchor="middle" class="s">저장</text>
<rect x="600" y="40" width="230" height="90" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="715" y="69" text-anchor="middle" class="m">cookies.json</text>
<text x="715" y="89" text-anchor="middle" class="m">browser.setCookie(…)</text>
<text x="715" y="109" text-anchor="middle" class="s">만료되면 갱신</text>
<text x="30" y="170" text-anchor="start" class="x">폐기: CDP Network.getAllCookies · page.setCookie</text>
</svg>
