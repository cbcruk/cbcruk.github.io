<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 200" width="100%" role="img">
<title>템플릿 리터럴 키: union 을 돌며 render 를 붙인다</title>
<desc>RenderPropNames 는 Title | Content | Actions 다. 매핑 타입이 멤버를 하나씩 K 로 돌고, as 가 키 이름을 `render${K}` 로 바꿔서 renderTitle·renderContent·renderActions 세 prop 이 생긴다. 각각 ReactNode 를 돌려주는 함수다. 이름을 바꾸는 as 는 TS 4.1 부터.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:12px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.r{font-size:11.5px;fill:#B3261E}.g{font-size:11.5px;fill:#2E7D32}.x{font-size:12px;font-family:ui-monospace,Menlo,monospace;fill:#999;text-decoration:line-through}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#B3261E"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2E7D32"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2F6DB5"/></marker></defs>
<rect width="860" height="200" fill="#FFFFFF"/>
<rect x="30" y="50" width="240" height="90" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="150" y="79" text-anchor="middle" class="b">RenderPropNames</text>
<text x="150" y="99" text-anchor="middle" class="m">'Title'</text>
<text x="150" y="119" text-anchor="middle" class="m">'Content' · 'Actions'</text>
<path d="M270 95 H336" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<text x="303" y="40" text-anchor="middle" class="s">as `render${K}`</text>
<rect x="340" y="40" width="490" height="110" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="585" y="69" text-anchor="middle" class="b">RenderProps</text>
<text x="585" y="89" text-anchor="middle" class="m">renderTitle: () =&gt; ReactNode</text>
<text x="585" y="109" text-anchor="middle" class="m">renderContent: () =&gt; ReactNode</text>
<text x="585" y="129" text-anchor="middle" class="m">renderActions: () =&gt; ReactNode</text>
</svg>
