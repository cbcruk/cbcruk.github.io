<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 220" width="100%" role="img">
<title>verbatimModuleSyntax: type 이 붙은 것만 지운다</title>
<desc>verbatimModuleSyntax 를 켜면 컴파일러가 import 가 타입으로만 쓰이는지 추측하지 않는다. type 표시가 없는 import 는 출력 JS 에 그대로 남고, type 표시가 있는 것만 통째로 지운다. 그래서 타입만 가져올 땐 import type 으로 적어야 한다 — 안 그러면 런타임에 없는 값을 import 하게 되어 TS1484 에러가 난다. 기존 코드는 fix-verbatim-module-syntax 로 자동으로 고친다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:12px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.r{font-size:11.5px;fill:#B3261E}.g{font-size:11.5px;fill:#2E7D32}.x{font-size:12px;font-family:ui-monospace,Menlo,monospace;fill:#999;text-decoration:line-through}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#B3261E"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2E7D32"/></marker></defs>
<rect width="860" height="220" fill="#FFFFFF"/>
<rect x="30" y="40" width="300" height="60" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="180" y="64" text-anchor="middle" class="m">import { A } from 'a'</text>
<text x="180" y="84" text-anchor="middle" class="s">A 는 타입뿐</text>
<path d="M330 70 H396" stroke="#B3261E" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
<text x="363" y="32" text-anchor="middle" class="s">남는다</text>
<rect x="400" y="40" width="430" height="60" rx="7" fill="#FCE8E6" stroke="#B3261E" stroke-width="1.5"/>
<text x="615" y="64" text-anchor="middle" class="m">import { A } from 'a'</text>
<text x="615" y="84" text-anchor="middle" class="r">출력에 그대로 → TS1484</text>
<rect x="30" y="130" width="300" height="60" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="180" y="164" text-anchor="middle" class="m">import type { A } from 'a'</text>
<path d="M330 160 H396" stroke="#2E7D32" stroke-width="1.4" fill="none" marker-end="url(#ag)"/>
<text x="363" y="122" text-anchor="middle" class="s">지운다</text>
<rect x="400" y="130" width="430" height="60" rx="7" fill="#E3F1E4" stroke="#2E7D32" stroke-width="1.5"/>
<text x="615" y="154" text-anchor="middle" class="m">(없음)</text>
<text x="615" y="174" text-anchor="middle" class="s">자동 수정: fix-verbatim-module-syntax</text>
</svg>
