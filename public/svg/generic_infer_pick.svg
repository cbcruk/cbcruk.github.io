<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 210" width="100%" role="img">
<title>TRow 고르기 — 내주는 쪽과 받는 쪽</title>
<desc>rows={dogs} 에서는 값을 내주는 쪽(공변) 후보 Dog, renderRow={(row: Animal) =&gt; …} 에서는 값을 받는 쪽(반변) 후보 Animal 이 나온다. 고르기는 받는 쪽이 기본으로 이기지만, 내주는 쪽이 더 좁으면(하위 타입이면) 더 정확한 내주는 쪽이 이긴다. Dog 는 Animal 의 하위 타입이라 TRow = Dog.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:11.5px;font-family:ui-monospace,Menlo,monospace}.mb{font-size:12px;font-weight:600;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.o{font-size:12px;fill:#C2621A}.r{font-size:12px;fill:#B3261E}.g{font-size:12px;fill:#2E7D32}</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#C2621A"/></marker>
</defs>
<rect width="860" height="210" fill="#FFFFFF"/>
<text x="20" y="26" class="b">넘긴 값</text>
<text x="320" y="26" class="b">후보 두 줄</text>
<text x="570" y="26" class="b">고르기</text>

<rect x="20" y="38" width="250" height="48" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="145" y="58" text-anchor="middle" class="m">rows={dogs}</text>
<text x="145" y="76" text-anchor="middle" class="s">값을 내준다</text>
<rect x="20" y="98" width="250" height="48" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="145" y="118" text-anchor="middle" class="m">renderRow={(row: Animal) =&gt; …}</text>
<text x="145" y="136" text-anchor="middle" class="s">값을 받는다</text>

<rect x="320" y="38" width="200" height="48" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="420" y="58" text-anchor="middle" class="s">내주는 쪽 (공변)</text>
<text x="420" y="76" text-anchor="middle" class="b">Dog</text>
<rect x="320" y="98" width="200" height="48" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="420" y="118" text-anchor="middle" class="s">받는 쪽 (반변)</text>
<text x="420" y="136" text-anchor="middle" class="b">Animal</text>
<line x1="270" y1="62" x2="316" y2="62" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="270" y1="122" x2="316" y2="122" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>

<rect x="570" y="38" width="270" height="108" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="705" y="62" text-anchor="middle" class="s">① 기본은 받는 쪽이 이긴다</text>
<text x="705" y="84" text-anchor="middle" class="s">② 단, 내주는 쪽이 더 좁으면</text>
<text x="705" y="102" text-anchor="middle" class="s">더 정확하니까 내주는 쪽이 이긴다</text>
<text x="705" y="130" text-anchor="middle" class="s">Dog 는 Animal 의 하위 타입 → ②</text>
<line x1="520" y1="62" x2="566" y2="80" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="520" y1="122" x2="566" y2="104" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>

<line x1="705" y1="146" x2="705" y2="160" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="605" y="164" width="200" height="36" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="705" y="187" text-anchor="middle" class="mb">TRow = Dog</text>
</svg>
