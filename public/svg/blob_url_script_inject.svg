<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 200" width="100%" role="img">
<title>Blob URL 로 스크립트 주입: src 는 비동기</title>
<desc>스크립트 문자열을 text/javascript Blob 으로 만들고 URL.createObjectURL 로 URL 을 얻어 script 의 src 로 넣는다. CSP 때문에 인라인 textContent 가 막힌 페이지에서도 된다(Firefox 58+). 다만 textContent 는 동기로 바로 돌지만 src 는 내용을 가져온 뒤에야 도는 비동기라, 주입한 코드가 쓸 초기화가 먼저 준비돼 있어야 한다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:12px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.r{font-size:11.5px;fill:#B3261E}.g{font-size:11.5px;fill:#2E7D32}.x{font-size:12px;font-family:ui-monospace,Menlo,monospace;fill:#999;text-decoration:line-through}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#B3261E"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2E7D32"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2F6DB5"/></marker></defs>
<rect width="860" height="200" fill="#FFFFFF"/>
<rect x="30" y="40" width="180" height="80" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="120" y="84" text-anchor="middle" class="m">new Blob([script])</text>
<path d="M210 80 H256" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<text x="233" y="30" text-anchor="middle" class="s">createObjectURL</text>
<rect x="260" y="40" width="180" height="80" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="350" y="84" text-anchor="middle" class="m">blob:…</text>
<path d="M440 80 H486" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<text x="463" y="30" text-anchor="middle" class="s">script.src</text>
<rect x="490" y="40" width="340" height="80" rx="7" fill="#FFF4DE" stroke="#B7791F" stroke-width="1.5"/>
<text x="660" y="74" text-anchor="middle" class="b">나중에 실행 (비동기)</text>
<text x="660" y="94" text-anchor="middle" class="s">textContent 는 즉시 · CSP 에 막힌다</text>
<text x="30" y="160" text-anchor="start" class="s">append → remove → revokeObjectURL 해도 이미 가져간 스크립트는 돈다</text>
</svg>
