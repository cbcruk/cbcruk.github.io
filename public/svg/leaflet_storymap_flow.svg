<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="100%" role="img">
<title>스토리맵의 흐름</title>
<desc>스프레드시트 두 장이 지도 이야기 한 편이 된다. Options 탭은 제목·배경 지도 같은 설정, Chapters 탭은 장마다 한 줄이다. 저장소의 csv 폴더에 두 파일이 있으면 그걸 읽고, 없으면 Google Sheets API 로 두 탭을 받는다. 장 한 줄은 왼쪽 글 블록 하나와, 좌표가 있으면 지도 마커 하나가 된다. 처음에 블록 높이를 재서 장마다 시작 위치를 누적해 둔다. 글을 스크롤하면 지금 위치가 어느 장의 구간에 드는지 찾아, 그 장의 마커를 강조하고 덧씌운 레이어를 바꾸고 그 좌표로 2초 동안 날아간다. 다음 장 시작 140px 전부터는 어느 장 구간도 아니라 지금 장이 그대로다. 반대로 마커를 누르면 글이 그 장으로 스크롤된다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:11px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11px;fill:#555}.w{font-size:12px;font-weight:600}.r{fill:#B3261E}.g{fill:#2E8B4E}.o{fill:#B07D00}</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker>
<marker id="o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#B07D00"/></marker>
</defs>
<rect width="760" height="440" fill="#FFFFFF"/>

<!-- load -->
<text x="20" y="24" class="b">① 읽기 — 시트 두 장</text>
<rect x="20" y="38" width="150" height="54" rx="7" fill="#F3F3F3" stroke="#888"/>
<text x="95" y="60" text-anchor="middle" class="m">csv/Options.csv</text>
<text x="95" y="78" text-anchor="middle" class="m">csv/Chapters.csv</text>
<text x="190" y="70" text-anchor="middle" class="s">없으면</text>
<rect x="210" y="38" width="190" height="54" rx="7" fill="#E3F3E6" stroke="#2E8B4E"/>
<text x="305" y="60" text-anchor="middle" class="w">Google Sheets API v4</text>
<text x="305" y="78" text-anchor="middle" class="m">values/Options · /Chapters</text>
<line x1="402" y1="65" x2="428" y2="65" stroke="#555" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="430" y="38" width="310" height="54" rx="7" fill="#F7F7F7" stroke="#BBB"/>
<text x="442" y="58" class="s">Options: Setting | Customize → 설정 사전</text>
<text x="442" y="78" class="s">Chapters: 한 줄 = 한 장 (제목·글·미디어·좌표·줌·레이어)</text>

<line x1="20" y1="110" x2="740" y2="110" stroke="#DDD"/>
<text x="20" y="134" class="b">② 그리기 — 한 줄이 글 블록 하나 + 마커 하나</text>

<!-- narrative column -->
<rect x="20" y="148" width="220" height="250" rx="6" fill="#FAFAFA" stroke="#BBB"/>
<rect x="34" y="162" width="192" height="60" rx="5" fill="#FFFFFF" stroke="#888"/>
<text x="46" y="182" class="w">1장</text>
<rect x="34" y="236" width="192" height="76" rx="5" fill="#FFF4D6" stroke="#B07D00" stroke-width="1.5"/>
<text x="46" y="256" class="w">2장 · in-focus</text>
<text x="46" y="274" class="s">사진·유튜브·오디오</text>
<text x="46" y="292" class="s">설명</text>
<rect x="34" y="326" width="192" height="60" rx="5" fill="#FFFFFF" stroke="#888"/>
<text x="46" y="346" class="w">3장</text>
<!-- scroll marker & boundaries -->
<line x1="250" y1="236" x2="268" y2="236" stroke="#555"/><text x="272" y="240" class="m">top[1]</text>
<line x1="250" y1="326" x2="268" y2="326" stroke="#555"/><text x="272" y="330" class="m">top[2]</text>
<rect x="246" y="286" width="8" height="40" fill="#FBE9E7" stroke="#B3261E" stroke-dasharray="2 2"/>
<text x="272" y="302" class="s r">140px 전부터</text>
<text x="272" y="316" class="s r">장 안 바뀜</text>
<text x="20" y="416" class="s">top[i] = 앞 블록 높이 + 70 누적 (처음 한 번 잰다)</text>

<!-- arrows -->
<line x1="350" y1="262" x2="430" y2="262" stroke="#B07D00" stroke-width="1.6" marker-end="url(#o)"/>
<text x="390" y="252" text-anchor="middle" class="s o">스크롤</text>
<line x1="430" y1="300" x2="350" y2="300" stroke="#555" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#a)"/>
<text x="390" y="318" text-anchor="middle" class="s">마커 클릭</text>
<text x="390" y="332" text-anchor="middle" class="s">→ top[i]+5 로</text>

<!-- map -->
<rect x="440" y="148" width="300" height="250" rx="6" fill="#EEF3F7" stroke="#88A"/>
<path d="M470 360 C 520 300, 560 330, 600 260 S 680 210, 720 190" fill="none" stroke="#9AB" stroke-width="2"/>
<circle cx="490" cy="340" r="9" fill="#3B6FB6"/><text x="490" y="344" text-anchor="middle" style="font-size:10px;fill:#fff">1</text>
<circle cx="610" cy="250" r="11" fill="#E8833A"/><text x="610" y="254" text-anchor="middle" style="font-size:10px;fill:#fff">2</text>
<circle cx="700" cy="200" r="9" fill="#3B6FB6"/><text x="700" y="204" text-anchor="middle" style="font-size:10px;fill:#fff">3</text>
<rect x="580" y="222" width="70" height="56" rx="4" fill="#B07D00" fill-opacity="0.12" stroke="#B07D00" stroke-dasharray="3 2"/>
<text x="452" y="170" class="s">지금 장이 바뀌면:</text>
<text x="452" y="188" class="m">#2 · 마커 강조 · 레이어 교체</text>
<text x="452" y="206" class="m">flyTo(좌표, 줌 ?? 15, 2초)</text>
</svg>
