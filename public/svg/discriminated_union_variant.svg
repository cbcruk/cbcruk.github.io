<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 240" width="100%" role="img">
<title>판별 유니온: variant 로 좁히고, 초과 속성도 그 멤버에 대고 본다</title>
<desc>ModalProps 는 variant 가 no-title 인 것과, variant 가 title 이면서 title 문자열이 있는 것의 유니온이다. if (variant === no-title) 바깥 분기에선 props 가 title 멤버로 좁혀져 props.title 을 쓸 수 있다. variant 없이 쓰면 막히고, no-title 에 title 을 붙여도 막힌다 — 초과 속성 검사가 variant 로 먼저 고른 멤버 하나에 대고 이뤄지기 때문이다. 판별 속성이 없는 유니온은 겹치는 조합을 받는다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:12px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.r{font-size:11.5px;fill:#B3261E}.g{font-size:11.5px;fill:#2E7D32}.x{font-size:12px;font-family:ui-monospace,Menlo,monospace;fill:#999;text-decoration:line-through}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#B3261E"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2E7D32"/></marker></defs>
<rect width="860" height="240" fill="#FFFFFF"/>
<rect x="30" y="30" width="370" height="70" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="215" y="59" text-anchor="middle" class="m">variant: 'no-title'</text>
<text x="215" y="79" text-anchor="middle" class="s">title 없음</text>
<rect x="460" y="30" width="370" height="70" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="645" y="69" text-anchor="middle" class="m">variant: 'title', title: string</text>
<rect x="30" y="130" width="370" height="90" rx="7" fill="#FCE8E6" stroke="#B3261E" stroke-width="1.5"/>
<text x="215" y="159" text-anchor="middle" class="m">&lt;Modal variant="no-title" title="Oh"/&gt;</text>
<text x="215" y="179" text-anchor="middle" class="r">no-title 멤버에 대고 초과 속성 → 막힌다</text>
<text x="215" y="199" text-anchor="middle" class="m">&lt;Modal /&gt;  ✗</text>
<rect x="460" y="130" width="370" height="90" rx="7" fill="#E3F1E4" stroke="#2E7D32" stroke-width="1.5"/>
<text x="645" y="159" text-anchor="middle" class="m">if (variant !== 'no-title')</text>
<text x="645" y="179" text-anchor="middle" class="m">  props.title  ✓</text>
<text x="645" y="199" text-anchor="middle" class="s">분기 안에서 좁혀진다</text>
</svg>
