<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 220" width="100%" role="img">
<title>children 으로 컴포넌트를 넘기고 JSX 로 렌더한다</title>
<desc>Page 가 Container 의 children 으로 요소가 아니라 Body 컴포넌트 자체를 넘긴다. Container 는 데이터(id = 1234)를 갖고 있다가 &lt;Child id={id} /&gt; 로 렌더한다 — 컨테이너는 데이터를, 프레젠테이션 Body 는 화면을 맡는다. 컴포넌트는 children({ id }) 처럼 함수로 부르지 않고 JSX 로만 쓴다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:12px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.r{font-size:11.5px;fill:#B3261E}.g{font-size:11.5px;fill:#2E7D32}.x{font-size:12px;font-family:ui-monospace,Menlo,monospace;fill:#999;text-decoration:line-through}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#B3261E"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2E7D32"/></marker></defs>
<rect width="860" height="220" fill="#FFFFFF"/>
<rect x="30" y="50" width="200" height="64" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="130" y="76" text-anchor="middle" class="b">Page</text>
<text x="130" y="96" text-anchor="middle" class="m">&lt;Container&gt;{Body}</text>
<path d="M230 82 H296" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<text x="263" y="42" text-anchor="middle" class="s">컴포넌트 자체</text>
<rect x="300" y="40" width="260" height="84" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="430" y="66" text-anchor="middle" class="b">Container</text>
<text x="430" y="86" text-anchor="middle" class="m">id = '1234'</text>
<text x="430" y="106" text-anchor="middle" class="m">&lt;Child id={id} /&gt;</text>
<path d="M560 82 H626" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<rect x="630" y="50" width="200" height="64" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="730" y="76" text-anchor="middle" class="b">Body</text>
<text x="730" y="96" text-anchor="middle" class="m">{id}</text>
<rect x="300" y="160" width="260" height="40" rx="7" fill="#FCE8E6" stroke="#B3261E" stroke-width="1.5"/>
<text x="430" y="184" text-anchor="middle" class="r">children({ id }) 로 부르지 않는다</text>
</svg>
