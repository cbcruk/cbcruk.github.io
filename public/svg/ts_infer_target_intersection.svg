<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="100%" role="img">
<title>target intersection — 모호하면 기록하지 않고, peel off 는 차집합이 아니다</title>
<desc>foo&lt;A, B&gt;(it: A &amp; B) 에 42 를 넘기면 어느 쪽에 줄지 모호해서 아무것도 기록하지 않고 A, B 모두 unknown. A &amp; 무언가 에서 A 를 떼어낼 때는 차집합이 아니라 포획 유용성을 최대화한다. A &amp; { x: number } 에 { x: number, y: number } 를 넘기면 차집합이라면 { y: number } 겠지만 실제로는 전체 객체가 A 가 된다. A &amp; number 에 number &amp; { brand: 'USD' }, A &amp; 'a' 에 'a' &amp; { brand: 1 } 을 넘기면 나머지인 { brand: ... } 가 A 가 된다. intersection 순서는 무관하다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:11.5px;font-family:ui-monospace,Menlo,monospace}.mb{font-size:12px;font-weight:600;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.o{font-size:12px;fill:#C2621A}.r{font-size:12px;fill:#B3261E}.g{font-size:12px;fill:#2E7D32}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#C2621A"/></marker></defs>
<rect width="860" height="330" fill="#FFFFFF"/>
<text x="20" y="24" class="b">모호하면 아무것도 기록하지 않는다</text>
<rect x="20" y="38" width="200" height="40" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="120.0" y="62" text-anchor="middle" class="m">foo&lt;A, B&gt;(it: A &amp; B)</text>
<rect x="260" y="38" width="120" height="40" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="320.0" y="62" text-anchor="middle" class="m">foo(42)</text>
<rect x="420" y="38" width="190" height="40" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="515.0" y="62" text-anchor="middle" class="s">A 냐 B 냐 — 모호</text>
<rect x="650" y="38" width="190" height="40" rx="7" fill="#FFFFFF" stroke="#B3261E" stroke-width="1.5"/>
<text x="745.0" y="62" text-anchor="middle" class="m">A = unknown, B = unknown</text>
<line x1="220" y1="58" x2="256" y2="58" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="380" y1="58" x2="416" y2="58" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="610" y1="58" x2="646" y2="58" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<text x="20" y="118" class="b">떼어내기는 차집합이 아니다</text>
<text x="20" y="144" class="s">target</text>
<text x="190" y="144" class="s">source</text>
<text x="390" y="144" class="s">차집합이라면</text>
<text x="560" y="144" class="s">실제 A</text>
<line x1="20" y1="150" x2="840" y2="150" stroke="#E2E2E2" stroke-width="1.2"/>
<text x="20" y="172" class="m">A &amp; { x: number }</text>
<text x="190" y="172" class="m">{ x: number, y: number }</text>
<text x="390" y="172" class="m">{ y: number }</text>
<text x="560" y="172" class="mb">{ x: number, y: number }</text>
<text x="760" y="172" class="o">← 다르다</text>
<line x1="20" y1="190" x2="840" y2="190" stroke="#E2E2E2" stroke-width="1.2"/>
<text x="20" y="212" class="m">A &amp; number</text>
<text x="190" y="212" class="m">number &amp; { brand: 'USD' }</text>
<text x="390" y="212" class="m">{ brand: 'USD' }</text>
<text x="560" y="212" class="mb">{ brand: 'USD' }</text>
<line x1="20" y1="230" x2="840" y2="230" stroke="#E2E2E2" stroke-width="1.2"/>
<text x="20" y="252" class="m">A &amp; 'a'</text>
<text x="190" y="252" class="m">'a' &amp; { brand: 1 }</text>
<text x="390" y="252" class="m">{ brand: 1 }</text>
<text x="560" y="252" class="mb">{ brand: 1 }</text>
<text x="20" y="290" class="o">객체와 섞이면 전체 객체를, 리터럴과 섞이면 정밀한 나머지를 남긴다</text>
<text x="20" y="312" class="s">intersection 순서는 source · target 모두 무관</text>
</svg>
