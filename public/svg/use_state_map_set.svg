<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 230" width="100%" role="img">
<title>useStateObject 처럼 Map·Set 도: 매번 복사본으로</title>
<desc>useStateObject 는 객체 상태에 set·setItem·merge·reset 을 붙인 useState 래퍼다. Map·Set 에도 같은 걸 하려면 주의할 점이 하나 있다. 같은 Map 을 고쳐서 넘기면 Object.is 로 이전과 같은 값이라 React 가 갱신을 무시한다. 그래서 업데이트마다 new Map(prev) 로 복사한 뒤 고쳐서 넘긴다 — set·delete·clear 가 모두 이 update 를 거친다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:12px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.r{font-size:11.5px;fill:#B3261E}.g{font-size:11.5px;fill:#2E7D32}.x{font-size:12px;font-family:ui-monospace,Menlo,monospace;fill:#999;text-decoration:line-through}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#B3261E"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2E7D32"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2F6DB5"/></marker></defs>
<rect width="860" height="230" fill="#FFFFFF"/>
<rect x="30" y="40" width="360" height="70" rx="7" fill="#FCE8E6" stroke="#B3261E" stroke-width="1.5"/>
<text x="210" y="69" text-anchor="middle" class="m">prev.set(k, v); setMap(prev)</text>
<text x="210" y="89" text-anchor="middle" class="r">Object.is(prev, prev) → 무시</text>
<rect x="450" y="40" width="380" height="70" rx="7" fill="#E3F1E4" stroke="#2E7D32" stroke-width="1.5"/>
<text x="640" y="69" text-anchor="middle" class="m">next = new Map(prev); next.set(k, v)</text>
<text x="640" y="89" text-anchor="middle" class="s">새 참조 → 다시 그린다</text>
<rect x="30" y="140" width="800" height="56" rx="7" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1.5"/>
<text x="430" y="162" text-anchor="middle" class="b">useStateObject&lt;T&gt;</text>
<text x="430" y="182" text-anchor="middle" class="m">T &amp; { set, setItem(key, value), merge(partial), reset() }</text>
</svg>
