<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" width="100%" role="img">
<title>점이 폴리곤 안인가: [경도, 위도], 고리는 첫 점으로 닫는다</title>
<desc>점이 폴리곤 안에 있는지 turf.booleanPointInPolygon 으로 본다. GeoJSON 좌표는 [경도, 위도] 순서다 — 위도부터 쓰면 다른 곳을 가리킨다. 폴리곤의 고리는 마지막 점이 첫 점과 같아야 닫힌다. 예: 사각형 네 꼭짓점 + 첫 점을 다시 넣은 다섯 점, 그 안의 [-73.978, 40.766] 은 true.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:12px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.r{font-size:11.5px;fill:#B3261E}.g{font-size:11.5px;fill:#2E7D32}.x{font-size:12px;font-family:ui-monospace,Menlo,monospace;fill:#999;text-decoration:line-through}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#B3261E"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2E7D32"/></marker></defs>
<rect width="860" height="260" fill="#FFFFFF"/>
<rect x="60" y="40" width="260" height="180" fill="#DCEBFA"/>
<rect x="60" y="40" width="260" height="180" fill="none" stroke="#2F6DB5" stroke-width="1.5"/>
<circle cx="60" cy="40" r="4" fill="#2F6DB5"/>
<circle cx="60" cy="220" r="4" fill="#2F6DB5"/>
<circle cx="320" cy="220" r="4" fill="#2F6DB5"/>
<circle cx="320" cy="40" r="4" fill="#2F6DB5"/>
<text x="66" y="34" text-anchor="start" class="m">①⑤ [-73.981, 40.768]</text>
<text x="66" y="240" text-anchor="start" class="m">② [-73.981, 40.764]</text>
<text x="320" y="240" text-anchor="end" class="m">③ [-73.975, 40.764]</text>
<text x="320" y="34" text-anchor="end" class="m">④</text>
<circle cx="110" cy="125" r="5" fill="#2E7D32"/>
<text x="120" y="129" text-anchor="start" class="g">[-73.978, 40.766] → true</text>
<rect x="390" y="40" width="440" height="60" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="610" y="64" text-anchor="middle" class="b">좌표 순서</text>
<text x="610" y="84" text-anchor="middle" class="m">[경도, 위도] — 위도부터 쓰면 다른 곳</text>
<rect x="390" y="120" width="440" height="60" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="610" y="144" text-anchor="middle" class="b">고리</text>
<text x="610" y="164" text-anchor="middle" class="m">마지막 점 = 첫 점 (⑤ = ①)</text>
<rect x="390" y="195" width="440" height="40" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="610" y="219" text-anchor="middle" class="m">turf.booleanPointInPolygon(point, polygon)</text>
</svg>
