<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="100%" role="img">
<title>스피너 깜빡임의 앞쪽과 뒤쪽</title>
<desc>요청 뒤 CSS 지연이 지나야 스피너가 뜬다. 앞쪽: 응답이 지연보다 먼저 오면 스피너는 한 프레임도 안 뜬다 — 지연이 통째로 건너뛰게 한다. 뒤쪽, CSS 만: 지연 뒤에 뜬 스피너가 곧바로 온 응답에 끊겨 짧게 번쩍하고 하드컷된다. 뒤쪽, useMinimumLoading: 응답이 와도 unmount 를 밀어 최소 노출 시간만큼은 보이게 한다. CSS 는 시작(지연)만 정하고, 끝은 응답 시각이 정하는데 CSS 는 그 값을 모른다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:12px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.o{font-size:12px;fill:#C2621A}.g{font-size:12px;fill:#2F6DB5}</style>
<rect width="860" height="300" fill="#FFFFFF"/>

<line x1="300" y1="44" x2="300" y2="250" stroke="#2F6DB5" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="300" y="36" text-anchor="middle" class="g">지연 (CSS)</text>

<text x="20" y="86" class="b">앞쪽</text>
<text x="20" y="103" class="s">응답 &lt; 지연</text>
<line x1="250" y1="72" x2="250" y2="108" stroke="#555" stroke-width="2"/>
<text x="244" y="118" text-anchor="end" class="s">응답</text>
<rect x="300" y="79" width="90" height="22" rx="4" fill="none" stroke="#B5B5B5" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="345" y="95" text-anchor="middle" class="s">안 뜬다</text>
<text x="404" y="95" class="g">지연이 스피너를 통째로 건너뛴다</text>

<text x="20" y="156" class="b">뒤쪽 · CSS 만</text>
<text x="20" y="173" class="s">지연 &lt; 응답</text>
<rect x="300" y="149" width="40" height="22" rx="4" fill="#FDEBD8" stroke="#C2621A" stroke-width="1.5"/>
<line x1="340" y1="142" x2="340" y2="178" stroke="#555" stroke-width="2"/>
<text x="346" y="188" class="s">응답</text>
<text x="360" y="165" class="o">떴다가 바로 하드컷 — 한 프레임 번쩍</text>

<text x="20" y="226" class="b">뒤쪽 · JS</text>
<text x="20" y="243" class="m">useMinimumLoading</text>
<rect x="300" y="219" width="40" height="22" rx="4" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<rect x="340" y="219" width="120" height="22" rx="4" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="340" y1="212" x2="340" y2="248" stroke="#555" stroke-width="2"/>
<text x="346" y="258" class="s">응답</text>
<line x1="460" y1="212" x2="460" y2="248" stroke="#2F6DB5" stroke-width="2"/>
<text x="466" y="258" class="g">unmount</text>
<text x="480" y="235" class="g">응답 뒤에도 밀어서 최소 노출 시간만큼 보인다</text>

<line x1="160" y1="270" x2="820" y2="270" stroke="#B5B5B5" stroke-width="1"/>
<text x="160" y="266" class="s">요청</text>
<text x="820" y="266" text-anchor="end" class="s">시간 →</text>

<text x="20" y="292" class="s">CSS 는 <tspan class="g">시작(지연)</tspan>만 정한다 · 끝은 <tspan class="o">응답 시각</tspan>이 정하고 CSS 는 그 값을 모른다</text>
</svg>
