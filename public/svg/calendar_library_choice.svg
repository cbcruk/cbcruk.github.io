<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 240" width="100%" role="img">
<title>캘린더 라이브러리: 상황으로 고른다</title>
<desc>완전히 커스텀한 UI 가 필요하면 react-aria(Adobe 의 headless, 로직과 접근성만)로 직접 만든다. 기본 기능을 빨리 원하면 react-big-calendar(구글 캘린더 스타일, 날짜 라이브러리 선택 가능). 모던한 DX 와 가벼움을 원하면 Schedule-X(드래그·리사이즈, 레퍼런스 적음). 타임라인·리소스 뷰 같은 엔터프라이즈 기능이 필요하면 FullCalendar(플러그인 구조, 일부 유료, 번들 큼). 날짜 선택만이면 react-day-picker·dayzed·react-datepicker, headless 로는 use-lilius·h6s.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:12px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.r{font-size:11.5px;fill:#B3261E}.g{font-size:11.5px;fill:#2E7D32}.x{font-size:12px;font-family:ui-monospace,Menlo,monospace;fill:#999;text-decoration:line-through}</style>
