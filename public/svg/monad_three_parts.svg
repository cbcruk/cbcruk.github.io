<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="100%" role="img">
<title>모나드 = 감싸는 타입 + unit + bind</title>
<desc>모나드는 세 부품이다. 값을 감싸는 타입(로그가 붙은 숫자), 값을 감싸는 함수 unit(로그가 빈 채로 감싼다), 감싼 값에 함수를 이어 붙이는 bind(결과는 새 값, 로그는 앞뒤를 이어 붙인다). Option·Promise 도 같은 모양이고 Promise 에선 then 이 bind 다. 다만 Promise 는 근사다 — then 이 붙은 객체(thenable)를 자동으로 펼쳐서, unit(x) 에 f 를 bind 한 것과 f(x) 가 달라진다(left identity 가 깨진다).</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:12px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.r{font-size:11.5px;fill:#B3261E}.g{font-size:11.5px;fill:#2E7D32}.x{font-size:12px;font-family:ui-monospace,Menlo,monospace;fill:#999;text-decoration:line-through}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#B3261E"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2E7D32"/></marker></defs>
<rect width="860" height="300" fill="#FFFFFF"/>
<rect x="30" y="30" width="240" height="70" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="150" y="59" text-anchor="middle" class="b">감싸는 타입</text>
<text x="150" y="79" text-anchor="middle" class="m">{ result: 2, logs: [] }</text>
<rect x="310" y="30" width="240" height="70" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="430" y="59" text-anchor="middle" class="b">unit</text>
<text x="430" y="79" text-anchor="middle" class="m">2 → { 2, [] }</text>
<rect x="590" y="30" width="240" height="70" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="710" y="59" text-anchor="middle" class="b">bind</text>
<text x="710" y="79" text-anchor="middle" class="m">결과는 f 의 것, 로그는 ++</text>
<rect x="30" y="130" width="520" height="60" rx="7" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1.5"/>
<text x="290" y="164" text-anchor="middle" class="m">{ 2, ["a"] }  bind  (n → { n*2, ["b"] })  =  { 4, ["a","b"] }</text>
<rect x="590" y="130" width="240" height="60" rx="7" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1.5"/>
<text x="710" y="154" text-anchor="middle" class="b">Promise 에선 then</text>
<text x="710" y="174" text-anchor="middle" class="s">Option 도 같은 모양</text>
<rect x="30" y="215" width="800" height="62" rx="7" fill="#FCE8E6" stroke="#B3261E" stroke-width="1.5"/>
<text x="430" y="240" text-anchor="middle" class="b">Promise 는 근사 — thenable 을 펼친다</text>
<text x="430" y="260" text-anchor="middle" class="m">unit(v).then(f) = [42]   ≠   f(v) = [v]      (v = { then: r =&gt; r(42) })</text>
</svg>
