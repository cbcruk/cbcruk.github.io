<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 180" width="100%" role="img">
<title>npm 스크립트 이름에서 단계 꺼내기</title>
<desc>npm 은 지금 실행 중인 스크립트 이름을 npm_lifecycle_event 환경 변수로 넘긴다. dev:hello 스크립트에서 ${npm_lifecycle_event#dev:} 로 접두사를 떼면 hello 가 남는다. 스크립트는 sh 로 돌기 때문에 bash 전용 ${var//a/b} 대신 POSIX ${var#prefix} 를 쓴다. 다만 이렇게 하기보다 스크립트를 따로 쓰는 편이 낫다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:12px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.r{font-size:11.5px;fill:#B3261E}.g{font-size:11.5px;fill:#2E7D32}.x{font-size:12px;font-family:ui-monospace,Menlo,monospace;fill:#999;text-decoration:line-through}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#B3261E"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2E7D32"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2F6DB5"/></marker></defs>
<rect width="860" height="180" fill="#FFFFFF"/>
<rect x="30" y="40" width="250" height="80" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="155" y="84" text-anchor="middle" class="m">npm run dev:hello</text>
<path d="M280 80 H326" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<text x="303" y="30" text-anchor="middle" class="s">npm_lifecycle_event</text>
<rect x="330" y="40" width="200" height="80" rx="7" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1.5"/>
<text x="430" y="84" text-anchor="middle" class="m">"dev:hello"</text>
<path d="M530 80 H576" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<text x="553" y="30" text-anchor="middle" class="s">${…#dev:}</text>
<rect x="580" y="40" width="250" height="80" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="705" y="74" text-anchor="middle" class="m">"hello"</text>
<text x="705" y="94" text-anchor="middle" class="s">sh 라서 POSIX # 만</text>
</svg>
