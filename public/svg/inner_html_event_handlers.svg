<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 200" width="100%" role="img">
<title>dangerouslySetInnerHTML: script 는 안 돌지만 onload 는 돈다</title>
<desc>dangerouslySetInnerHTML 은 DOM 노드의 innerHTML 을 덮어쓴다. innerHTML 로 넣은 script 요소는 실행되지 않지만, img 의 onload·onerror 같은 이벤트 핸들러 속성은 이미지가 로드되면 그대로 실행된다. 꼭 필요할 때 쓰는 우회이자, 사용자 입력을 넣으면 그대로 XSS 가 되는 이유다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:12px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.r{font-size:11.5px;fill:#B3261E}.g{font-size:11.5px;fill:#2E7D32}.x{font-size:12px;font-family:ui-monospace,Menlo,monospace;fill:#999;text-decoration:line-through}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#B3261E"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2E7D32"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2F6DB5"/></marker></defs>
<rect width="860" height="200" fill="#FFFFFF"/>
<rect x="30" y="40" width="250" height="110" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="155" y="79" text-anchor="middle" class="m">__html:</text>
<text x="155" y="99" text-anchor="middle" class="m">&lt;script&gt;…</text>
<text x="155" y="119" text-anchor="middle" class="m">&lt;img onload=…&gt;</text>
<path d="M280 70 H446" stroke="#B3261E" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
<text x="363" y="58" text-anchor="middle" class="s">&lt;script&gt;</text>
<rect x="450" y="40" width="380" height="45" rx="7" fill="#FCE8E6" stroke="#B3261E" stroke-width="1.5"/>
<text x="640" y="66" text-anchor="middle" class="s">실행되지 않는다</text>
<path d="M280 120 H446" stroke="#2E7D32" stroke-width="1.4" fill="none" marker-end="url(#ag)"/>
<text x="363" y="138" text-anchor="middle" class="s">onload · onerror</text>
<rect x="450" y="100" width="380" height="45" rx="7" fill="#E3F1E4" stroke="#2E7D32" stroke-width="1.5"/>
<text x="640" y="126" text-anchor="middle" class="s">로드되면 실행된다 — 입력을 넣으면 XSS</text>
</svg>
