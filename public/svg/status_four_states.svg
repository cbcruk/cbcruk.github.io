<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 180" width="100%" role="img">
<title>버튼 비활성화는 앱 로직이 아니다: 상태 넷</title>
<desc>isLoading·isError 같은 불리언을 따로 두면 동시에 참일 수 없는 조합이 생긴다. 상태를 idle(아직 아무 일도 없음)·loading(진행 중)·success(성공)·failure(오류) 중 하나로 두면, 버튼 비활성화 같은 UI 는 그 상태에서 나온다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:12px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.r{font-size:11.5px;fill:#B3261E}.g{font-size:11.5px;fill:#2E7D32}.x{font-size:12px;font-family:ui-monospace,Menlo,monospace;fill:#999;text-decoration:line-through}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#B3261E"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2E7D32"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2F6DB5"/></marker></defs>
<rect width="860" height="180" fill="#FFFFFF"/>
<rect x="30" y="40" width="185" height="80" rx="7" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1.5"/>
<text x="122" y="74" text-anchor="middle" class="b">idle</text>
<text x="122" y="94" text-anchor="middle" class="s">아직 아무 일도</text>
<rect x="232" y="40" width="185" height="80" rx="7" fill="#FFF4DE" stroke="#B7791F" stroke-width="1.5"/>
<text x="324" y="74" text-anchor="middle" class="b">loading</text>
<text x="324" y="94" text-anchor="middle" class="s">진행 중</text>
<rect x="434" y="40" width="185" height="80" rx="7" fill="#E3F1E4" stroke="#2E7D32" stroke-width="1.5"/>
<text x="526" y="74" text-anchor="middle" class="b">success</text>
<text x="526" y="94" text-anchor="middle" class="s">성공</text>
<rect x="636" y="40" width="185" height="80" rx="7" fill="#FCE8E6" stroke="#B3261E" stroke-width="1.5"/>
<text x="728" y="74" text-anchor="middle" class="b">failure</text>
<text x="728" y="94" text-anchor="middle" class="s">오류</text>
<text x="30" y="160" text-anchor="start" class="m">disabled = state == loading — 불리언이 아니라 상태에서 나온다</text>
</svg>
