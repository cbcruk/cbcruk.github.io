<rect x="735" y="30" width="8" height="24" fill="#8A8A8A"/>
<text x="30" y="105" text-anchor="start" class="b">throttle</text>
<rect x="130" y="90" width="8" height="24" fill="#2F6DB5"/>
<rect x="295" y="90" width="8" height="24" fill="#2F6DB5"/>
<rect x="625" y="90" width="8" height="24" fill="#2F6DB5"/>
<text x="30" y="165" text-anchor="start" class="b">debounce</text>
<rect x="505" y="150" width="8" height="24" fill="#2E7D32"/>
<rect x="835" y="150" width="8" height="24" fill="#2E7D32"/>
<text x="130" y="205" text-anchor="start" class="s">throttle = 간격마다 많아야 한 번 · debounce = 멈추고 나서 마지막 한 번</text>
</svg>
