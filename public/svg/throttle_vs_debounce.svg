<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 220" width="100%" role="img">
<title>throttle 과 debounce: 이벤트 줄기를 어떻게 줄이나</title>
<desc>같은 이벤트가 연달아 들어올 때, throttle 은 정해진 간격마다 많아야 한 번만 실행해 속도를 제한한다 — 스크롤 위치를 계속 따라갈 때. debounce 는 호출이 멈추고 정해진 시간이 지나야 마지막 것 한 번만 실행한다 — 검색 입력이 끝났을 때나 창 크기 조정이 끝났을 때.</desc>
