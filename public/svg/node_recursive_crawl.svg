<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 350" width="100%" role="img">
<title>crawl: 대기열에서 하나 꺼내 처음 보면 표시하고 링크를 뒤에 붙인다, 대기열이 비면 끝</title>
<desc>상태는 본 집합 seen 과 대기열 q 둘뿐이다. q 에서 u 를 하나 꺼내, 이미 본 것이면 버리고, 처음 보면 seen 에 넣고 u 의 링크를 q 뒤에 붙인다. q 가 비면 seen 을 돌려주고 끝난다. 예: A 는 B·C 를, B·C 는 다시 A 를 가리켜도 A 는 두 번 버려지고, 결과는 A·B·C 세 개다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:12px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.g{font-size:12px;fill:#999}.ok{font-size:12px;fill:#2E7D32}</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2E7D32"/></marker>
</defs>
<rect width="860" height="350" fill="#FFFFFF"/>

<!-- 상태 -->
<rect x="40" y="30" width="370" height="60" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="225" y="55" text-anchor="middle" class="m">go seen (u : q)</text>
<text x="225" y="76" text-anchor="middle" class="s">대기열 앞에서 u 를 하나 꺼낸다</text>

<!-- 갈래 -->
<rect x="40" y="140" width="170" height="74" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="125" y="163" text-anchor="middle" class="b">u ∈ seen</text>
<text x="125" y="184" text-anchor="middle" class="m">go seen q</text>
<text x="125" y="203" text-anchor="middle" class="s">이미 봤다 — 버린다</text>

<rect x="240" y="140" width="170" height="74" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="325" y="163" text-anchor="middle" class="b">u ∉ seen</text>
<text x="325" y="184" text-anchor="middle" class="m">insert u seen</text>
<text x="325" y="203" text-anchor="middle" class="m">q ++ links u</text>

<path d="M125 90 V136" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<path d="M325 90 V136" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<!-- 되돌아가기 -->
<path d="M40 177 H22 V60 H36" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<path d="M410 177 H428 V60 H414" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#a)"/>

<!-- 끝 -->
<path d="M225 90 V262" stroke="#2E7D32" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#ag)"/>
<text x="233" y="243" class="ok">q 가 비면</text>
<rect x="40" y="266" width="370" height="60" rx="7" fill="#E3F1E4" stroke="#2E7D32" stroke-width="1.5"/>
<text x="225" y="291" text-anchor="middle" class="m">go seen [] = seen</text>
<text x="225" y="312" text-anchor="middle" class="s">더 꺼낼 게 없다 — 끝 (onIdle)</text>

<!-- 예시 -->
<line x1="460" y1="30" x2="460" y2="326" stroke="#E0E0E0"/>
<text x="490" y="50" class="b">예: A → B, C · B → A · C → A</text>
<text x="490" y="84" class="s">꺼낸 u</text>
<text x="570" y="84" class="s">seen</text>
<text x="700" y="84" class="s">q</text>
<line x1="490" y1="94" x2="830" y2="94" stroke="#E0E0E0"/>

<text x="490" y="116" class="g">—</text><text x="570" y="116" class="m">∅</text><text x="700" y="116" class="m">[A]</text>
<text x="490" y="142" class="m">A</text><text x="570" y="142" class="m">{A}</text><text x="700" y="142" class="m">[B, C]</text>
<text x="490" y="168" class="m">B</text><text x="570" y="168" class="m">{A, B}</text><text x="700" y="168" class="m">[C, A]</text>
<text x="490" y="194" class="m">C</text><text x="570" y="194" class="m">{A, B, C}</text><text x="700" y="194" class="m">[A, A]</text>
<text x="490" y="220" class="g">A 버림</text><text x="570" y="220" class="g">{A, B, C}</text><text x="700" y="220" class="g">[A]</text>
<text x="490" y="246" class="g">A 버림</text><text x="570" y="246" class="g">{A, B, C}</text><text x="700" y="246" class="g">[]</text>
<line x1="490" y1="260" x2="830" y2="260" stroke="#E0E0E0"/>
<text x="490" y="284" class="ok">결과 {A, B, C}</text>
<text x="490" y="306" class="s">서로 가리켜도 끝나고, 크기 3 = 고유 URL 수</text>
</svg>
