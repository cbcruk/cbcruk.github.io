<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="100%" role="img">
<title>Node 재귀 크롤: enqueue → 큐 → visit → 다시 enqueue</title>
<desc>enqueue 는 seen.has → seen.add → queue.add 를 await 없이 한 턴에 끝내므로 락이 필요 없다. 큐는 대기열(무제한)과 실행 중(동시성 상한)으로 나뉜다. visit 은 GET 으로 본문을 받아 링크를 뽑고, 새 링크를 태스크가 끝나기 전에 enqueue 로 돌려보낸다. onIdle 은 대기열과 실행 중이 둘 다 0 일 때 resolve 된다. 자식을 .then·setTimeout 으로 태스크 밖에서 넣으면 부모가 먼저 끝나 둘 다 0 이 되고 onIdle 이 일이 남았는데 resolve 된다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:12px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.o{font-size:12px;fill:#C2621A}.r{font-size:12px;fill:#B3261E}</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#C2621A"/></marker>
</defs>
<rect width="860" height="330" fill="#FFFFFF"/>

<rect x="30" y="30" width="240" height="96" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="150" y="54" text-anchor="middle" class="b">enqueue(url)</text>
<text x="150" y="78" text-anchor="middle" class="m">has → add → queue.add</text>
<text x="150" y="100" text-anchor="middle" class="s">await 없음 = 끼어들 틈 없음</text>
<text x="150" y="116" text-anchor="middle" class="s">요청보다 먼저 표시 · 락 불필요</text>

<rect x="320" y="30" width="220" height="96" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="430" y="54" text-anchor="middle" class="b">PQueue</text>
<text x="430" y="80" text-anchor="middle" class="s">대기열 — 무제한, add 는 안 막힘</text>
<text x="430" y="104" text-anchor="middle" class="s">실행 중 — concurrency 상한</text>

<rect x="590" y="30" width="240" height="96" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="710" y="54" text-anchor="middle" class="b">visit(url)</text>
<text x="710" y="80" text-anchor="middle" class="m">fetch (GET) → text</text>
<text x="710" y="104" text-anchor="middle" class="m">extractLinks</text>

<line x1="270" y1="78" x2="316" y2="78" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="540" y1="78" x2="586" y2="78" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>

<path d="M710 126 L710 166 L150 166 L150 130" fill="none" stroke="#C2621A" stroke-width="1.5" marker-end="url(#ao)"/>
<text x="444" y="186" class="o">새 링크 — 태스크가 끝나기 전에 enqueue</text>

<line x1="430" y1="126" x2="430" y2="206" stroke="#8A8A8A" stroke-width="1.5" stroke-dasharray="3 3"/>
<rect x="290" y="206" width="280" height="50" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="430" y="227" text-anchor="middle" class="m">await queue.onIdle()</text>
<text x="430" y="246" text-anchor="middle" class="s">대기열 0 · 실행 중 0 → resolve</text>

<text x="30" y="290" class="r">✗ 자식을 .then · setTimeout 으로 넣으면</text>
<text x="30" y="310" class="s">부모 태스크 끝 → 대기열 0 · 실행 중 0 → onIdle resolve → 자식 도착 (이미 "끝났다")</text>
</svg>
