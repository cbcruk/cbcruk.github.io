<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 220" width="100%" role="img">
<title>중복 값 강조: 첫 행 기준 맞춤 수식을 범위 전체에 미끄러뜨린다</title>
<desc>구글 스프레드시트에서 A열의 중복 값에 서식을 주려면 서식 → 조건부 서식 → 맞춤 수식에 =COUNTIF(A:A, A1)&gt;1 을 넣는다. 수식은 범위의 첫 행(A1) 기준으로 쓰고, 시트가 행마다 A1 을 A2, A3 … 으로 옮겨 가며 평가한다. 그 값이 A열에 두 번 이상 나오면 참이라 칠해진다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:12px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.r{font-size:11.5px;fill:#B3261E}.g{font-size:11.5px;fill:#2E7D32}.x{font-size:12px;font-family:ui-monospace,Menlo,monospace;fill:#999;text-decoration:line-through}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#B3261E"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2E7D32"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2F6DB5"/></marker></defs>
<rect width="860" height="220" fill="#FFFFFF"/>
<rect x="30" y="20" width="140" height="30" rx="7" fill="#FFF4DE" stroke="#B7791F" stroke-width="1.5"/>
<text x="100" y="39" text-anchor="middle" class="m">사과</text>
<text x="190" y="40" text-anchor="start" class="m">COUNTIF(A:A, A1) = 2</text>
<rect x="30" y="56" width="140" height="30" rx="7" fill="#FFF4DE" stroke="#B7791F" stroke-width="1.5"/>
<text x="100" y="75" text-anchor="middle" class="m">배</text>
<text x="190" y="76" text-anchor="start" class="m">COUNTIF(A:A, A2) = 2</text>
<rect x="30" y="92" width="140" height="30" rx="7" fill="#FFF4DE" stroke="#B7791F" stroke-width="1.5"/>
<text x="100" y="111" text-anchor="middle" class="m">사과</text>
<text x="190" y="112" text-anchor="start" class="m">COUNTIF(A:A, A3) = 2</text>
<rect x="30" y="128" width="140" height="30" rx="7" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1.5"/>
<text x="100" y="147" text-anchor="middle" class="m">감</text>
<text x="190" y="148" text-anchor="start" class="m">COUNTIF(A:A, A4) = 1</text>
<rect x="30" y="164" width="140" height="30" rx="7" fill="#FFF4DE" stroke="#B7791F" stroke-width="1.5"/>
<text x="100" y="183" text-anchor="middle" class="m">배</text>
<text x="190" y="184" text-anchor="start" class="m">COUNTIF(A:A, A5) = 2</text>
<rect x="470" y="60" width="360" height="80" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="650" y="84" text-anchor="middle" class="b">맞춤 수식</text>
<text x="650" y="104" text-anchor="middle" class="m">=COUNTIF(A:A, A1)&gt;1</text>
<text x="650" y="124" text-anchor="middle" class="s">첫 행 기준 — 행마다 A1 이 미끄러진다</text>
</svg>
