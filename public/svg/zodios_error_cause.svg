<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 190" width="100%" role="img">
<title>zodios 의 검증 실패: ZodError 는 cause 안에 있다</title>
<desc>zodios 는 응답 검증이 실패하면 ZodError 를 그대로 던지지 않고 ZodiosError 의 cause 에 담아 던진다. 그래서 instanceof z.ZodError 로는 잡히지 않고, ZodiosError 인지 본 뒤 cause 가 ZodError 인지 확인해 fromZodError 로 읽는다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:12px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.r{font-size:11.5px;fill:#B3261E}.g{font-size:11.5px;fill:#2E7D32}.x{font-size:12px;font-family:ui-monospace,Menlo,monospace;fill:#999;text-decoration:line-through}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#B3261E"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2E7D32"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2F6DB5"/></marker></defs>
<rect width="860" height="190" fill="#FFFFFF"/>
<rect x="30" y="40" width="330" height="110" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="195" y="79" text-anchor="middle" class="b">ZodiosError</text>
<text x="195" y="99" text-anchor="middle" class="m">config · data</text>
<text x="195" y="119" text-anchor="middle" class="s">cause ↓</text>
<rect x="80" y="105" width="230" height="36" rx="7" fill="#FCE8E6" stroke="#B3261E" stroke-width="1.5"/>
<text x="195" y="127" text-anchor="middle" class="m">ZodError</text>
<path d="M360 95 H426" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<rect x="430" y="40" width="400" height="110" rx="7" fill="#E3F1E4" stroke="#2E7D32" stroke-width="1.5"/>
<text x="630" y="79" text-anchor="middle" class="m">err instanceof ZodiosError</text>
<text x="630" y="99" text-anchor="middle" class="m">&amp;&amp; err.cause instanceof ZodError</text>
<text x="630" y="119" text-anchor="middle" class="s">err instanceof ZodError 는 false</text>
</svg>
