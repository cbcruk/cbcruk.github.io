<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 250" width="100%" role="img">
<title>createStore: dispatch = reducer 로 갈아 끼우고 알린다</title>
<desc>Redux 스타일 store 는 상태 하나와 리스너 목록 하나다. dispatch(action) 은 reducer(지금 상태, action) 으로 새 상태를 만들어 갈아 끼우고, 리스너 전부에게 새 상태를 알린 뒤 action 을 돌려준다. subscribe 는 리스너를 곧바로 지금 상태로 한 번 부르고 목록에 넣으며, 목록에서 빼는 함수를 돌려준다. getState 는 지금 상태를 읽는다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:12px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.r{font-size:11.5px;fill:#B3261E}.g{font-size:11.5px;fill:#2E7D32}.x{font-size:12px;font-family:ui-monospace,Menlo,monospace;fill:#999;text-decoration:line-through}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#B3261E"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2E7D32"/></marker></defs>
<rect width="860" height="250" fill="#FFFFFF"/>
<rect x="30" y="40" width="180" height="60" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="120" y="64" text-anchor="middle" class="b">dispatch</text>
<text x="120" y="84" text-anchor="middle" class="m">action</text>
<path d="M210 70 H276" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<rect x="280" y="40" width="240" height="60" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="400" y="64" text-anchor="middle" class="b">reducer</text>
<text x="400" y="84" text-anchor="middle" class="m">state, action → state'</text>
<path d="M520 70 H586" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<rect x="590" y="40" width="240" height="60" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="710" y="64" text-anchor="middle" class="b">state := state'</text>
<text x="710" y="84" text-anchor="middle" class="s">리스너 전부에게 알린다</text>
<rect x="30" y="150" width="380" height="64" rx="7" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1.5"/>
<text x="220" y="176" text-anchor="middle" class="b">subscribe(l)</text>
<text x="220" y="196" text-anchor="middle" class="s">l(지금 상태) 한 번 → 목록에 넣고 빼는 함수를 돌려준다</text>
<rect x="450" y="150" width="380" height="64" rx="7" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1.5"/>
<text x="640" y="176" text-anchor="middle" class="b">getState()</text>
<text x="640" y="196" text-anchor="middle" class="s">지금 상태를 읽는다</text>
</svg>
