<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 220" width="100%" role="img">
<title>이모지 unified 코드를 문자로: - 로 나누고 fromCodePoint</title>
<desc>이모지 데이터의 unified 값은 1F468-200D-1F469 처럼 16진수 코드 포인트를 - 로 이은 것이다. - 로 나눠 각각 16진수 정수로 바꾸고 String.fromCodePoint 로 문자를 만든 뒤 이어 붙인다. 0xFFFF 를 넘는 코드 포인트(1F468 등)는 서로게이트 쌍이 필요해서 fromCharCode 로는 안 되고 fromCodePoint 라야 한다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:12px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.r{font-size:11.5px;fill:#B3261E}.g{font-size:11.5px;fill:#2E7D32}.x{font-size:12px;font-family:ui-monospace,Menlo,monospace;fill:#999;text-decoration:line-through}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#B3261E"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2E7D32"/></marker></defs>
<rect width="860" height="220" fill="#FFFFFF"/>
<rect x="30" y="50" width="200" height="60" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="130" y="84" text-anchor="middle" class="m">"1F468-200D-1F469"</text>
<path d="M230 80 H286" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<text x="258" y="42" text-anchor="middle" class="s">split -</text>
<rect x="290" y="40" width="250" height="80" rx="7" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1.5"/>
<text x="415" y="74" text-anchor="middle" class="m">0x1F468  0x200D  0x1F469</text>
<text x="415" y="94" text-anchor="middle" class="s">parseInt(hex, 16)</text>
<path d="M540 80 H596" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<text x="568" y="32" text-anchor="middle" class="s">fromCodePoint</text>
<rect x="600" y="50" width="230" height="60" rx="7" fill="#E3F1E4" stroke="#2E7D32" stroke-width="1.5"/>
<text x="715" y="74" text-anchor="middle" class="m">👨‍👩</text>
<text x="715" y="94" text-anchor="middle" class="s">join</text>
<rect x="290" y="150" width="250" height="44" rx="7" fill="#FCE8E6" stroke="#B3261E" stroke-width="1.5"/>
<text x="415" y="176" text-anchor="middle" class="r">fromCharCode 는 0xFFFF 까지만</text>
</svg>
