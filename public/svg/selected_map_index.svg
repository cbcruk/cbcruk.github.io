<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 240" width="100%" role="img">
<title>selected 조회: 매번 find 대신 Map 한 번</title>
<desc>selected 의 키마다 items 를 처음부터 훑으면 n × m 번이다. items 를 키로 한 번 Map 에 넣어 두면(n) 키마다 바로 꺼내(m) n + m 번이 된다 — Map 조회는 명세상 원소 수에 대해 선형보다 빠르다. React 에선 렌더 뒤 effect 에서 한 번에 만들고 ready 로 알린다. 10만 개가 넘으면 Web Worker 를 고려한다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:12px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.r{font-size:11.5px;fill:#B3261E}.g{font-size:11.5px;fill:#2E7D32}.x{font-size:12px;font-family:ui-monospace,Menlo,monospace;fill:#999;text-decoration:line-through}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#B3261E"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2E7D32"/></marker></defs>
<rect width="860" height="240" fill="#FFFFFF"/>
<rect x="30" y="40" width="380" height="80" rx="7" fill="#FCE8E6" stroke="#B3261E" stroke-width="1.5"/>
<text x="220" y="64" text-anchor="middle" class="b">매번 find</text>
<text x="220" y="84" text-anchor="middle" class="m">selected.map(k → items.find(…))</text>
<text x="220" y="104" text-anchor="middle" class="r">O(n × m)</text>
<rect x="450" y="40" width="380" height="80" rx="7" fill="#E3F1E4" stroke="#2E7D32" stroke-width="1.5"/>
<text x="640" y="64" text-anchor="middle" class="b">Map 한 번</text>
<text x="640" y="84" text-anchor="middle" class="m">new Map(items.map(i → [i.key, i]))</text>
<text x="640" y="104" text-anchor="middle" class="m">selected.map(k → map.get(k))  O(n + m)</text>
<rect x="30" y="155" width="800" height="56" rx="7" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1.5"/>
<text x="430" y="187" text-anchor="middle" class="s">React: 렌더 뒤 effect 에서 한 번에 만들고 ready 로 알린다 · 10만 개가 넘으면 Web Worker</text>
</svg>
