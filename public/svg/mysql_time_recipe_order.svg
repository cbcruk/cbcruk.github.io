<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="100%" role="img">
<title>TIME 폭 장애를 고치는 순서</title>
<desc>1 원인 행 찾기 → 2 값 감사 → 4 정규화 결정 → 데이터 핫픽스 → 5 TypeHandler → 6 쓰기 제약 순으로 백엔드를 고친다. 4 를 고르기 전에 3 정의역 확인을 본다. 5 → 6 은 읽기가 먼저다 — 쓰기부터 막으면 이미 들어 있는 행 때문에 여전히 500 이다. 7 결핍 상태 분리 렌더는 프론트에서 백엔드와 별개로 지금 바로 할 수 있다. 8 타입 폭 감사 → 스키마 재설계 검토는 예방이다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:12px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.o{font-size:12px;fill:#C2621A}</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker>
</defs>
<rect width="860" height="300" fill="#FFFFFF"/>

<text x="20" y="130" class="b">백엔드</text>
<text x="20" y="206" class="b">프론트</text>
<text x="20" y="266" class="b">예방</text>

<circle cx="160" cy="44" r="5" fill="#555"/>
<line x1="160" y1="49" x2="160" y2="104" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<text x="170" y="72" class="s">장애 중</text>

<rect x="350" y="30" width="100" height="44" rx="7" fill="none" stroke="#8A8A8A" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="400" y="49" text-anchor="middle" class="b">3</text>
<text x="400" y="65" text-anchor="middle" class="s">정의역 확인</text>
<line x1="400" y1="74" x2="400" y2="104" stroke="#8A8A8A" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>

<rect x="110" y="108" width="100" height="44" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="160" y="127" text-anchor="middle" class="b">1</text>
<text x="160" y="143" text-anchor="middle" class="s">원인 행 찾기</text>
<rect x="230" y="108" width="100" height="44" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="280" y="127" text-anchor="middle" class="b">2</text>
<text x="280" y="143" text-anchor="middle" class="s">값 감사</text>
<rect x="350" y="108" width="100" height="44" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="400" y="127" text-anchor="middle" class="b">4</text>
<text x="400" y="143" text-anchor="middle" class="s">정규화 결정</text>
<rect x="470" y="108" width="100" height="44" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="520" y="127" text-anchor="middle" class="b">핫픽스</text>
<text x="520" y="143" text-anchor="middle" class="s">데이터 UPDATE</text>
<rect x="590" y="108" width="100" height="44" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="640" y="127" text-anchor="middle" class="b">5</text>
<text x="640" y="143" text-anchor="middle" class="s">TypeHandler</text>
<rect x="730" y="108" width="100" height="44" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="780" y="127" text-anchor="middle" class="b">6</text>
<text x="780" y="143" text-anchor="middle" class="s">쓰기 제약</text>

<line x1="210" y1="130" x2="226" y2="130" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="330" y1="130" x2="346" y2="130" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="450" y1="130" x2="466" y2="130" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="570" y1="130" x2="586" y2="130" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="690" y1="130" x2="726" y2="130" stroke="#C2621A" stroke-width="1.5" marker-end="url(#a)"/>
<text x="710" y="100" text-anchor="middle" class="o">읽기가 먼저</text>
<text x="780" y="170" text-anchor="middle" class="o">먼저 막으면 기존 행이 500</text>

<rect x="110" y="184" width="170" height="44" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="195" y="203" text-anchor="middle" class="b">7</text>
<text x="195" y="219" text-anchor="middle" class="s">결핍 상태 분리 렌더</text>
<text x="296" y="211" class="s">백엔드와 별개 · 지금 바로</text>

<rect x="110" y="244" width="100" height="44" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="160" y="263" text-anchor="middle" class="b">8</text>
<text x="160" y="279" text-anchor="middle" class="s">타입 폭 감사</text>
<rect x="230" y="244" width="160" height="44" rx="7" fill="none" stroke="#8A8A8A" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="310" y="271" text-anchor="middle" class="s">스키마 재설계 검토</text>
<line x1="210" y1="266" x2="226" y2="266" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
</svg>
