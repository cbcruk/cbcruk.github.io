<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 190" width="100%" role="img">
<title>cannot be used as a JSX component: @types/react 가 둘이다</title>
<desc>컴포넌트를 JSX 로 쓸 때 cannot be used as a JSX component 가 나면 대개 @types/react·@types/react-dom 참조가 어긋난 것이다. 의존성 트리에 서로 다른 버전의 @types/react 가 두 벌 깔리면 컴포넌트가 돌려주는 ReactElement 와 JSX 가 기대하는 타입이 서로 다른 선언이 되어 맞지 않는다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:12px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.r{font-size:11.5px;fill:#B3261E}.g{font-size:11.5px;fill:#2E7D32}.x{font-size:12px;font-family:ui-monospace,Menlo,monospace;fill:#999;text-decoration:line-through}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#B3261E"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2E7D32"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2F6DB5"/></marker></defs>
<rect width="860" height="190" fill="#FFFFFF"/>
<rect x="30" y="40" width="250" height="100" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="155" y="74" text-anchor="middle" class="b">내 컴포넌트</text>
<text x="155" y="94" text-anchor="middle" class="m">@types/react 한 벌</text>
<text x="155" y="114" text-anchor="middle" class="s">ReactElement (A)</text>
<rect x="320" y="40" width="250" height="100" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="445" y="74" text-anchor="middle" class="b">라이브러리</text>
<text x="445" y="94" text-anchor="middle" class="m">@types/react 또 한 벌</text>
<text x="445" y="114" text-anchor="middle" class="s">ReactElement (B)</text>
<path d="M570 90 H616" stroke="#B3261E" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
<rect x="620" y="40" width="210" height="100" rx="7" fill="#FCE8E6" stroke="#B3261E" stroke-width="1.5"/>
<text x="725" y="74" text-anchor="middle" class="s">A ≠ B</text>
<text x="725" y="94" text-anchor="middle" class="m">cannot be used as</text>
<text x="725" y="114" text-anchor="middle" class="m">a JSX component</text>
</svg>
