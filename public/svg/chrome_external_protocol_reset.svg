<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" width="100%" role="img">
<title>Chrome 외부 앱 "항상 열기" 허용을 되돌리는 순서</title>
<desc>"항상 열기"를 체크하면 허용이 origin 단위로 저장된다. chrome://settings/handlers 는 웹 프로토콜 핸들러(mailto: 등)만 다루는 별개 화면이라 여기서는 못 푼다. ① chrome://settings/content/all 에서 사이트 데이터를 삭제한다 → 재시작해 다이얼로그가 다시 뜨면 해제된 것이다. 안 뜨면 ② Chrome 을 백그라운드까지 완전 종료하고 → Preferences 에서 그 origin 의 스킴 항목을 지운 뒤 → 재시작해 다시 확인한다. ② 를 건너뛰고 실행 중에 편집하면 종료 시 메모리 상태로 덮어써 되돌아간다. excluded_schemes 에 true 인 스킴은 반대로 차단 상태이고, 같은 파일에서 푼다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:12px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.o{font-size:12px;fill:#C2621A}</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#C2621A"/></marker>
</defs>
<rect width="860" height="320" fill="#FFFFFF"/>

<rect x="200" y="20" width="270" height="50" rx="7" fill="none" stroke="#C2621A" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="335" y="41" text-anchor="middle" class="m">chrome://settings/handlers</text>
<text x="335" y="60" text-anchor="middle" class="o">✕ 웹 핸들러(mailto: 등)만 · 별개</text>
<path d="M95 100 L95 45 L196 45" fill="none" stroke="#C2621A" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ao)"/>

<rect x="20" y="100" width="150" height="56" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="95" y="123" text-anchor="middle" class="b">항상 열기 체크됨</text>
<text x="95" y="142" text-anchor="middle" class="s">origin 단위로 저장</text>

<rect x="200" y="100" width="180" height="56" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="290" y="123" text-anchor="middle" class="b">① 사이트 데이터 삭제</text>
<text x="290" y="142" text-anchor="middle" class="m">settings/content/all</text>

<rect x="420" y="100" width="180" height="56" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="510" y="123" text-anchor="middle" class="b">재시작</text>
<text x="510" y="142" text-anchor="middle" class="s">다이얼로그가 다시 뜨나?</text>

<rect x="700" y="100" width="140" height="56" rx="7" fill="#2F6DB5" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="770" y="133" text-anchor="middle" class="b" style="fill:#FFFFFF">해제됨</text>

<rect x="420" y="210" width="180" height="56" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="510" y="233" text-anchor="middle" class="b">② Chrome 완전 종료</text>
<text x="510" y="252" text-anchor="middle" class="s">백그라운드 포함</text>

<rect x="640" y="210" width="200" height="56" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="740" y="233" text-anchor="middle" class="b">Preferences 편집</text>
<text x="740" y="252" text-anchor="middle" class="s">origin 의 스킴 항목 삭제</text>

<rect x="160" y="210" width="220" height="56" rx="7" fill="none" stroke="#C2621A" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="270" y="233" text-anchor="middle" class="o">✕ 실행 중에 편집</text>
<text x="270" y="252" text-anchor="middle" class="o">종료 시 덮어써 되돌아감</text>
<line x1="416" y1="238" x2="384" y2="238" stroke="#C2621A" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="400" y="204" text-anchor="middle" class="o">건너뛰면</text>

<line x1="170" y1="128" x2="196" y2="128" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="380" y1="128" x2="416" y2="128" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="600" y1="128" x2="696" y2="128" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<text x="648" y="120" text-anchor="middle" class="s">예</text>
<line x1="490" y1="156" x2="490" y2="206" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<text x="480" y="186" text-anchor="end" class="s">아니오</text>
<line x1="600" y1="238" x2="636" y2="238" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M740 210 L740 184 L560 184 L560 160" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<text x="650" y="178" text-anchor="middle" class="s">재시작</text>

<text x="20" y="302" class="s">같은 파일의 <tspan class="m">excluded_schemes</tspan> 에 <tspan class="m">true</tspan> 인 스킴은 반대로 차단 상태 — 차단을 풀 때도 여기서 푼다</text>
</svg>
