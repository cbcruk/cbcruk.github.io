<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="100%" role="img">
<title>vw 가 px 로 바뀌는 순서</title>
<desc>1vw 는 창 폭의 1% 다. 600px 창이면 1vw 가 6px 이라 8.333vw 는 50px 이고, 여기에 y절편 -0.875rem(-14px) 를 더하면 36px, 곧 2.25rem 이다. clamp 는 이 값을 16px 과 56px 사이로 자른다. 창 폭만 바꿔 보면 vw 몫은 창에 비례해 늘지만(360px 창 30px, 600px 50px, 840px 70px, 1200px 100px) -14px 는 어느 창에서나 같다. 그래서 결과는 16px, 36px, 56px, 86px 이 되고, 1200px 창의 86px 은 max 56px 에서 잘린다. vw 만 쓰면 원점을 지나는 비례선이라 기울기와 시작점을 따로 정할 수 없는데, 고정 rem 을 더해 그 선을 평행이동하는 것이다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{white-space:pre;font-size:12px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.o{font-size:12px;fill:#C2621A}.g{font-size:12px;fill:#2F6DB5}.x{font-size:10.5px;fill:#8A8A8A}</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#8A8A8A"/></marker>
</defs>
<rect width="860" height="430" fill="#FFFFFF"/>

<text x="30" y="28" class="s">600px 창에서 font-size 가 정해지는 순서</text>

<rect x="30" y="42" width="140" height="56" rx="6" fill="#F7F7F7" stroke="#BDBDBD"/>
<text x="100" y="64" text-anchor="middle" class="s">창 폭</text>
<text x="100" y="86" text-anchor="middle" class="m">600px</text>
<line x1="172" y1="70" x2="192" y2="70" stroke="#8A8A8A" stroke-width="1.3" marker-end="url(#a)"/>

<rect x="195" y="42" width="140" height="56" rx="6" fill="#F4F8FD" stroke="#2F6DB5"/>
<text x="265" y="64" text-anchor="middle" class="s">1vw = 창 폭의 1%</text>
<text x="265" y="86" text-anchor="middle" class="m">1vw = 6px</text>
<line x1="337" y1="70" x2="357" y2="70" stroke="#8A8A8A" stroke-width="1.3" marker-end="url(#a)"/>

<rect x="360" y="42" width="140" height="56" rx="6" fill="#F4F8FD" stroke="#2F6DB5"/>
<text x="430" y="64" text-anchor="middle" class="s">× 8.333 (기울기)</text>
<text x="430" y="86" text-anchor="middle" class="m">8.333vw = 50px</text>
<line x1="502" y1="70" x2="522" y2="70" stroke="#8A8A8A" stroke-width="1.3" marker-end="url(#a)"/>

<rect x="525" y="42" width="140" height="56" rx="6" fill="#FDF6F0" stroke="#C2621A"/>
<text x="595" y="64" text-anchor="middle" class="s">+ y절편 −0.875rem</text>
<text x="595" y="86" text-anchor="middle" class="m">50 − 14 = 36px</text>
<line x1="667" y1="70" x2="687" y2="70" stroke="#8A8A8A" stroke-width="1.3" marker-end="url(#a)"/>

<rect x="690" y="42" width="140" height="56" rx="6" fill="#F7F7F7" stroke="#222"/>
<text x="760" y="64" text-anchor="middle" class="s">clamp(16, ·, 56)</text>
<text x="760" y="86" text-anchor="middle" class="m">36px = 2.25rem</text>

<text x="30" y="140" class="s">창 폭만 바꾸면 — <tspan fill="#2F6DB5">파랑(vw 몫)</tspan>은 창에 비례해 늘고 <tspan fill="#C2621A">주황(−14px)</tspan>은 어느 창에서나 같다</text>

<line x1="198" y1="155" x2="198" y2="370" stroke="#222" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="318" y1="155" x2="318" y2="370" stroke="#222" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="150" y1="370" x2="460" y2="370" stroke="#8A8A8A" stroke-width="1.2"/>
<text x="150" y="386" text-anchor="middle" class="x">0</text>
<text x="198" y="386" text-anchor="middle" class="x">min 16px</text>
<text x="318" y="386" text-anchor="middle" class="x">max 56px</text>

<text x="30" y="178" class="b">360px 창</text>
<text x="30" y="194" class="x">1vw = 3.6px</text>
<rect x="150" y="168" width="90" height="18" fill="#2F6DB5" opacity="0.85"/>
<rect x="198" y="168" width="42" height="18" fill="#F6DCC6" stroke="#C2621A" stroke-width="1.2" stroke-dasharray="3 2"/>
<line x1="198" y1="162" x2="198" y2="192" stroke="#222" stroke-width="2.5"/>
<text x="500" y="182" class="m">30 − 14 = 16px</text>
<text x="640" y="182" class="s">→ 16px (min 에 닿음)</text>

<text x="30" y="230" class="b">600px 창</text>
<text x="30" y="246" class="x">1vw = 6px</text>
<rect x="150" y="220" width="150" height="18" fill="#2F6DB5" opacity="0.85"/>
<rect x="258" y="220" width="42" height="18" fill="#F6DCC6" stroke="#C2621A" stroke-width="1.2" stroke-dasharray="3 2"/>
<line x1="258" y1="214" x2="258" y2="244" stroke="#222" stroke-width="2.5"/>
<text x="500" y="234" class="m">50 − 14 = 36px</text>
<text x="640" y="234" class="s">→ 36px</text>

<text x="30" y="282" class="b">840px 창</text>
<text x="30" y="298" class="x">1vw = 8.4px</text>
<rect x="150" y="272" width="210" height="18" fill="#2F6DB5" opacity="0.85"/>
<rect x="318" y="272" width="42" height="18" fill="#F6DCC6" stroke="#C2621A" stroke-width="1.2" stroke-dasharray="3 2"/>
<line x1="318" y1="266" x2="318" y2="296" stroke="#222" stroke-width="2.5"/>
<text x="500" y="286" class="m">70 − 14 = 56px</text>
<text x="640" y="286" class="s">→ 56px (max 에 닿음)</text>

<text x="30" y="334" class="b">1200px 창</text>
<text x="30" y="350" class="x">1vw = 12px</text>
<rect x="150" y="324" width="300" height="18" fill="#2F6DB5" opacity="0.85"/>
<rect x="408" y="324" width="42" height="18" fill="#F6DCC6" stroke="#C2621A" stroke-width="1.2" stroke-dasharray="3 2"/>
<line x1="408" y1="318" x2="408" y2="348" stroke="#8A8A8A" stroke-width="2" stroke-dasharray="3 2"/>
<line x1="318" y1="318" x2="318" y2="348" stroke="#222" stroke-width="2.5"/>
<text x="500" y="338" class="m">100 − 14 = 86px</text>
<text x="640" y="338" class="o">→ 56px (max 에서 잘림)</text>

<text x="30" y="412" class="s">vw 만 쓰면 원점을 지나는 비례선이다 — 고정 rem 을 더해 그 선을 평행이동해야 원하는 두 점을 지난다</text>
</svg>
