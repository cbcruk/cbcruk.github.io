<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" width="100%" role="img">
<title>이메일 로그인 컴포넌트를 명시적 상태 머신으로</title>
<desc>Mounting 에서 이메일 입력 대기나 코드 입력 대기로 간다. 이메일을 제출하면 SubmittingEmail 이 되고, 성공하면 코드 입력 대기로, 실패하면 다시 이메일 입력 대기로 돌아간다. 코드를 제출하면 SubmittingCode 가 되고, 성공하면 Success, 실패하면 코드 입력 대기로 돌아간다. 불리언 여러 개로 짜도 상태 머신은 생긴다 — 암시적이냐 명시적이냐의 차이다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:12px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.r{font-size:11.5px;fill:#B3261E}.g{font-size:11.5px;fill:#2E7D32}.x{font-size:12px;font-family:ui-monospace,Menlo,monospace;fill:#999;text-decoration:line-through}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#B3261E"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2E7D32"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2F6DB5"/></marker></defs>
<rect width="860" height="260" fill="#FFFFFF"/>
<rect x="30" y="100" width="120" height="50" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="90" y="129" text-anchor="middle" class="b">Mounting</text>
<rect x="200" y="30" width="180" height="50" rx="7" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1.5"/>
<text x="290" y="59" text-anchor="middle" class="b">AwaitingEmail</text>
<rect x="440" y="30" width="180" height="50" rx="7" fill="#FFF4DE" stroke="#B7791F" stroke-width="1.5"/>
<text x="530" y="59" text-anchor="middle" class="b">SubmittingEmail</text>
<rect x="200" y="170" width="180" height="50" rx="7" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1.5"/>
<text x="290" y="199" text-anchor="middle" class="b">AwaitingCode</text>
<rect x="440" y="170" width="180" height="50" rx="7" fill="#FFF4DE" stroke="#B7791F" stroke-width="1.5"/>
<text x="530" y="199" text-anchor="middle" class="b">SubmittingCode</text>
<rect x="680" y="170" width="150" height="50" rx="7" fill="#E3F1E4" stroke="#2E7D32" stroke-width="1.5"/>
<text x="755" y="199" text-anchor="middle" class="b">Success</text>
<path d="M150 115 L196 60" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<path d="M150 135 L196 190" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<path d="M380 48 H436" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<path d="M436 66 H384" stroke="#B3261E" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
<path d="M530 80 L340 166" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<path d="M380 188 H436" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<path d="M436 206 H384" stroke="#B3261E" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
<path d="M620 195 H676" stroke="#2E7D32" stroke-width="1.4" fill="none" marker-end="url(#ag)"/>
<text x="640" y="100" text-anchor="start" class="r">빨강 = 실패해서 되돌아감</text>
