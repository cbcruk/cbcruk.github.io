<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 220" width="100%" role="img">
<title>큰 Next.js 앱을 유지하는 아홉 가지</title>
<desc>TypeScript 를 쓰고, 모노레포(Lerna·Nx·Rush·Turborepo·yarn workspaces)로 나누고, Hygen 같은 생성기로 상용구를 찍고, Redux Toolkit 처럼 잘 정해진 패턴을 쓰고, 비동기 데이터는 React Query·SWR 로, 커밋은 Husky·Commitizen·Semantic Release 로, UI 는 Storybook 으로 보이고, 처음부터 유지할 수 있는 테스트를 쓰고, Dependabot 으로 패키지를 자동 갱신한다.</desc>
