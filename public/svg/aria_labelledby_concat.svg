<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 220" width="100%" role="img">
<title>aria-labelledby: id 목록의 텍스트를 순서대로 이어 이름을 만든다</title>
<desc>aria-labelledby 는 공백으로 구분한 id 목록을 받아 그 순서대로 각 요소의 텍스트를 이어 붙여 접근 가능한 이름을 만든다. 목록 항목은 라벨 span 과 값 span 을 둘 다 가리켜 "주행거리 10.4만km" 처럼 읽힌다. aria-label 과 함께 있으면 aria-labelledby 가 이긴다. 화면 텍스트를 aria-label 로 또 적어 중복하지 말고 가리킨다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:12px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.r{font-size:11.5px;fill:#B3261E}.g{font-size:11.5px;fill:#2E7D32}.x{font-size:12px;font-family:ui-monospace,Menlo,monospace;fill:#999;text-decoration:line-through}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#B3261E"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2E7D32"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2F6DB5"/></marker></defs>
<rect width="860" height="220" fill="#FFFFFF"/>
<rect x="30" y="40" width="360" height="110" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="210" y="79" text-anchor="middle" class="b">role="listitem"</text>
<text x="210" y="99" text-anchor="middle" class="m">aria-labelledby=</text>
<text x="210" y="119" text-anchor="middle" class="m">"km-label km-value"</text>
<rect x="450" y="40" width="170" height="50" rx="7" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1.5"/>
<text x="535" y="69" text-anchor="middle" class="m">#km-label 주행거리</text>
<rect x="450" y="100" width="170" height="50" rx="7" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1.5"/>
<text x="535" y="129" text-anchor="middle" class="m">#km-value 10.4만km</text>
<path d="M390 70 H446" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<path d="M390 120 H446" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<rect x="660" y="60" width="170" height="70" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="745" y="89" text-anchor="middle" class="b">이름</text>
<text x="745" y="109" text-anchor="middle" class="m">주행거리 10.4만km</text>
<text x="30" y="190" text-anchor="start" class="s">aria-label 과 같이 있으면 aria-labelledby 가 우선 · 설명은 aria-describedby</text>
</svg>
