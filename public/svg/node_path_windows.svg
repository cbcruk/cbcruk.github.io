<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" width="100%" role="img">
<title>Node 경로: path.join 으로 만들고, normalize 는 트래버설을 못 막는다</title>
<desc>윈도우즈에서 외부 경로의 파일을 읽을 때, 윈도우즈는 / 와 \ 를 둘 다 구분자로 받지만 path 메서드는 \ 로 만든다. 문자열로 쓰려면 슬래시를 쓰거나 백슬래시를 이스케이프하고, 권장은 path.join(USERPROFILE, Documents, file.txt) 다. path.normalize 는 .. 를 풀기만 해서 ../../etc/passwd 는 그대로 남는다 — 사용자 입력이면 path.resolve(base, input) 결과가 base 와 구분자로 시작하는지 확인한다.</desc>
<style>text{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;fill:#222}.b{font-size:13px;font-weight:600}.m{font-size:12px;font-family:ui-monospace,Menlo,monospace}.s{font-size:11.5px;fill:#555}.r{font-size:11.5px;fill:#B3261E}.g{font-size:11.5px;fill:#2E7D32}.x{font-size:12px;font-family:ui-monospace,Menlo,monospace;fill:#999;text-decoration:line-through}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#555"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#B3261E"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2E7D32"/></marker></defs>
<rect width="860" height="260" fill="#FFFFFF"/>
<rect x="30" y="30" width="380" height="90" rx="7" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
<text x="220" y="59" text-anchor="middle" class="b">쓰는 법</text>
<text x="220" y="79" text-anchor="middle" class="m">'C:/Users/u/Documents/f.txt'</text>
<text x="220" y="99" text-anchor="middle" class="m">'C:\\Users\\u\\Documents\\f.txt'</text>
<rect x="450" y="30" width="380" height="90" rx="7" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="640" y="59" text-anchor="middle" class="b">권장</text>
<text x="640" y="79" text-anchor="middle" class="m">path.join(USERPROFILE,</text>
<text x="640" y="99" text-anchor="middle" class="m">  'Documents', 'f.txt')</text>
<rect x="30" y="150" width="380" height="80" rx="7" fill="#FCE8E6" stroke="#B3261E" stroke-width="1.5"/>
<text x="220" y="174" text-anchor="middle" class="b">normalize 는 못 막는다</text>
<text x="220" y="194" text-anchor="middle" class="m">normalize('../../etc/passwd')</text>
<text x="220" y="214" text-anchor="middle" class="m">= '../../etc/passwd'</text>
<rect x="450" y="150" width="380" height="80" rx="7" fill="#E3F1E4" stroke="#2E7D32" stroke-width="1.5"/>
<text x="640" y="174" text-anchor="middle" class="b">사용자 입력이면</text>
<text x="640" y="194" text-anchor="middle" class="m">resolve(base, input)</text>
<text x="640" y="214" text-anchor="middle" class="m">.startsWith(base + sep)</text>
</svg>
